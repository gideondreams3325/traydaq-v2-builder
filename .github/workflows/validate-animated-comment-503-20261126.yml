name: Animated comment submission validation
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [".github/workflows/validate-animated-comment-503-20261126.yml"]
permissions:
  contents: read
  statuses: write
jobs:
  edge:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          repository: gideondreams3325/traydaq-v2
          ref: 877f510483ab23d74be8cd8e4d9d30a902c95bff
          path: private-src
          token: ${{ secrets.TRAYDAQ_V2_SOURCE_READ_TOKEN }}
          persist-credentials: false
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Check and test sticker moderation
        working-directory: private-src
        run: |
          set -e
          NO_COLOR=1 deno check --no-config --no-lock supabase/functions/firebase-discussions/index.ts supabase/functions/firebase-store-reviews/index.ts > "$RUNNER_TEMP/edge-check.log" 2>&1 || { echo "::error::Edge typecheck failed"; grep -E '(error:|TS[0-9]+|animatedStickerModeration\.ts:[0-9]+|lockfile|unexpected argument|node_modules|package.json)' "$RUNNER_TEMP/edge-check.log" | sed -E 's#(/home/runner/[^ ]*/private-src/)#private-src/#g' | cut -c1-180 | head -20 || true; exit 1; }
          NO_COLOR=1 deno test --no-config --no-lock -A supabase/functions/_shared/animatedStickerModeration_test.ts > "$RUNNER_TEMP/edge-test.log" 2>&1 || { echo "::error::Animated sticker regression test failed"; grep -E '^(FAILED|error:|test result:)' "$RUNNER_TEMP/edge-test.log" | cut -c1-150 | head -10 || true; exit 1; }
          grep -E 'ok \| [0-9]+ passed' "$RUNNER_TEMP/edge-test.log" | tail -1 || true
      - name: Report validation status
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          JOB_RESULT: ${{ job.status }}
        run: |
          if [ "$JOB_RESULT" = success ]; then STATE=success; else STATE=failure; fi
          payload="$(jq -n --arg state "$STATE" '{state:$state,context:"traydaq-v2/animated-comment-edge",description:"Animated comment regression validation"}')"
          curl --fail --silent --show-error -X POST -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" -d "$payload" >/dev/null
  android-source:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          repository: gideondreams3325/traydaq-v2
          ref: 877f510483ab23d74be8cd8e4d9d30a902c95bff
          path: private-src
          token: ${{ secrets.TRAYDAQ_V2_SOURCE_READ_TOKEN }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install dependencies
        working-directory: private-src/mobile
        run: npm install --no-audit --no-fund > "$RUNNER_TEMP/install.log" 2>&1
      - name: Validate Android source
        working-directory: private-src/mobile
        run: |
          npm run typecheck > "$RUNNER_TEMP/typecheck.log" 2>&1 || { echo "::error::Android typecheck failed"; grep -E 'DiscussionPanel\.tsx\([0-9]+,[0-9]+\): error TS[0-9]+' "$RUNNER_TEMP/typecheck.log" | sed -E 's/(: error TS[0-9]+):.*/\1/' || true; grep -oE 'error TS[0-9]+' "$RUNNER_TEMP/typecheck.log" | sort | uniq -c || true; exit 1; }
          node --test tests/*.test.mjs > "$RUNNER_TEMP/tests.log" 2>&1 || { grep -E '^# (tests|pass|fail) [0-9]+$' "$RUNNER_TEMP/tests.log" | tail -3; exit 1; }
          grep -E '^# (tests|pass|fail) [0-9]+$' "$RUNNER_TEMP/tests.log" | tail -3
      - name: Report validation status
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          JOB_RESULT: ${{ job.status }}
        run: |
          if [ "$JOB_RESULT" = success ]; then STATE=success; else STATE=failure; fi
          payload="$(jq -n --arg state "$STATE" '{state:$state,context:"traydaq-v2/animated-comment-android",description:"Animated comment regression validation"}')"
          curl --fail --silent --show-error -X POST -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" -d "$payload" >/dev/null
