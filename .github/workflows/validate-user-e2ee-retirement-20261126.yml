name: User chat E2EE retirement validation
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [".github/workflows/validate-user-e2ee-retirement-20261126.yml"]
permissions:
  contents: read
jobs:
  android-source:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CI: "1"
      EXPO_NO_TELEMETRY: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          repository: gideondreams3325/traydaq-v2
          ref: 56e73cbb3212e434dd9ce5ca20a34406d5eb5a11
          path: private-src
          token: ${{ secrets.TRAYDAQ_V2_SOURCE_READ_TOKEN }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install dependencies
        working-directory: private-src/mobile
        run: npm ci --no-audit --no-fund > "$RUNNER_TEMP/install.log" 2>&1
      - name: Source tests
        working-directory: private-src/mobile
        run: |
          set +e
          node --test tests/*.test.mjs > "$RUNNER_TEMP/tests.log" 2>&1
          rc=$?
          grep -E '^(not ok|# (tests|pass|fail) [0-9]+)' "$RUNNER_TEMP/tests.log" | cut -c1-180 | head -80
          exit "$rc"
      - name: TypeScript
        if: always()
        working-directory: private-src/mobile
        run: |
          npm run typecheck > "$RUNNER_TEMP/ts.log" 2>&1 || { grep -E 'error TS[0-9]+' "$RUNNER_TEMP/ts.log" | cut -c1-220 | head -20; exit 1; }
  web-source:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CI: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          repository: gideondreams3325/traydaq-v2
          ref: 56e73cbb3212e434dd9ce5ca20a34406d5eb5a11
          path: private-src
          token: ${{ secrets.TRAYDAQ_V2_SOURCE_READ_TOKEN }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install dependencies
        working-directory: private-src
        run: npm ci --no-audit --no-fund > "$RUNNER_TEMP/install.log" 2>&1
      - name: Retirement contract
        working-directory: private-src
        run: |
          node --test tests/user-e2ee-retirement-20261126.test.mjs > "$RUNNER_TEMP/retire.log" 2>&1 || { grep -E '^(not ok|# (tests|pass|fail))' "$RUNNER_TEMP/retire.log"; exit 1; }
          grep -E '^# (tests|pass|fail)' "$RUNNER_TEMP/retire.log"
      - name: Full web tests
        if: always()
        working-directory: private-src
        run: |
          set +e
          npm test > "$RUNNER_TEMP/tests.log" 2>&1
          rc=$?
          grep -E '^(not ok|# (tests|pass|fail) [0-9]+)' "$RUNNER_TEMP/tests.log" | cut -c1-180 | head -80
          exit "$rc"
      - name: TypeScript
        if: always()
        working-directory: private-src
        run: |
          npm run typecheck > "$RUNNER_TEMP/ts.log" 2>&1 || { grep -E 'error TS[0-9]+' "$RUNNER_TEMP/ts.log" | cut -c1-220 | head -20; exit 1; }
      - name: Build web
        if: always()
        working-directory: private-src
        run: npm run build > "$RUNNER_TEMP/build.log" 2>&1
  edge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          repository: gideondreams3325/traydaq-v2
          ref: 56e73cbb3212e434dd9ce5ca20a34406d5eb5a11
          path: private-src
          token: ${{ secrets.TRAYDAQ_V2_SOURCE_READ_TOKEN }}
          persist-credentials: false
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Check source
        working-directory: private-src
        run: |
          deno check --node-modules-dir=auto supabase/functions/firebase-member-chat/index.ts > "$RUNNER_TEMP/edge.log" 2>&1 || { grep -E 'TS[0-9]+|^error:' "$RUNNER_TEMP/edge.log" | cut -c1-180 | head -20; exit 1; }
  live-compatible-edge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          repository: gideondreams3325/traydaq-v2
          ref: 6d1c5d0919b018f324b026daac83e9427a018c5d
          path: live-src
          token: ${{ secrets.TRAYDAQ_V2_SOURCE_READ_TOKEN }}
          persist-credentials: false
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Check isolated live-compatible backend
        working-directory: live-src
        run: |
          deno check --node-modules-dir=auto supabase/functions/firebase-member-chat/index.ts > "$RUNNER_TEMP/edge.log" 2>&1 || { grep -E 'TS[0-9]+|^error:' "$RUNNER_TEMP/edge.log" | cut -c1-180 | head -20; exit 1; }
          deno test supabase/functions/_shared/e2eePilotRelay_test.ts > "$RUNNER_TEMP/relay.log" 2>&1 || { echo 'Historical relay tests failed'; exit 1; }
