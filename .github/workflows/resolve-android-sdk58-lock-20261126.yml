name: Resolve SDK 58 public dependency lock
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [".github/workflows/resolve-android-sdk58-lock-20261126.yml"]
permissions:
  contents: read
jobs:
  sdk58:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      CI: "1"
      EXPO_NO_TELEMETRY: "1"
      NODE_OPTIONS: "--max-old-space-size=6144"
    defaults:
      run:
        working-directory: private-src/mobile
    steps:
      - uses: actions/checkout@v4
        with:
          repository: gideondreams3325/traydaq-v2
          ref: 5a91a4098100c588fc65360714c8ff4f6f43eb41
          path: private-src
          token: ${{ secrets.TRAYDAQ_V2_SOURCE_READ_TOKEN }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Resolve SDK 58 dependencies in disposable workspace only
        run: |
          cp package-lock.json "$RUNNER_TEMP/original-lock.json"
          npm install expo@58.1.0 --registry=https://registry.npmjs.org --replace-registry-host=always --no-audit --no-fund > "$RUNNER_TEMP/upgrade.log" 2>&1 || {
            grep -Ei 'npm error (code|peer|could not resolve|conflicting|notarget|eresolve)' "$RUNNER_TEMP/upgrade.log" | cut -c1-180 | head -30 || true
            exit 1
          }
          node - <<'NODE'
          const fs=require('node:fs');
          const pkg=require('./package.json');
          const versions=require('expo/bundledNativeModules.json');
          for(const section of ['dependencies','devDependencies']){
            for(const name of Object.keys(pkg[section]||{})){
              if(name!=='expo'&&typeof versions[name]==='string')pkg[section][name]=versions[name];
            }
          }
          pkg.devDependencies['@types/react']='~19.3.0';
          fs.writeFileSync('package.json',JSON.stringify(pkg,null,2)+'\n');
          NODE
          npm install --registry=https://registry.npmjs.org --replace-registry-host=always --no-audit --no-fund > "$RUNNER_TEMP/fix.log" 2>&1 || {
            grep -Ei 'npm (error|ERR!) (code|peer|could not resolve|conflicting|notarget)|^Error:' "$RUNNER_TEMP/fix.log" | cut -c1-180 | head -40 || true
            exit 1
          }
          npx expo install --check > "$RUNNER_TEMP/check.log" 2>&1 || {
            grep -Ei 'expected version|should be updated|Error:' "$RUNNER_TEMP/check.log" | cut -c1-180 | head -40 || true
            exit 1
          }
          node -e 'for(const p of ["expo","react-native","react"]) console.log(p,require(p+"/package.json").version)'
      - name: Report verified public dependency metadata
        run: |
          node - <<'NODE'
          const fs=require('node:fs');
          const before=JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP+'/original-lock.json','utf8'));
          const after=require('./package-lock.json');
          const changed=Object.entries(after.packages).filter(([k,v])=>k&&JSON.stringify(before.packages[k])!==JSON.stringify(v));
          const removed=Object.keys(before.packages).filter(k=>k&&!(k in after.packages));
          for(const [key,item] of changed){
            if(!key.startsWith('node_modules/')||!/^https:\/\/registry\.npmjs\.org\//.test(item.resolved||'')||!item.integrity||item.link)
              throw Error('Non-public dependency metadata cannot be reported.');
          }
          const root={};
          for(const section of ['dependencies','devDependencies']){
            root[section]={};
            for(const [name,version] of Object.entries(after.packages[''][section]||{})){
              if(before.packages[''][section]?.[name]===version)continue;
              if(!before.packages[''][section]?.[name]||!after.packages['node_modules/'+name]?.resolved?.startsWith('https://registry.npmjs.org/'))
                throw Error('Unverified direct dependency metadata');
              root[section][name]=version;
            }
          }
          console.log('LOCK_ROOT '+JSON.stringify(root));
          for(const row of changed)console.log('LOCK_SET '+JSON.stringify(row));
          for(const key of removed)console.log('LOCK_REMOVE '+JSON.stringify(key));
          console.log('LOCK_COUNTS '+JSON.stringify([changed.length,removed.length]));
          NODE
      - name: Verify reproducible install
        run: npm ci --ignore-scripts --no-audit --no-fund > "$RUNNER_TEMP/verify.log" 2>&1
