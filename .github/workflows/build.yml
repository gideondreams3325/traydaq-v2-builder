name: TRAYDAQ V2 Native Android APK Builder

# Public runner builds private React Native source, not the old web/Capacitor main.
# APK rebuild request 2026-10-15: check newly configured permanent Android signing keystore.
# Manual APK rebuild request 2026-10-15: run native V2 tests, compile test APK, and verify Google OAuth certificate.
# Rebuild request: Home-only compact white navigation; updated navigation tests at native source d4269991c2bcffc092ccf1cc89ef37d741d4993d.
# Rebuild request: native notifications hardening at source commit 482e8253e9357c19a23a166e345b5dbe8ed88c86.
# Google OAuth on a test APK additionally requires Firebase registration of its actual signing certificate.
# Verified native source ref (fresh blank white design canvas; saved previous UI source): 4b5d52181188b87bd027b72059cdf22a2b922880
# Never print or upload private source; only publish the signed testing APK.
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/build.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: traydaq-v2-native-apk
  cancel-in-progress: false

jobs:
  android:
    name: TRAYDAQ V2 React Native standalone APK
    runs-on: ubuntu-latest
    timeout-minutes: 75
    env:
      CI: "1"
      EXPO_NO_TELEMETRY: "1"
      NODE_OPTIONS: "--max-old-space-size=6144"
      # Expo's real project UUID is committed in the native app.json.
      # FCM credentials remain private and entirely optional.
    defaults:
      run:
        working-directory: private-src/mobile
    steps:
      - name: Verify private V2 repository read access
        working-directory: .
        shell: bash
        env:
          SOURCE_TOKEN_CONFIGURED: ${{ secrets.TRAYDAQ_V2_SOURCE_READ_TOKEN != '' }}
        run: |
          if [ "$SOURCE_TOKEN_CONFIGURED" != "true" ]; then
            echo "::error::TRAYDAQ_V2_SOURCE_READ_TOKEN must have read-only Contents access to private traydaq-v2."
            exit 1
          fi

      - name: Check out only the private React Native migration branch
        uses: actions/checkout@v4
        with:
          repository: gideondreams3325/traydaq-v2
          ref: feat/v2-new-home-feed
          path: private-src
          token: ${{ secrets.TRAYDAQ_V2_SOURCE_READ_TOKEN }}
          persist-credentials: false
          fetch-depth: 1

      - name: Identify exact native source commit
        shell: bash
        working-directory: private-src
        run: |
          echo "TRAYDAQ_SOURCE_REF=feat/v2-new-home-feed"
          echo "TRAYDAQ_SOURCE_SHA=$(git rev-parse HEAD)"
          test -f mobile/src/App.tsx
          test -f mobile/app.json
          test -f mobile/src/lib/firebase.ts
          test ! -d mobile/android

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Set up Android SDK with an available package
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android API 36
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Configure TRAYDAQ Firebase Android client and Expo EAS project
        shell: bash
        env:
          FIREBASE_CLIENT_B64: ${{ secrets.TRAYDAQ_V2_GOOGLE_SERVICES_JSON_B64 }}
        run: |
          set -euo pipefail
          EXPO_PUBLIC_EAS_PROJECT_ID="$(node -p "require('./app.json').expo.extra?.eas?.projectId || ''")"
          if [[ ! "$EXPO_PUBLIC_EAS_PROJECT_ID" =~ ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}$ ]]; then
            echo "::error::TRAYDAQ V2 Expo project UUID missing or invalid in app.json."
            exit 1
          fi
          echo "EXPO_PUBLIC_EAS_PROJECT_ID=$EXPO_PUBLIC_EAS_PROJECT_ID" >> "$GITHUB_ENV"
          # The client-side google-services.json ships from the PRIVATE source repository.
          # Preserve a one-time secret fallback for prior builders; never publish it as an artifact.
          if [[ ! -f google-services.json && -n "${FIREBASE_CLIENT_B64:-}" ]]; then
            printf '%s' "$FIREBASE_CLIENT_B64" | base64 -d > google-services.json
          fi
          if [[ ! -f google-services.json ]]; then
            echo "::notice::FCM Android client missing; private in-app order alerts remain enabled."
            exit 0
          fi
          chmod 600 google-services.json
          node - <<'NODE'
          const fs=require('node:fs');
          const info=JSON.parse(fs.readFileSync('google-services.json','utf8'));
          const match=(info.client||[]).some(c=>
            c.client_info?.android_client_info?.package_name==='com.traydaq.app');
          if(!match || info.project_info?.project_id!=='traydaq' ||
             info.project_info?.project_number!=='378411176192'){
            throw new Error('Firebase client does not match TRAYDAQ V2 Android registration.');
          }
          if('private_key' in info || 'private_key_id' in info)
            throw new Error('Never put a Firebase Admin service-account key in the Android APK.');
          console.log('Verified TRAYDAQ V2 Android Firebase client (no private keys).');
          NODE

      - name: Install native packages
        run: npm install --no-audit --no-fund

      - name: Validate all native security, redesign, and studio tests
        run: node --test tests/*.test.mjs

      - name: Validate Expo dependencies
        run: npx expo-doctor

      - name: Check React Native TypeScript
        run: npm run typecheck

      - name: Bundle native Android JavaScript
        run: npx expo export --platform android

      - name: Generate native Android project
        run: npx expo prebuild --platform android --non-interactive

      - name: Build standalone signed APK
        working-directory: private-src/mobile/android
        shell: bash
        run: |
          set -euo pipefail
          chmod +x ./gradlew
          # Release variant embeds JS/Hermes assets; no Metro dev server is needed.
          # Expo-generated default debug keystore is used for this TEST build only.
          ./gradlew --no-daemon :app:assembleRelease

      - name: Apply persistent TRAYDAQ signing certificate when securely configured
        working-directory: private-src/mobile
        shell: bash
        env:
          TRAYDAQ_SIGN_JKS_B64: ${{ secrets.TRAYDAQ_V2_UPLOAD_KEYSTORE_B64 }}
          TRAYDAQ_SIGN_STOREPASS: ${{ secrets.TRAYDAQ_V2_UPLOAD_KEYSTORE_PASSWORD }}
          TRAYDAQ_SIGN_KEYPASS: ${{ secrets.TRAYDAQ_V2_UPLOAD_KEY_PASSWORD }}
          TRAYDAQ_SIGN_ALIAS: ${{ secrets.TRAYDAQ_V2_UPLOAD_KEY_ALIAS }}
        run: |
          set -euo pipefail
          APK=android/app/build/outputs/apk/release/app-release.apk
          SIGNER="$ANDROID_HOME/build-tools/36.0.0/apksigner"
          if [[ -n "${TRAYDAQ_SIGN_JKS_B64:-}" ]]; then
            if [[ -z "${TRAYDAQ_SIGN_STOREPASS:-}" || -z "${TRAYDAQ_SIGN_KEYPASS:-}" || -z "${TRAYDAQ_SIGN_ALIAS:-}" ]]; then
              echo "::error::Upload keystore exists but password/alias secrets are missing."
              exit 1
            fi
            umask 077
            KEYSTORE="$RUNNER_TEMP/traydaq-private-upload-signing.jks"
            printf '%s' "$TRAYDAQ_SIGN_JKS_B64" | base64 -d > "$KEYSTORE"
            trap 'rm -f "$KEYSTORE" "$RUNNER_TEMP/traydaq-resigned.apk"' EXIT
            "$SIGNER" sign --ks "$KEYSTORE" --ks-key-alias "$TRAYDAQ_SIGN_ALIAS"               --ks-pass env:TRAYDAQ_SIGN_STOREPASS --key-pass env:TRAYDAQ_SIGN_KEYPASS               --out "$RUNNER_TEMP/traydaq-resigned.apk" "$APK"
            "$SIGNER" verify "$RUNNER_TEMP/traydaq-resigned.apk"
            mv "$RUNNER_TEMP/traydaq-resigned.apk" "$APK"
            echo "TRAYDAQ stable upload certificate applied securely."
          else
            echo "::warning::A temporary test-signing certificate is in use. For Google Sign-In, register the installed APK's actual SHA or securely configure the permanent upload keystore."
          fi
          CERT_SHA=$("$SIGNER" verify --print-certs "$APK" | sed -n 's/^Signer #1 certificate SHA-1 digest: //p' | head -1)
          # Firebase may retain multiple Android OAuth clients after adding a new signing key.
          # Match the actual signed APK against ANY registered SHA-1 for this package.
          REGISTERED_SHAS=$(node -e "const j=require('./google-services.json'); const shas=(j.client||[]).flatMap(x=>x.oauth_client||[]).filter(c=>c.client_type===1&&c.android_info?.package_name==='com.traydaq.app').map(c=>(c.android_info?.certificate_hash||'').replace(/:/g,'').toLowerCase()).filter(s=>/^[0-9a-f]{40}$/.test(s)); process.stdout.write(shas.join(' '))")
          if [[ -z "$REGISTERED_SHAS" ]]; then
            echo "::error::Google Sign-In Android OAuth client is missing from google-services.json."
            exit 1
          fi
          CERT_MATCHED=false
          for REGISTERED_SHA in $REGISTERED_SHAS; do
            if [[ "${CERT_SHA,,}" == "$REGISTERED_SHA" ]]; then CERT_MATCHED=true; break; fi
          done
          if [[ "$CERT_MATCHED" != "true" ]]; then
            echo "::warning::Google Sign-In is NOT READY: signed APK SHA-1 differs from Firebase Android OAuth registration."
            echo "TRAYDAQ_GOOGLE_SIGN_IN_SHA_MISMATCH=true" >> "$GITHUB_ENV"
            {
              echo "### Google Sign-In not ready for this test APK"
              echo
              echo "- **Actual APK signing SHA-1:** \`$CERT_SHA\`"
              echo "- **Registered Firebase SHA-1 values:** \`$REGISTERED_SHAS\`"
              echo "- APK can be downloaded for other feature testing only; Google Sign-In will fail."
              echo "- Configure one persistent Android signing keystore in the builder's Actions secrets, register its SHA-1 and SHA-256 in Firebase for \`com.traydaq.app\`, and refresh the private app's \`google-services.json\`."
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "TRAYDAQ_GOOGLE_SIGN_IN_SHA_MISMATCH=false" >> "$GITHUB_ENV"
            echo "Verified Google Sign-In Android OAuth certificate matches signed APK."
          fi

      - name: Verify native APK is installable and has an offline bundle
        shell: bash
        run: |
          set -euo pipefail
          APK=android/app/build/outputs/apk/release/app-release.apk
          test -s "$APK"
          unzip -t "$APK" >/dev/null
          unzip -Z1 "$APK" | grep -E '^assets/(index.android.bundle|.*\.hbc)$'
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify "$APK"
          sha256sum "$APK"
          mkdir -p build-output
          cp "$APK" build-output/TRAYDAQ-V2-native-test.apk

      - name: Upload APK only (never private source)
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.TRAYDAQ_GOOGLE_SIGN_IN_SHA_MISMATCH == 'true' && 'TRAYDAQ-V2-test-APK-GOOGLE-SIGNIN-NOT-READY' || 'TRAYDAQ-V2-native-test-APK' }}
          path: private-src/mobile/build-output/TRAYDAQ-V2-native-test.apk
          if-no-files-found: error
          retention-days: 14

      # A test APK is a valid build artifact even when an independently-configured
      # Firebase sign-in provider is not yet ready. Do not hide the OAuth warning,
      # and never label this artifact as Google-login-ready.
      - name: Report Google OAuth setup needed for the QA APK
        if: ${{ env.TRAYDAQ_GOOGLE_SIGN_IN_SHA_MISMATCH == 'true' }}
        shell: bash
        run: |
          echo "::warning::Android test APK build succeeded, but Google Sign-In will not work yet. Configure the persistent Android keystore in Actions secrets and add its SHA-1/SHA-256 to Firebase, then refresh google-services.json."
          {
            echo
            echo "### APK build result: SUCCESS for non-Google Android testing"
            echo
            echo "Google Sign-In readiness: **BLOCKED** (signer mismatch)."
            echo
            echo "This green workflow means compilation, tests, APK signature and artifact upload passed — it does not certify that Google OAuth works."
            echo
            echo "To enable Google Sign-In, add the persistent signing keystore and credentials to the builder's four \`TRAYDAQ_V2_UPLOAD_KEYSTORE_*\` Actions secrets, register the key's fingerprints in Firebase, update the private source's \`mobile/google-services.json\` and rebuild."
            echo
            echo "Firebase Android settings: https://console.firebase.google.com/project/traydaq/settings/general"
          } >> "$GITHUB_STEP_SUMMARY"
