name: TRAYDAQ Android 100MiB Quality Draft Sound Live Refresh QA
on:
  push:
    branches: [main]
    paths: ['.github/workflows/android-quality-draft-sound-live-20261119.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: traydaq-android-quality-draft-sound-live-qa
  cancel-in-progress: false
env:
  PRIVATE_SOURCE_SHA: eafd21261c049c32fc076ec4c2b6e7e327302a60
  CI: '1'
  EXPO_NO_TELEMETRY: '1'
jobs:
  android:
    name: Full Android regression tests, TypeScript and JavaScript export (no APK)
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - name: Checkout exact private source
        uses: actions/checkout@v4
        with:
          repository: gideondreams3325/traydaq-v2
          ref: ${{ env.PRIVATE_SOURCE_SHA }}
          path: candidate
          token: ${{ secrets.TRAYDAQ_V2_SOURCE_READ_TOKEN }}
          persist-credentials: false
          fetch-depth: 1
      - name: Verify immutable candidate
        run: test "$(git -C candidate rev-parse HEAD)" = "$PRIVATE_SOURCE_SHA"
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: candidate/mobile/package-lock.json
      - name: Install locked native dependencies
        working-directory: candidate/mobile
        run: npm ci --no-audit --no-fund > "$RUNNER_TEMP/npm-android.log" 2>&1
      - name: Focused quality drafts and sound tests
        working-directory: candidate/mobile
        run: |
          node --test tests/android-quality-draft-sound-live-20261119.test.mjs tests/android-three-minute-video-upload.test.mjs tests/drafts-v2.test.mjs tests/android-reusable-sounds-20261117.test.mjs > "$RUNNER_TEMP/focused.log" 2>&1 || {
            grep -A 18 -E '^not ok [0-9]+ - ' "$RUNNER_TEMP/focused.log" | tail -100 || true
            grep -E '^# (tests|pass|fail)' "$RUNNER_TEMP/focused.log" | tail -4 || true
            exit 1
          }
          grep -E '^# (tests|pass|fail)' "$RUNNER_TEMP/focused.log" | tail -4
      - name: Full Android regression tests
        working-directory: candidate/mobile
        run: |
          node --test tests/*.test.mjs > "$RUNNER_TEMP/all.log" 2>&1 || {
            grep -A 22 -E '^not ok [0-9]+ - ' "$RUNNER_TEMP/all.log" | tail -180 || true
            grep -E '^# (tests|pass|fail)' "$RUNNER_TEMP/all.log" | tail -4 || true
            exit 1
          }
          grep -E '^# (tests|pass|fail)' "$RUNNER_TEMP/all.log" | tail -4
      - name: Android TypeScript and JS export
        working-directory: candidate/mobile
        run: |
          npm run typecheck > "$RUNNER_TEMP/ts.log" 2>&1 || {
            grep -E 'error TS' "$RUNNER_TEMP/ts.log" | head -30 || true
            exit 1
          }
          npm run export:android > "$RUNNER_TEMP/export.log" 2>&1 || {
            tail -28 "$RUNNER_TEMP/export.log" || true
            exit 1
          }
          echo 'PASS Android regressions, TS and JS export - no APK/AAB produced.'
# Read-only validation; no production writes, signing, release or Play rollout.
