name: TRAYDAQ V2 Private Source Validation (Cloudflare + Android)

# This public controller reads the private TRAYDAQ source at a fixed feature
# branch. It never pushes or publishes the app and never bundles private source
# files into public workflow artifacts.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/validate-private-pr66.yml"
      - ".github/traydaq-v2-validation-request.txt"

permissions:
  contents: read

concurrency:
  group: traydaq-v2-pr66-source-validation
  cancel-in-progress: true

jobs:
  web-cloudflare:
    name: Private web tests and Cloudflare asset build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CI: "1"
    steps:
      - name: Verify read-only private-source token is configured
        env:
          SOURCE_TOKEN_CONFIGURED: ${{ secrets.TRAYDAQ_V2_SOURCE_READ_TOKEN != '' }}
        run: |
          if [ "$SOURCE_TOKEN_CONFIGURED" != "true" ]; then
            echo "::error::Private-source read token is not configured for the public builder."
            exit 1
          fi
      - name: Check out private feature source without persisting credentials
        uses: actions/checkout@v4
        with:
          repository: gideondreams3325/traydaq-v2
          ref: feat/restore-owner-deletion-without-recovery-20261027
          path: private-src
          token: ${{ secrets.TRAYDAQ_V2_SOURCE_READ_TOKEN }}
          persist-credentials: false
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: private-src/package-lock.json
      - name: Verify Cloudflare configuration and source commit
        working-directory: private-src
        shell: bash
        run: |
          set -euo pipefail
          test -f wrangler.jsonc
          test -f package-lock.json
          node --input-type=module -e "
            import {readFileSync} from 'node:fs';
            const c=JSON.parse(readFileSync('wrangler.jsonc','utf8'));
            if(c.name!=='traydaq-v2'||c.assets?.directory!=='./dist')
              throw Error('Unexpected Cloudflare Workers assets configuration');
          "
          echo "Private source ref: feat/restore-owner-deletion-without-recovery-20261027"
          echo "Private source SHA: $(git rev-parse HEAD)"
          echo "Hosting validation target: Cloudflare Workers, not Vercel"
      - name: Install private web dependencies with protected logs
        working-directory: private-src
        shell: bash
        run: |
          if npm ci --no-audit --no-fund > "$RUNNER_TEMP/traydaq-web-install.log" 2>&1; then
            echo "PASS: private web dependencies installed"
          else
            echo "::error::FAIL: private web dependency installation. Full diagnostics were not exposed in this public log."
            exit 1
          fi
      - name: Run private web tests
        working-directory: private-src
        shell: bash
        run: |
          if npm test > "$RUNNER_TEMP/traydaq-web-tests.log" 2>&1; then
            echo "PASS: private web tests"
            grep -E '^# (tests|pass|fail) [0-9]+$' "$RUNNER_TEMP/traydaq-web-tests.log" | tail -3 || true
          else
            echo "::error::FAIL: private web tests. Source-level test diagnostics remain private."
            grep -E '^# (tests|pass|fail) [0-9]+$' "$RUNNER_TEMP/traydaq-web-tests.log" | tail -3 || true
            exit 1
          fi
      - name: Typecheck private web app
        working-directory: private-src
        shell: bash
        run: |
          if npm run typecheck > "$RUNNER_TEMP/traydaq-web-tsc.log" 2>&1; then
            echo "PASS: web TypeScript"
          else
            echo "::error::FAIL: web TypeScript. Private code diagnostics were not published."
            exit 1
          fi
      - name: Validate Cloudflare web build
        working-directory: private-src
        shell: bash
        run: |
          if npm run build > "$RUNNER_TEMP/traydaq-web-build.log" 2>&1 && test -f dist/index.html; then
            echo "PASS: Cloudflare web asset build and policy-output verification"
          else
            echo "::error::FAIL: Cloudflare-targeted web build. No deployment was attempted."
            exit 1
          fi

  android-source:
    name: Private Android tests and TypeScript validation
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CI: "1"
      EXPO_NO_TELEMETRY: "1"
    steps:
      - name: Verify private source token
        env:
          SOURCE_TOKEN_CONFIGURED: ${{ secrets.TRAYDAQ_V2_SOURCE_READ_TOKEN != '' }}
        run: |
          if [ "$SOURCE_TOKEN_CONFIGURED" != "true" ]; then
            echo "::error::Private-source read token is missing."
            exit 1
          fi
      - name: Check out private feature source without persisting credentials
        uses: actions/checkout@v4
        with:
          repository: gideondreams3325/traydaq-v2
          ref: feat/restore-owner-deletion-without-recovery-20261027
          path: private-src
          token: ${{ secrets.TRAYDAQ_V2_SOURCE_READ_TOKEN }}
          persist-credentials: false
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Confirm native source location and revision
        working-directory: private-src/mobile
        run: |
          test -f src/App.tsx
          test -f package.json
          echo "Private native source SHA: $(git rev-parse HEAD)"
      - name: Install private Android dependencies with protected logs
        working-directory: private-src/mobile
        shell: bash
        run: |
          if npm install --no-audit --no-fund > "$RUNNER_TEMP/traydaq-native-install.log" 2>&1; then
            echo "PASS: private native dependencies installed"
          else
            echo "::error::FAIL: native dependency installation. Private logs were not published."
            exit 1
          fi
      - name: Run private native test suite
        working-directory: private-src/mobile
        shell: bash
        run: |
          if node --test tests/*.test.mjs > "$RUNNER_TEMP/traydaq-native-tests.log" 2>&1; then
            echo "PASS: private native tests"
            grep -E '^# (tests|pass|fail) [0-9]+$' "$RUNNER_TEMP/traydaq-native-tests.log" | tail -3 || true
          else
            echo "::error::FAIL: private native tests. Private failure details were not exposed."
            grep -E '^# (tests|pass|fail) [0-9]+$' "$RUNNER_TEMP/traydaq-native-tests.log" | tail -3 || true
            exit 1
          fi
      - name: Typecheck private React Native app
        working-directory: private-src/mobile
        shell: bash
        run: |
          if npm run typecheck > "$RUNNER_TEMP/traydaq-native-tsc.log" 2>&1; then
            echo "PASS: Android TypeScript"
          else
            echo "::error::FAIL: Android TypeScript. Private source errors were not published."
            exit 1
          fi
