name: TRAYDAQ V2 User Web 18+ Checkbox Release (Cloudflare Only)
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/18plus-checkbox-web-cloudflare-publish.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: traydaq-v2-user-web-cloudflare-only
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out the exact merged private V2 web source (no source artifacts)
        uses: actions/checkout@v4
        with:
          repository: gideondreams3325/traydaq-v2
          ref: 44691382958646a0bed0e0703aef92512571c4c3
          path: private-src
          token: ${{ secrets.TRAYDAQ_V2_SOURCE_READ_TOKEN }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        working-directory: private-src
        run: npm ci --no-audit --no-fund
      - name: Full web regression tests
        working-directory: private-src
        run: npm test
      - name: TypeScript verification
        working-directory: private-src
        run: npm run typecheck
      - name: Produce public web static bundle
        working-directory: private-src
        run: npm run build
      - name: Validate Cloudflare credentials and existing project target
        env:
          CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || vars.CLOUDFLARE_ACCOUNT_ID }}
          CF_PAGES_PROJECT: ${{ vars.CLOUDFLARE_PAGES_PROJECT || 'traydaq-v2' }}
        run: |
          set -euo pipefail
          if [ -z "$CF_API_TOKEN" ]; then echo "::error::Missing CLOUDFLARE_API_TOKEN in V2 Builder Secrets"; exit 1; fi
          if [ -z "$CF_ACCOUNT_ID" ]; then echo "::error::Missing CLOUDFLARE_ACCOUNT_ID in V2 Builder Secrets/Variables"; exit 1; fi
          test -n "$CF_PAGES_PROJECT"
      - name: Publish only the compiled public website to existing Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || vars.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: private-src
          command: pages deploy dist --project-name=${{ vars.CLOUDFLARE_PAGES_PROJECT || 'traydaq-v2' }} --branch=main --commit-hash=44691382958646a0bed0e0703aef92512571c4c3
# Guardrails: No APK/AAB, Play upload, DNS edit, Supabase migration,
# private source artifacts, or publishing the private repository contents.
