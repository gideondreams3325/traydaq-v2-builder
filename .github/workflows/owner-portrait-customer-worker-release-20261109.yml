name: TRAYDAQ Official Owner Portrait - Existing Cloudflare Customer Worker Publish
# Authorized public web-only publish. No Android APK/AAB, staff/legal Worker, DNS or DB actions.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/owner-portrait-customer-worker-release-20261109.yml
permissions:
  contents: read
concurrency:
  group: traydaq-existing-customer-worker-portrait-release
  cancel-in-progress: false
jobs:
  publish-existing-customer-worker:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: private-src
    steps:
      - name: Read exact authorized private TRAYDAQ V2 source
        uses: actions/checkout@v4
        with:
          repository: gideondreams3325/traydaq-v2
          ref: 781a798011749f9265b9dc92b9164b961a643917
          path: private-src
          token: ${{ secrets.TRAYDAQ_V2_SOURCE_READ_TOKEN }}
          persist-credentials: false
      - name: Confirm fixed source and customer Worker target
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "781a798011749f9265b9dc92b9164b961a643917"
          node --input-type=module -e "
            import {readFileSync} from 'node:fs';
            const c=JSON.parse(readFileSync('wrangler.jsonc','utf8'));
            if(c.name!=='traydaq-v2'||c.main!=='./worker/seo.js'||c.assets?.directory!=='./dist')throw Error('Not the existing TRAYDAQ customer Worker');
          "
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: private-src/package-lock.json
      - name: Install locked website dependencies
        run: npm ci --no-audit --no-fund
      - name: Full customer web tests and TypeScript verification
        run: npm test && npm run typecheck
      - name: Build Cloudflare customer Worker assets
        run: npm run build
      - name: Verify portrait asset and SEO files included in actual bundle
        run: |
          node --input-type=module -e "
            import {readFileSync,existsSync} from 'node:fs';
            const file='dist/traydaq-owner-gideon-manu-appiah-fenyi-friempong.webp';
            if(!existsSync(file))throw Error('Owner portrait missing from build');
            const b=readFileSync(file);
            if(b.length<5000||b.toString('ascii',0,4)!=='RIFF'||b.toString('ascii',8,12)!=='WEBP')throw Error('Invalid owner portrait asset');
            for(const page of ['dist/about/index.html','dist/ownership/index.html']) {
              if(!readFileSync(page,'utf8').includes('GIDEON MANU APPIAH FENYI FRIEMPONG'))throw Error('Owner name missing from '+page);
            }
            console.log('PASS: owner portrait asset, About and Ownership included in Cloudflare build');
          "
          node scripts/verify-public-search-output.mjs dist
      - name: Verify credentials and read-only existing Worker access; fail closed
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          node scripts/verify-existing-customer-worker.mjs
      - name: Deploy only the existing traydaq-v2 Cloudflare customer Worker
        uses: cloudflare/wrangler-action@v3
        with:
          workingDirectory: private-src
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || vars.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: 4.156.2
          command: deploy --config wrangler.jsonc
      - name: Confirm exact authorized website release
        run: echo 'Customer traydaq-v2 Worker deployed from approved commit 781a798011749f9265b9dc92b9164b961a643917. No staff/legal Worker or Android app deployed.'
