name: TRAYDAQ V2 12+ Signup Draft Validation (No Deployment)

on:
  push:
    branches: [main]
    paths:
      - ".github/traydaq-age-12-draft-validation-request.txt"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out private draft source
        uses: actions/checkout@v4
        with:
          repository: gideondreams3325/traydaq-v2
          ref: feat/signup-age-12-checkbox-no-dob-20261026
          path: private-src
          token: ${{ secrets.TRAYDAQ_V2_SOURCE_READ_TOKEN }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install web packages
        working-directory: private-src
        run: npm install --no-audit --no-fund
      - name: Test web source
        working-directory: private-src
        run: npm test
      - name: Verify web TypeScript
        working-directory: private-src
        if: always()
        run: npm run typecheck
      - name: Compile web assets without deployment
        working-directory: private-src
        if: always()
        run: npm run build

  android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out private draft source
        uses: actions/checkout@v4
        with:
          repository: gideondreams3325/traydaq-v2
          ref: feat/signup-age-12-checkbox-no-dob-20261026
          path: private-src
          token: ${{ secrets.TRAYDAQ_V2_SOURCE_READ_TOKEN }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install native packages
        working-directory: private-src/mobile
        run: npm install --no-audit --no-fund
      - name: Native regression tests
        working-directory: private-src/mobile
        run: node --test tests/*.test.mjs
      - name: Native TypeScript
        working-directory: private-src/mobile
        if: always()
        run: npm run typecheck
      - name: Expo dependency validation
        working-directory: private-src/mobile
        if: always()
        run: npx expo-doctor
# Do not compile or publish APK/AAB, deploy web or alter backend.
