name: TRAYDAQ V2 Public Builder

# Manually run builds from a separate public repository. Never build untrusted
# pull requests with a token that can read the private source.
on:
  # Trigger one controlled preview build when this workflow changes on main.
  # Never run pull-request code with access to the private source token.
  push:
    branches: [main]
    paths:
      - ".github/workflows/build.yml"
  workflow_dispatch:
    inputs:
      target:
        description: "Build target"
        required: true
        type: choice
        default: web-check
        options:
          - web-check
          - android-preview
      source_ref:
        description: "Approved private source branch"
        required: true
        type: choice
        default: feat/v2-live-data-foundation
        options:
          - feat/v2-live-data-foundation
          - main

permissions:
  contents: read

concurrency:
  group: traydaq-v2-builder-serial
  cancel-in-progress: false

jobs:
  build:
    name: Private source - ${{ github.event_name == 'push' && 'android-preview' || inputs.target }}
    runs-on: ubuntu-latest
    env:
      BUILD_TARGET: ${{ github.event_name == 'push' && 'android-preview' || inputs.target }}
    timeout-minutes: 65
    steps:
      - name: Require the private-source read token
        shell: bash
        env:
          SOURCE_TOKEN_CONFIGURED: ${{ secrets.TRAYDAQ_V2_SOURCE_READ_TOKEN != '' }}
        run: |
          if [ "$SOURCE_TOKEN_CONFIGURED" != "true" ]; then
            echo "::error::Add TRAYDAQ_V2_SOURCE_READ_TOKEN as a repository Actions secret with read-only Contents access exclusively to the private traydaq-v2 repository."
            exit 1
          fi

      - name: Check out private TRAYDAQ V2 source (never publish)
        uses: actions/checkout@v4
        with:
          repository: gideondreams3325/traydaq-v2
          ref: ${{ inputs.source_ref || 'feat/v2-live-data-foundation' }}
          path: private-src
          token: ${{ secrets.TRAYDAQ_V2_SOURCE_READ_TOKEN }}
          persist-credentials: false
          fetch-depth: 1

      - name: Show build metadata (not private source)
        working-directory: private-src
        shell: bash
        run: |
          echo "Source ref: ${{ inputs.source_ref || 'feat/v2-live-data-foundation' }}"
          echo "Source SHA: $(git rev-parse HEAD)"
          echo "Build target: $BUILD_TARGET"

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install private-source dependencies
        working-directory: private-src
        run: npm install --no-audit --no-fund

      - name: Run TRAYDAQ source tests
        working-directory: private-src
        run: npm test

      - name: Build TRAYDAQ React web bundle
        working-directory: private-src
        run: npm run build

      - name: Verify Creator Studio reviewer workflow
        working-directory: private-src
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'case "studio"' src/App.tsx
          grep -q 'onDecision' src/components/ReviewerWorkspace.tsx
          grep -q 'MyPictureSubmissions' src/App.tsx

      - name: Verify publication safety gates
        working-directory: private-src
        shell: bash
        run: |
          set -euo pipefail
          test -s supabase/functions/publish-picture/index.ts
          test -s supabase/migrations/202610120016_publication.sql
          grep -q 'Publish to For You' src/components/ReviewerWorkspace.tsx

      - name: Verify generated app
        working-directory: private-src
        shell: bash
        run: |
          set -euo pipefail
          test -s dist/index.html
          test -d dist/assets
          echo "Web bundle generated. No private source or web bundle is uploaded by the public builder."

      # The Android wrapper is created in the ephemeral build workspace.
      # It must not be confused with a tested, release-ready native application.
      - name: Explain Android preview signing
        if: ${{ env.BUILD_TARGET == 'android-preview' }}
        shell: bash
        env:
          KEYSTORE_CONFIGURED: ${{ secrets.TRAYDAQ_V2_DEBUG_KEYSTORE_B64 != '' }}
        run: |
          if [ "$KEYSTORE_CONFIGURED" != "true" ]; then
            echo "::warning::TEST APK ONLY: Android will create an ephemeral debug signing key. A future APK signed by a different key may require uninstalling the previous one. Firebase native Google sign-in is not verified."
          fi

      - name: Install Java 21
        if: ${{ env.BUILD_TARGET == 'android-preview' }}
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        if: ${{ env.BUILD_TARGET == 'android-preview' }}
        uses: android-actions/setup-android@v3
        with:
          # The old "tools" SDK package was retired. Installing it fails.
          packages: platform-tools

      - name: Add temporary Capacitor Android shell
        if: ${{ env.BUILD_TARGET == 'android-preview' }}
        working-directory: private-src
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-save --no-audit --no-fund \
            @capacitor/core@7 @capacitor/cli@7 @capacitor/android@7
          cat > capacitor.config.ts <<'CAP_CONFIG'
          import type { CapacitorConfig } from '@capacitor/cli';
          const config: CapacitorConfig = {
            appId: 'com.traydaq.app',
            appName: 'TRAYDAQ V2',
            webDir: 'dist'
          };
          export default config;
          CAP_CONFIG
          npx cap add android
          npx cap sync android
          # Respect Android 15 and notch-safe insets. This tested native
          # Activity lives in the private canonical V2 source repository.
          mkdir -p android/app/src/main/java/com/traydaq/app
          cp android-preview/MainActivity.java android/app/src/main/java/com/traydaq/app/MainActivity.java
          grep -q 'findViewById(android.R.id.content)' android/app/src/main/java/com/traydaq/app/MainActivity.java

      - name: Restore optional persistent debug signing certificate
        if: ${{ env.BUILD_TARGET == 'android-preview' }}
        shell: bash
        env:
          SIGNING_KEYSTORE_B64: ${{ secrets.TRAYDAQ_V2_DEBUG_KEYSTORE_B64 }}
        run: |
          set -euo pipefail
          if [ -n "$SIGNING_KEYSTORE_B64" ]; then
            mkdir -p "$HOME/.android"
            printf '%s' "$SIGNING_KEYSTORE_B64" | base64 --decode > "$HOME/.android/debug.keystore"
            chmod 600 "$HOME/.android/debug.keystore"
            keytool -list -keystore "$HOME/.android/debug.keystore" \
              -storepass android -alias androiddebugkey >/dev/null
          else
            echo "Using Android's temporary default debug certificate for this TEST APK."
          fi

      - name: Build Android preview APK
        if: ${{ env.BUILD_TARGET == 'android-preview' }}
        working-directory: private-src/android
        shell: bash
        run: |
          set -euo pipefail
          chmod +x ./gradlew
          ./gradlew --no-daemon assembleDebug
          test -s app/build/outputs/apk/debug/app-debug.apk
          # Verify APK ZIP integrity and log a digest without exposing source.
          unzip -t app/build/outputs/apk/debug/app-debug.apk >/dev/null
          sha256sum app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK only (never private source)
        if: ${{ env.BUILD_TARGET == 'android-preview' }}
        uses: actions/upload-artifact@v4
        with:
          name: TRAYDAQ-V2-debug-preview
          path: private-src/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
