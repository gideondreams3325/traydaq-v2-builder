name: TRAYDAQ Android Offline Music Play Counts PR466 QA (No Release)
# Exact immutable private source validation; never create APK/AAB or publish.
on:
  push:
    branches: [main]
    paths: ['.github/workflows/android-offline-music-play-count-pr466-20261116.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: traydaq-android-offline-counts-counts-pr466
  cancel-in-progress: false
env:
  PRIVATE_SOURCE_SHA: 916c76f1475a1bd79bb8ed49319b649a5f31b73b
  CI: '1'
  EXPO_NO_TELEMETRY: '1'
jobs:
  android:
    name: Full Android regressions, TypeScript, JS export only
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - name: Verify read-only private source connection
        env:
          HAS_TOKEN: ${{ secrets.TRAYDAQ_V2_SOURCE_READ_TOKEN != '' }}
        run: |
          test "$HAS_TOKEN" = true || { echo '::error::Private source read token missing'; exit 1; }
      - name: Checkout exact private Android source
        uses: actions/checkout@v4
        with:
          repository: gideondreams3325/traydaq-v2
          ref: ${{ env.PRIVATE_SOURCE_SHA }}
          token: ${{ secrets.TRAYDAQ_V2_SOURCE_READ_TOKEN }}
          path: private-src
          persist-credentials: false
      - name: Verify immutable source commit
        working-directory: private-src
        run: test "$(git rev-parse HEAD)" = "$PRIVATE_SOURCE_SHA"
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: private-src/mobile/package-lock.json
      - name: Install pinned Android dependencies
        working-directory: private-src/mobile
        shell: bash
        run: |
          if npm ci --no-audit --no-fund > "$RUNNER_TEMP/offline-counts-install.log" 2>&1; then
            echo 'PASS: Android pinned dependencies installed'
          else
            echo '::error::Android dependency installation failed'
            exit 1
          fi
      - name: Complete Android regression tests
        working-directory: private-src/mobile
        shell: bash
        run: |
          if node --test tests/*.test.mjs > "$RUNNER_TEMP/offline-counts-tests.log" 2>&1; then
            echo 'PASS: Android complete regression suite'
            awk '/^# (tests|pass|fail|cancelled|skipped) [0-9]+$/ {print}' "$RUNNER_TEMP/offline-counts-tests.log"
          else
            echo '::error::Android regression suite failed. Test names only follow.'
            awk '/^not ok [0-9]+ - / {print; failing=1; next} failing && /^  location: / {sub(/^.*\/tests\//,"tests/"); print "  " $0; failing=0}' "$RUNNER_TEMP/offline-counts-tests.log"
            awk '/^# (tests|pass|fail|cancelled|skipped) [0-9]+$/ {print}' "$RUNNER_TEMP/offline-counts-tests.log"
            exit 1
          fi
      - name: Android TypeScript
        if: always()
        working-directory: private-src/mobile
        shell: bash
        run: |
          if npm run typecheck > "$RUNNER_TEMP/offline-counts-typecheck.log" 2>&1; then
            echo 'PASS: Android TypeScript'
          else
            echo '::error::Android TypeScript failed. Reporting only compiler error codes and file basename/line.'
            grep -E 'error TS[0-9]+:' "$RUNNER_TEMP/offline-counts-typecheck.log" | sed -E 's|^(.*/)?([^/]+\.tsx?)(\([0-9]+,[0-9]+\))?: error (TS[0-9]+):.*$|\2\3 \4|' | head -15 || true
            exit 1
          fi
      - name: Android JavaScript export (NO APK or AAB)
        if: always()
        working-directory: private-src/mobile
        shell: bash
        run: |
          if npm run export:android > "$RUNNER_TEMP/offline-counts-export.log" 2>&1; then
            echo 'PASS: Android JavaScript export, no APK or AAB'
          else
            echo '::error::Android JS export failed. Private diagnostics not published.'
            exit 1
          fi
# No Expo prebuild, Gradle, APK, AAB, signing, Google Play, Cloudflare or staff release.
