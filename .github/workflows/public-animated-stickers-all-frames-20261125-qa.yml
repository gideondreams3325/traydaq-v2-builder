name: TRAYDAQ all-frame public animated stickers and encrypted attachment QA
on:
  push:
    branches: [main]
    paths: ['.github/workflows/public-animated-stickers-all-frames-20261125-qa.yml']
  workflow_dispatch:
permissions:
  contents: read
env:
  SOURCE_REF: c89c57112668551a82a9155c24c5e4728df7ebf4
jobs:
  deno:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          repository: gideondreams3325/traydaq-v2
          ref: ${{ env.SOURCE_REF }}
          token: ${{ secrets.TRAYDAQ_V2_SOURCE_READ_TOKEN }}
          path: private-src
          persist-credentials: false
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Check actual decoder and moderation gate
        working-directory: private-src
        run: deno test --node-modules-dir=auto --allow-net=cdn.jsdelivr.net --allow-read --allow-env supabase/functions/_shared/animatedStickerModeration_test.ts
      - name: Typecheck shared sticker backend
        working-directory: private-src
        run: deno check --node-modules-dir=auto supabase/functions/_shared/publicKeyboardSticker.ts
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          repository: gideondreams3325/traydaq-v2
          ref: ${{ env.SOURCE_REF }}
          token: ${{ secrets.TRAYDAQ_V2_SOURCE_READ_TOKEN }}
          path: private-src
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: private-src/mobile/package-lock.json
      - name: Install Android dependencies
        working-directory: private-src/mobile
        run: npm ci --no-audit --no-fund
      - name: Typecheck Android
        working-directory: private-src/mobile
        run: npm run typecheck
      - name: Android regressions
        working-directory: private-src/mobile
        run: node --test tests/*.test.mjs
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          repository: gideondreams3325/traydaq-v2
          ref: ${{ env.SOURCE_REF }}
          token: ${{ secrets.TRAYDAQ_V2_SOURCE_READ_TOKEN }}
          path: private-src
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: private-src/package-lock.json
      - name: Install dependencies
        working-directory: private-src
        run: npm ci --no-audit --no-fund
      - name: Sticker and encrypted messaging regressions
        working-directory: private-src
        run: node --test tests/animated-stickers-after-send-20261123.test.mjs tests/native-android-animated-stickers-20261122.test.mjs tests/android-animated-stickers-web-view-20261122.test.mjs tests/keyboard-stickers-web-public-security.test.mjs tests/e2ee-verified-codes.test.mjs
      - name: Typecheck and web regression suite
        working-directory: private-src
        run: npm run typecheck && npm test
