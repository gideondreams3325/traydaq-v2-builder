name: TRAYDAQ Google Public Indexing (SEO and Cloudflare Source QA)
# Read-only private checkout. NO production deploy, APK/AAB or Play release.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/google-public-index-20261107-qa.yml'
permissions:
  contents: read
jobs:
  public-seo:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    defaults:
      run: {working-directory: private-src}
    steps:
      - uses: actions/checkout@v4
        with:
          repository: gideondreams3325/traydaq-v2
          ref: feat/google-public-content-indexing-20261107
          path: private-src
          token: ${{ secrets.TRAYDAQ_V2_SOURCE_READ_TOKEN }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: private-src/package-lock.json
      - name: Install web dependencies
        run: npm ci --no-audit --no-fund > "$RUNNER_TEMP/install.log" 2>&1 || { echo 'Web dependency install failed'; exit 1; }
      - name: Check Cloudflare Worker JS syntax
        run: node --check worker/publicSearch.js && node --check worker/seo.js
      - name: Validate public search pages and private-data protection
        run: node --test tests/google-public-indexing.test.mjs
      - name: Run all existing web tests
        run: |
          npm test > "$RUNNER_TEMP/web-tests.log" 2>&1 || {
            echo 'Web regression tests failed'
            grep -E '^not ok [0-9]+|^# (tests|pass|fail) [0-9]+' "$RUNNER_TEMP/web-tests.log" | tail -22 || true
            exit 1
          }
      - name: Typecheck website
        run: npm run typecheck > "$RUNNER_TEMP/web-types.log" 2>&1 || { echo 'Web TypeScript validation failed'; exit 1; }
      - name: Verify Cloudflare site build and static SEO files
        run: npm run build > "$RUNNER_TEMP/build.log" 2>&1 && test -s dist/sitemap.xml && test -s dist/index.html || { echo 'Cloudflare asset build failed'; exit 1; }
