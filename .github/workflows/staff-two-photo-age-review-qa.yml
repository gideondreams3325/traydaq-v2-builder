name: TRAYDAQ STAFF dedicated two-photo age review QA
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/staff-two-photo-age-review-qa.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout private STAFF repair branch
        uses: actions/checkout@v4
        with:
          repository: gideondreams3325/traydaq-v2
          ref: fix/staff-age-decision-feedback-20261029
          path: private-src
          token: ${{ secrets.TRAYDAQ_V2_SOURCE_READ_TOKEN }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install STAFF source dependencies
        working-directory: private-src/admin-native
        run: npm install --no-audit --no-fund
      - name: Validate department and age appeal protections
        working-directory: private-src/admin-native
        run: npm run test:security
      - name: Typecheck STAFF Android
        working-directory: private-src/admin-native
        run: npm run typecheck
      - name: Checkout dedicated age-review endpoint safety patch
        uses: actions/checkout@v4
        with:
          repository: gideondreams3325/traydaq-v2
          ref: fix/age-review-staff-appointment-20261029
          path: age-api
          token: ${{ secrets.TRAYDAQ_V2_SOURCE_READ_TOKEN }}
          persist-credentials: false
      - name: Test appointed STAFF access and unchanged age review release guard
        working-directory: age-api
        run: node --test tests/age-review-security-appointments.test.mjs tests/independent-age-review-release-lock.test.mjs
      - name: Confirm ID Verification is not modified
        working-directory: private-src
        run: |
          grep -q "firebase-age-verification-review" admin-native/src/backend.ts
          grep -q "v2_age_capture_reviews" supabase/functions/firebase-admin-workspace/index.ts
          echo "Dedicated two-photo age evidence is wired into STAFF."

# Retest the corrected age evidence contract and signed STAFF 1.0.4 source.

# Rerun after adjusting native release UI assertions and protected recommendation approval tests.
