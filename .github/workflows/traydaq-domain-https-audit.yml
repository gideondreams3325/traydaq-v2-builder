name: TRAYDAQ domain HTTPS and certificate read-only audit
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/traydaq-domain-https-audit.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  public-endpoints:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - name: Inspect DNS, redirects and trusted TLS certificates for both hosts
        shell: bash
        run: |
          set -u
          for host in traydaq.com www.traydaq.com; do
            echo "::group::DOMAIN $host"
            echo "=== Public DNS ==="
            dig +noall +answer "$host" A | head -12 || true
            dig +noall +answer "$host" AAAA | head -12 || true
            dig +noall +answer "$host" CNAME | head -12 || true
            echo "=== HTTP redirect chain ==="
            curl -sS -IL --max-redirs 6 --connect-timeout 7 --max-time 18 "http://$host/" \
              -w 'FINAL_HTTP=%{http_code} URL=%{url_effective} SSL_VERIFY=%{ssl_verify_result}\n' \
              2>&1 | grep -iE '^(HTTP/|location:|FINAL_HTTP=|curl:)' || true
            echo "=== Trusted HTTPS (no -k) ==="
            curl -sS -IL --max-redirs 6 --connect-timeout 7 --max-time 18 "https://$host/" \
              -w 'FINAL_HTTPS=%{http_code} URL=%{url_effective} SSL_VERIFY=%{ssl_verify_result}\n' \
              2>&1 | grep -iE '^(HTTP/|location:|strict-transport-security:|content-security-policy:|FINAL_HTTPS=|curl:)' || true
            echo "=== Certificate ==="
            echo | timeout 12 openssl s_client -connect "$host:443" -servername "$host" -verify_return_error 2>/dev/null \
              | openssl x509 -noout -subject -issuer -dates -ext subjectAltName 2>/dev/null | head -16 || true
            echo "::endgroup::"
          done
# Diagnostic only: no deployments, domain edits, token access, or native builds.
