name: TRAYDAQ V2 Public Builder

# The publicly visible workflow fetches ONLY the private TRAYDAQ V2 main branch.
# Never publish private source or run untrusted pull-request code with its token.
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/build.yml"
  workflow_dispatch:
    inputs:
      target:
        description: "Build target"
        required: true
        type: choice
        default: android-preview
        options:
          - android-preview
          - web-check

permissions:
  contents: read

concurrency:
  group: traydaq-v2-builder-serial
  cancel-in-progress: false

jobs:
  build:
    name: Private TRAYDAQ V2 main - ${{ github.event_name == 'push' && 'android-preview' || inputs.target }}
    runs-on: ubuntu-latest
    timeout-minutes: 65
    env:
      BUILD_TARGET: ${{ github.event_name == 'push' && 'android-preview' || inputs.target }}
    steps:
      - name: Require private source read-only token
        shell: bash
        env:
          SOURCE_TOKEN_CONFIGURED: ${{ secrets.TRAYDAQ_V2_SOURCE_READ_TOKEN != '' }}
        run: |
          if [ "$SOURCE_TOKEN_CONFIGURED" != "true" ]; then
            echo "::error::Configure the fine-grained TRAYDAQ_V2_SOURCE_READ_TOKEN secret with Contents read-only access to private traydaq-v2."
            exit 1
          fi

      - name: Check out latest private TRAYDAQ V2 main (never publish source)
        uses: actions/checkout@v4
        with:
          repository: gideondreams3325/traydaq-v2
          ref: main
          path: private-src
          token: ${{ secrets.TRAYDAQ_V2_SOURCE_READ_TOKEN }}
          persist-credentials: false
          fetch-depth: 1

      - name: Identify private source SHA
        working-directory: private-src
        shell: bash
        run: |
          echo "TRAYDAQ_V2_SOURCE_REF=main"
          echo "TRAYDAQ_V2_SOURCE_SHA=$(git rev-parse HEAD)"

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install private-source dependencies
        working-directory: private-src
        run: npm install --no-audit --no-fund

      - name: Test current TRAYDAQ V2 source
        working-directory: private-src
        run: npm test

      - name: Build current TRAYDAQ V2 web bundle
        working-directory: private-src
        run: npm run build

      - name: Verify new V2 features and bundle
        working-directory: private-src
        shell: bash
        run: |
          set -euo pipefail
          test -s dist/index.html
          test -d dist/assets
          test -s capacitor.config.ts
          test -s src/feed/FeedPage.tsx
          test -s src/auth/biometric.ts
          test -s src/i18n/translations.js
          test -s src/settings/SettingsPage.tsx
          test -s src/feed/AlbumComposer.tsx
          test -s src/social/MessagesPage.tsx
          test -s src/social/NotificationsPage.tsx
          test -s supabase/functions/submit-album-picture/index.ts
          test -s supabase/functions/publish-picture/index.ts
          test -s src/verification/VerificationPage.tsx
          test -s src/verification/VerificationReviewEvidence.tsx
          test -s supabase/functions/verification-email-otp/index.ts
          test -s supabase/migrations/20261013_resend_identity_verification.sql
          test -s supabase/migrations/20261013_resend_verification_hardening.sql
          test -s tests/verification.test.mjs
          test -s tests/identity-verification.test.mjs
          echo "Current V2 web, Resend identity verification, private evidence and security tests verified."

      - name: Set up Java 21
        if: ${{ env.BUILD_TARGET == 'android-preview' }}
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        if: ${{ env.BUILD_TARGET == 'android-preview' }}
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android API 36
        if: ${{ env.BUILD_TARGET == 'android-preview' }}
        shell: bash
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Generate current V2 native Android project
        if: ${{ env.BUILD_TARGET == 'android-preview' }}
        working-directory: private-src
        shell: bash
        run: |
          set -euo pipefail
          npx cap add android
          npx cap sync android
          node scripts/prepare-android-biometrics.mjs
          test -f android/app/src/main/AndroidManifest.xml
          grep -q android.permission.USE_BIOMETRIC android/app/src/main/AndroidManifest.xml
          test -f android/gradlew
          echo "Android 8 wrapper with biometric permissions generated from private TRAYDAQ V2 source."

      - name: Restore optional persistent debug certificate
        if: ${{ env.BUILD_TARGET == 'android-preview' }}
        shell: bash
        env:
          DEBUG_KEYSTORE: ${{ secrets.TRAYDAQ_V2_DEBUG_KEYSTORE_B64 }}
        run: |
          set -euo pipefail
          if [ -n "$DEBUG_KEYSTORE" ]; then
            mkdir -p "$HOME/.android"
            printf '%s' "$DEBUG_KEYSTORE" | base64 --decode > "$HOME/.android/debug.keystore"
            chmod 600 "$HOME/.android/debug.keystore"
            keytool -list -keystore "$HOME/.android/debug.keystore" \
              -storepass android -alias androiddebugkey >/dev/null
            echo "Persistent testing certificate restored."
          else
            echo "::warning::Ephemeral debug signing certificate: a subsequent differently signed APK may require uninstalling this preview."
          fi

      - name: Compile TRAYDAQ V2 debug APK
        if: ${{ env.BUILD_TARGET == 'android-preview' }}
        working-directory: private-src/android
        shell: bash
        run: |
          set -euo pipefail
          chmod +x ./gradlew
          ./gradlew --no-daemon assembleDebug
          test -s app/build/outputs/apk/debug/app-debug.apk
          unzip -t app/build/outputs/apk/debug/app-debug.apk >/dev/null
          sha256sum app/build/outputs/apk/debug/app-debug.apk

      - name: Upload only debug APK (never private source)
        if: ${{ env.BUILD_TARGET == 'android-preview' }}
        uses: actions/upload-artifact@v4
        with:
          name: TRAYDAQ-V2-debug-preview
          path: private-src/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
