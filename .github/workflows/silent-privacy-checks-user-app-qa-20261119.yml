name: TRAYDAQ Silent Privacy and Account Security Checks - Web Android QA
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/silent-privacy-checks-user-app-qa-20261119.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: traydaq-silent-privacy-checks-qa
  cancel-in-progress: false
env:
  PRIVATE_SOURCE_SHA: aef3298f52c1bcc19e3f2d87785604d7d9de2190
  CI: '1'
  EXPO_NO_TELEMETRY: '1'
jobs:
  android:
    name: Android full tests, TypeScript and JS export - no APK/AAB
    if: github.repository == 'gideondreams3325/traydaq-v2-builder' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 50
    defaults:
      run:
        working-directory: candidate/mobile
        shell: bash
    steps:
      - name: Verify private read token
        working-directory: .
        env:
          HAS_TOKEN: ${{ secrets.TRAYDAQ_V2_SOURCE_READ_TOKEN != '' }}
        run: test "$HAS_TOKEN" = true
      - uses: actions/checkout@v4
        with:
          repository: gideondreams3325/traydaq-v2
          ref: ${{ env.PRIVATE_SOURCE_SHA }}
          token: ${{ secrets.TRAYDAQ_V2_SOURCE_READ_TOKEN }}
          path: candidate
          persist-credentials: false
          fetch-depth: 1
      - name: Exact pinned candidate
        run: test "$(git -C .. rev-parse HEAD)" = "$PRIVATE_SOURCE_SHA"
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: candidate/mobile/package-lock.json
      - name: Install pinned packages
        run: npm ci --no-audit --no-fund > "$RUNNER_TEMP/install-native.log" 2>&1
      - name: New focused silent-check and existing share, block, chat regressions
        run: |
          node --test tests/background-privacy-security-checks-20261119.test.mjs tests/block-privacy-account-gate-regression.test.mjs tests/blocking-privacy-access.test.mjs tests/android-unified-share-sheet-20261117.test.mjs tests/android-share-eligible-peers-deep-links-20261117.test.mjs tests/chat-privacy-live-service.test.mjs > "$RUNNER_TEMP/native-focused.log" 2>&1 || {
            grep -E '^not ok [0-9]+ - |^# (tests|pass|fail)' "$RUNNER_TEMP/native-focused.log" | tail -35 || true
            exit 1
          }
          grep -E '^# (tests|pass|fail)' "$RUNNER_TEMP/native-focused.log" | tail -3
      - name: All Android tests and typecheck
        run: |
          node --test tests/*.test.mjs > "$RUNNER_TEMP/all-android.log" 2>&1 || {
            grep -A 19 -E '^not ok [0-9]+ - ' "$RUNNER_TEMP/all-android.log" | tail -100 || true
            grep -E '^# (tests|pass|fail)' "$RUNNER_TEMP/all-android.log" | tail -4 || true
            exit 1
          }
          npm run typecheck > "$RUNNER_TEMP/ts-android.log" 2>&1 || {
            grep -E 'error TS' "$RUNNER_TEMP/ts-android.log" | head -15 || true
            exit 1
          }
      - name: Android JavaScript export only
        run: |
          npm run export:android > "$RUNNER_TEMP/android-export.log" 2>&1 || {
            tail -25 "$RUNNER_TEMP/android-export.log" || true
            exit 1
          }
          echo 'PASS Android checks, TypeScript and JS export; no APK or AAB created'
  web:
    name: Web full tests, TypeScript and Cloudflare build
    if: github.repository == 'gideondreams3325/traydaq-v2-builder' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 50
    defaults:
      run:
        working-directory: candidate
        shell: bash
    steps:
      - name: Verify private read token
        working-directory: .
        env:
          HAS_TOKEN: ${{ secrets.TRAYDAQ_V2_SOURCE_READ_TOKEN != '' }}
        run: test "$HAS_TOKEN" = true
      - uses: actions/checkout@v4
        with:
          repository: gideondreams3325/traydaq-v2
          ref: ${{ env.PRIVATE_SOURCE_SHA }}
          token: ${{ secrets.TRAYDAQ_V2_SOURCE_READ_TOKEN }}
          path: candidate
          persist-credentials: false
          fetch-depth: 1
      - name: Exact pinned candidate
        run: test "$(git rev-parse HEAD)" = "$PRIVATE_SOURCE_SHA"
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: candidate/package-lock.json
      - name: Install pinned dependencies
        run: npm ci --no-audit --no-fund > "$RUNNER_TEMP/install-web.log" 2>&1
      - name: Existing web member-access security regressions
        run: |
          node --test tests/member-access-contextual-navigation.test.mjs tests/android-share-chat-privacy-server-20261117.test.mjs tests/web-session-retention-share-warmup-20261117.test.mjs > "$RUNNER_TEMP/focused-web.log" 2>&1 || {
            grep -E '^not ok [0-9]+ - |^# (tests|pass|fail)' "$RUNNER_TEMP/focused-web.log" | tail -25 || true
            exit 1
          }
      - name: Full web tests, TypeScript and Cloudflare build
        run: |
          node --test tests/*.test.mjs > "$RUNNER_TEMP/all-web.log" 2>&1 || {
            grep -E '^not ok [0-9]+ - |^# (tests|pass|fail)' "$RUNNER_TEMP/all-web.log" | tail -35 || true
            exit 1
          }
          npm run typecheck > "$RUNNER_TEMP/ts-web.log" 2>&1 || {
            grep -E 'error TS' "$RUNNER_TEMP/ts-web.log" | head -15 || true
            exit 1
          }
          npm run build > "$RUNNER_TEMP/web-build.log" 2>&1
          test -f dist/index.html
          echo 'PASS full web tests, TypeScript and Cloudflare build'
# Read-only QA of private source. No APK/AAB, Supabase writes or deployment.
