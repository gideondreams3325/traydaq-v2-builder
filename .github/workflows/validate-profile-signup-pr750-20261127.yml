name: TRAYDAQ signup and profile source validation
on:
  pull_request:
    branches: [main]
    paths: [".github/workflows/validate-profile-signup-pr750-20261127.yml"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        component: [web, android, edge]
    steps:
      - uses: actions/checkout@v4
        with:
          repository: gideondreams3325/traydaq-v2
          ref: 08bd01ab63a456e3c0e9c01e44d3c3086ed0e2e6
          path: private-src
          token: ${{ secrets.TRAYDAQ_V2_SOURCE_READ_TOKEN }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Focused source regressions
        working-directory: private-src
        run: |
          node --test tests/signup-content-preview-profile-20261127.test.mjs tests/restricted-post-media-policy.test.mjs > "$RUNNER_TEMP/focused.log" 2>&1 || { grep -E '^(not ok|# (tests|pass|fail) [0-9]+)' "$RUNNER_TEMP/focused.log"; exit 1; }
          grep -E '^# (tests|pass|fail) [0-9]+' "$RUNNER_TEMP/focused.log"
      - uses: denoland/setup-deno@v2
        if: matrix.component == 'edge'
        with:
          deno-version: v2.x
      - name: Edge Function type checks
        if: matrix.component == 'edge'
        working-directory: private-src
        run: |
          deno check --no-config --node-modules-dir=auto supabase/functions/{firebase-native-profile,firebase-native-content,firebase-deletion-requests}/index.ts > "$RUNNER_TEMP/edge.log" 2>&1 || { grep -Ei 'TS[0-9]+|error|failed|not found|could not' "$RUNNER_TEMP/edge.log" | cut -c1-160 | head -60; exit 1; }
      - name: Regression tests and TypeScript
        if: matrix.component != 'edge'
        working-directory: private-src
        env:
          COMPONENT: ${{ matrix.component }}
          CI: "1"
          NODE_OPTIONS: "--max-old-space-size=6144"
        run: |
          if [ "$COMPONENT" = android ]; then cd mobile; fi
          npm ci --no-audit --no-fund > "$RUNNER_TEMP/install.log" 2>&1 || { echo 'Dependency install failed'; exit 1; }
          set +e
          npm run typecheck > "$RUNNER_TEMP/ts.log" 2>&1
          ts_rc=$?
          grep -E 'error TS[0-9]+' "$RUNNER_TEMP/ts.log" | cut -c1-160 | head -60 || true
          node --test tests/*.test.mjs > "$RUNNER_TEMP/tests.log" 2>&1
          test_rc=$?
          grep -E '^(not ok|# (tests|pass|fail) [0-9]+)' "$RUNNER_TEMP/tests.log" | cut -c1-160 | head -80
          if [ "$COMPONENT" = web ]; then
            npm run build > "$RUNNER_TEMP/build.log" 2>&1
            build_rc=$?
          else
            npx expo export --platform android --output-dir "$RUNNER_TEMP/android-export" > "$RUNNER_TEMP/build.log" 2>&1
            build_rc=$?
          fi
          if [ "$build_rc" -ne 0 ]; then echo 'Source build failed'; fi
          test "$ts_rc" -eq 0 && test "$test_rc" -eq 0 && test "$build_rc" -eq 0
