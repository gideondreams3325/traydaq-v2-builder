name: TRAYDAQ Staff Transport Service — Strict V2 Source QA
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/staff-transport-service-20261121.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: traydaq-staff-transport-service-20261121
  cancel-in-progress: false
env:
  SOURCE_SHA: 'ef771a67332a105cc58c31d12df8a83ea91e26cb'
  CI: '1'
  EXPO_NO_TELEMETRY: '1'
jobs:
  web:
    name: Web regression + Transport contracts + Cloudflare build
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
        with:
          repository: gideondreams3325/traydaq-v2
          ref: ${{ env.SOURCE_SHA }}
          token: ${{ secrets.TRAYDAQ_V2_SOURCE_READ_TOKEN }}
          persist-credentials: false
          path: private-src
      - run: test "$(git -C private-src rev-parse HEAD)" = "$SOURCE_SHA"
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: private-src/package-lock.json
      - name: Install locked web dependencies
        working-directory: private-src
        run: npm ci --no-audit --no-fund
      - name: Transport isolation and original directory model contracts
        working-directory: private-src
        run: node --test tests/traydrive-transport-service-20261121.test.mjs tests/traydrive-directory-model1.test.mjs
      - name: Full web regressions
        working-directory: private-src
        shell: bash
        run: |
          set -euo pipefail
          if npm test > "$RUNNER_TEMP/transport-web.log" 2>&1; then echo 'PASS: full web suite'; else
            grep '^not ok ' "$RUNNER_TEMP/transport-web.log" || true
            exit 1
          fi
      - name: Web TypeScript
        working-directory: private-src
        run: npm run typecheck
      - name: Cloudflare asset build only
        working-directory: private-src
        run: npm run build
      - name: Staff iPhone TS and build
        working-directory: private-src
        run: npm run typecheck:staff && npm run build:staff
  android:
    name: Android User regression (no APK/AAB)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          repository: gideondreams3325/traydaq-v2
          ref: ${{ env.SOURCE_SHA }}
          token: ${{ secrets.TRAYDAQ_V2_SOURCE_READ_TOKEN }}
          persist-credentials: false
          path: private-src
      - run: test "$(git -C private-src rev-parse HEAD)" = "$SOURCE_SHA"
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: private-src/mobile/package-lock.json
      - name: Install locked user dependencies
        working-directory: private-src/mobile
        run: npm ci --no-audit --no-fund
      - name: Complete user Android regression suite
        working-directory: private-src/mobile
        shell: bash
        run: |
          set -euo pipefail
          if node --test tests/*.test.mjs > "$RUNNER_TEMP/transport-user.log" 2>&1; then echo 'PASS: full Android User suite'; else
            grep '^not ok ' "$RUNNER_TEMP/transport-user.log" || true
            exit 1
          fi
      - name: User Android TS and JS export
        working-directory: private-src/mobile
        run: npm run typecheck && npm run export:android
  staff:
    name: Android Staff security and typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
        with:
          repository: gideondreams3325/traydaq-v2
          ref: ${{ env.SOURCE_SHA }}
          token: ${{ secrets.TRAYDAQ_V2_SOURCE_READ_TOKEN }}
          persist-credentials: false
          path: private-src
      - run: test "$(git -C private-src rev-parse HEAD)" = "$SOURCE_SHA"
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Staff security regression tests
        working-directory: private-src/admin-native
        run: npm run test:security
      - name: Install Staff dependencies
        working-directory: private-src/admin-native
        run: npm install --no-package-lock --no-audit --no-fund
      - name: Staff TypeScript
        working-directory: private-src/admin-native
        run: npm run typecheck
# Source-only QA: no new Supabase project, no migrations or Edge deployment,
# no APK/AAB build, no Cloudflare publication, no user or staff release.
