name: TRAYDAQ Android Reusable Sounds and Music Clip Rights QA (NO RELEASE)
on:
  push:
    branches: [main]
    paths: [".github/workflows/android-sound-reuse-20261117.yml"]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: traydaq-android-reusable-sounds-20261117
  cancel-in-progress: false
env:
  PRIVATE_SOURCE_SHA: 9e76bbe1bcac5465729476eb143added7e8258e9
  CI: '1'
  EXPO_NO_TELEMETRY: '1'
jobs:
  android:
    name: Android sound permissions, full regression, TS and JS export only
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - name: Checkout exact private Android candidate (read only)
        uses: actions/checkout@v4
        with:
          repository: gideondreams3325/traydaq-v2
          ref: ${{ env.PRIVATE_SOURCE_SHA }}
          token: ${{ secrets.TRAYDAQ_V2_SOURCE_READ_TOKEN }}
          path: private-src
          persist-credentials: false
      - name: Verify pinned source commit
        working-directory: private-src
        run: test "$(git rev-parse HEAD)" = "$PRIVATE_SOURCE_SHA"
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: private-src/mobile/package-lock.json
      - name: Install locked mobile dependencies
        working-directory: private-src/mobile
        run: npm ci --no-audit --no-fund
      - name: Validate new sound permissions and navigation
        working-directory: private-src/mobile
        run: node --test tests/android-sound-reuse-20261117.test.mjs
      - name: Full Android regression suite
        working-directory: private-src/mobile
        run: node --test tests/*.test.mjs
      - name: Native TypeScript validation
        working-directory: private-src/mobile
        run: npm run typecheck
      - name: Android JS export only; NO APK or AAB
        working-directory: private-src/mobile
        run: npm run export:android
# No Gradle, signing, APK, AAB, Google Play rollout, Supabase deploy, or Cloudflare deploy.
