name: TRAYDAQ Secure Job Applications (Web + Android Source QA)
on:
  push:
    branches: [main]
    paths: ['.github/workflows/secure-job-applications-20261115.yml']
  workflow_dispatch:
permissions:
  contents: read
env:
  PRIVATE_SOURCE_SHA: b0262776b9eb05f2eb02b3fd929b971d9f82b288
  CI: '1'
  EXPO_NO_TELEMETRY: '1'
jobs:
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          repository: gideondreams3325/traydaq-v2
          ref: ${{ env.PRIVATE_SOURCE_SHA }}
          token: ${{ secrets.TRAYDAQ_V2_SOURCE_READ_TOKEN }}
          path: private-src
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: private-src/package-lock.json
      - name: Verify immutable source SHA
        working-directory: private-src
        run: test "$(git rev-parse HEAD)" = "$PRIVATE_SOURCE_SHA"
      - name: Install Web dependencies
        working-directory: private-src
        run: npm ci --no-audit --no-fund
      - name: Full Web regression suite
        working-directory: private-src
        run: npm test
      - name: Web TypeScript
        if: always()
        working-directory: private-src
        run: npm run typecheck
      - name: Web production build
        if: always()
        working-directory: private-src
        run: npm run build
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          repository: gideondreams3325/traydaq-v2
          ref: ${{ env.PRIVATE_SOURCE_SHA }}
          token: ${{ secrets.TRAYDAQ_V2_SOURCE_READ_TOKEN }}
          path: private-src
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: private-src/mobile/package-lock.json
      - name: Verify immutable source SHA
        working-directory: private-src
        run: test "$(git rev-parse HEAD)" = "$PRIVATE_SOURCE_SHA"
      - name: Install Android dependencies
        working-directory: private-src/mobile
        run: npm ci --no-audit --no-fund
      - name: Full Android regression suite
        working-directory: private-src/mobile
        run: node --test tests/*.test.mjs
      - name: Android TypeScript
        if: always()
        working-directory: private-src/mobile
        run: npm run typecheck
      - name: Android JavaScript export (no AAB)
        if: always()
        working-directory: private-src/mobile
        run: npx expo export --platform android
# This workflow makes no APK, AAB or production deployment.
