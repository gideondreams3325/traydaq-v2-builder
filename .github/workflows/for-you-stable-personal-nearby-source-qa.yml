name: TRAYDAQ V2 For You Stability + Personalization (source only)
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/traydaq-for-you-stability-validation-request.txt"
permissions:
  contents: read
concurrency:
  group: for-you-stable-personal-nearby-source-qa
  cancel-in-progress: true
jobs:
  validate:
    name: Full web and Android source-only tests
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout private source read-only
        uses: actions/checkout@v4
        with:
          repository: gideondreams3325/traydaq-v2
          ref: fix/for-you-stability-test-guard-20261106
          path: private-src
          token: ${{ secrets.TRAYDAQ_V2_SOURCE_READ_TOKEN }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install web dependencies
        working-directory: private-src
        run: npm ci --no-audit --no-fund > "$RUNNER_TEMP/web-install.log" 2>&1
      - name: Run full web tests (sanitized logs)
        working-directory: private-src
        run: |
          npm test > "$RUNNER_TEMP/web-tests.log" 2>&1 || {
            grep -E '^not ok [0-9]+ - ' "$RUNNER_TEMP/web-tests.log" || true
            grep -E '^# (tests|pass|fail) ' "$RUNNER_TEMP/web-tests.log" || true
            exit 1
          }
          grep -E '^# (tests|pass|fail) ' "$RUNNER_TEMP/web-tests.log" || true
      - name: Web TypeScript
        working-directory: private-src
        run: npm run typecheck > "$RUNNER_TEMP/web-typecheck.log" 2>&1
      - name: Cloudflare web asset build (no deployment)
        working-directory: private-src
        run: npm run build > "$RUNNER_TEMP/web-build.log" 2>&1
      - name: Install Android source dependencies (no APK/AAB)
        working-directory: private-src/mobile
        run: npm ci --no-audit --no-fund > "$RUNNER_TEMP/native-install.log" 2>&1
      - name: Run full native tests (sanitized logs)
        working-directory: private-src/mobile
        run: |
          node --test tests/*.test.mjs > "$RUNNER_TEMP/native-tests.log" 2>&1 || {
            grep -E '^not ok [0-9]+ - ' "$RUNNER_TEMP/native-tests.log" || true
            grep -E '^# (tests|pass|fail) ' "$RUNNER_TEMP/native-tests.log" || true
            exit 1
          }
          grep -E '^# (tests|pass|fail) ' "$RUNNER_TEMP/native-tests.log" || true
      - name: Android TypeScript (no APK/AAB)
        working-directory: private-src/mobile
        run: npm run typecheck > "$RUNNER_TEMP/native-typecheck.log" 2>&1
