name: TRAYDAQ Native Android Debug Build Proof (Private Source, No Release)

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/android-native-build-proof.yml"
  push:
    branches: [main]
    paths:
      - ".github/workflows/android-native-build-proof.yml"

permissions:
  contents: read

env:
  APP_COMMIT_SHA: 6931ba0cd52f756b0984bbe6b9fd1f28eb65aa7d

jobs:
  android-native-build:
    name: Compile Android Java/Kotlin and debug package (no artifact)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout immutable private TRAYDAQ app source
        uses: actions/checkout@v4
        with:
          repository: gideondreams3325/traydaq-v2
          ref: ${{ env.APP_COMMIT_SHA }}
          path: private-src
          token: ${{ secrets.TRAYDAQ_V2_SOURCE_READ_TOKEN }}
          persist-credentials: false
      - name: Verify exact app commit
        working-directory: private-src
        run: test "$(git rev-parse HEAD)" = "$APP_COMMIT_SHA"
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Verify Android SDK is available
        run: |
          test -d "$ANDROID_HOME"
          echo "Android SDK detected on runner."
      - name: Install mobile dependencies
        working-directory: private-src/mobile
        run: npm install --no-audit --no-fund
      - name: Validate Expo native configuration and generate Android source
        working-directory: private-src/mobile
        env:
          CI: '1'
        run: |
          npx expo config --type public > /dev/null
          npx expo prebuild --platform android --no-install
          test -f android/gradlew
          test -f android/app/build.gradle
      - name: Build unsigned-for-publication Android debug app
        working-directory: private-src/mobile/android
        env:
          CI: '1'
        run: |
          chmod +x ./gradlew
          ./gradlew :app:assembleDebug --no-daemon --console=plain
      - name: Verify APK exists, but do not publish it
        working-directory: private-src/mobile
        run: |
          test -s android/app/build/outputs/apk/debug/app-debug.apk
          echo "PASS: Android native debug package compiled from the pinned private app source."
          echo "This is not an EAS production signature or a Play Store release."

# This public builder must NEVER upload a compiled APK, bundle, signing
# credentials, google-services.json, private source, keystore or caches
# containing proprietary app data as a workflow artifact.
