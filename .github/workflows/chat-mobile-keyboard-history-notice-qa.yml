name: TRAYDAQ Chat Keyboard History Time + Compact Notice — Source QA
# Source regression and TypeScript validation only.
# NEVER build or release Android APK/AAB, sign, upload artifacts or deploy Cloudflare.
# Retry: repaired JSX empty-state block and updated keyboard/history expectations, head 9134fceabbdb030880021c710e3d07f1ae1326b2.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/chat-mobile-keyboard-history-notice-qa.yml"
permissions:
  contents: read
jobs:
  web:
    name: Web notice regression tests and TypeScript (no deployment)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: private-src
    steps:
      - uses: actions/checkout@v4
        with:
          repository: gideondreams3325/traydaq-v2
          ref: fix/chat-keyboard-history-timestamp-notice-20261105
          path: private-src
          token: ${{ secrets.TRAYDAQ_V2_SOURCE_READ_TOKEN }}
          persist-credentials: false
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npm test
      - if: always()
        run: npm run typecheck
  android:
    name: Android chat and timestamp regression tests + TypeScript (no APK)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: private-src/mobile
    steps:
      - uses: actions/checkout@v4
        with:
          repository: gideondreams3325/traydaq-v2
          ref: fix/chat-keyboard-history-timestamp-notice-20261105
          path: private-src
          token: ${{ secrets.TRAYDAQ_V2_SOURCE_READ_TOKEN }}
          persist-credentials: false
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: node --test tests/*.test.mjs
      - if: always()
        run: npm run typecheck
