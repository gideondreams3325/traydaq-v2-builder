name: TRAYDAQ STAFF APK result reporter
on:
  workflow_run:
    workflows:
      - TRAYDAQ V2 Staff Android Production Release
    types: [completed]
  push:
    branches: [main]
    paths:
      - ".github/traydaq-admin-build-status-request.txt"

permissions:
  actions: read
  contents: write

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Write dedicated Staff build result
        uses: actions/github-script@v7
        with:
          script: |
            const {owner,repo}=context.repo;
            const result=await github.rest.actions.listWorkflowRuns({
              owner,repo,workflow_id:'admin-native.yml',per_page:10
            });
            const run=result.data.workflow_runs.find(x=>x.event==='push'||x.event==='workflow_dispatch');
            if(!run)throw Error('No TRAYDAQ Staff APK workflow run available.');
            const detail=await github.rest.actions.listJobsForWorkflowRun({
              owner,repo,run_id:run.id,per_page:100
            });
            const jobs=detail.data.jobs.map(job=>({
              id:job.id,name:job.name,status:job.status,conclusion:job.conclusion,
              failedSteps:(job.steps||[]).filter(step=>step.conclusion==='failure')
                .map(step=>({name:step.name,number:step.number}))
            }));
            const report={
              workflow:'admin-native.yml',app:'com.traydaq.admin',
              runId:run.id,url:run.html_url,
              headSha:run.head_sha,runNumber:run.run_number,
              status:run.status,conclusion:run.conclusion,updatedAt:new Date().toISOString(),
              jobs,artifactName:'TRAYDAQ-V2-Admin-Native-Android-APK'
            };
            const path='.github/traydaq-admin-build-status.json';
            let sha;
            try {
              const previous=await github.rest.repos.getContent({owner,repo,path});
              if(!Array.isArray(previous.data))sha=previous.data.sha;
            } catch(error) {
              if(error.status!==404)throw error;
            }
            await github.rest.repos.createOrUpdateFileContents({
              owner,repo,path,
              message:'chore(staff): report latest dedicated APK workflow result',
              content:Buffer.from(JSON.stringify(report,null,2)+'\n','utf8').toString('base64'),
              ...(sha?{sha}:{}),
              branch:'main'
            });
