name: Validate TRAYDAQ comment Edge Deno baseline delta (source-only)
on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - '.github/workflows/comment-edge-baseline-diff-pr540-20261119.yml'
permissions:
  contents: read
jobs:
  verify-edge:
    if: github.repository == 'gideondreams3325/traydaq-v2-builder' && github.head_ref == 'ci/comment-edge-diff-pr540-20261119' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      BASE_SOURCE_SHA: 'c949bff9a18535961a53151ef936080286127573'
      CANDIDATE_SOURCE_SHA: 'f6313f48899321bd7f8c2152ff80caf47ce99bff'
    steps:
      - name: Checkout baseline production-main source
        uses: actions/checkout@v4
        with:
          repository: gideondreams3325/traydaq-v2
          ref: ${{ env.BASE_SOURCE_SHA }}
          token: ${{ secrets.TRAYDAQ_V2_SOURCE_READ_TOKEN }}
          path: baseline-src
          persist-credentials: false
      - name: Checkout immutable Staff comment candidate
        uses: actions/checkout@v4
        with:
          repository: gideondreams3325/traydaq-v2
          ref: ${{ env.CANDIDATE_SOURCE_SHA }}
          token: ${{ secrets.TRAYDAQ_V2_SOURCE_READ_TOKEN }}
          path: private-src
          persist-credentials: false
      - name: Verify both immutable revisions
        run: |
          set -euo pipefail
          test "$(git -C baseline-src rev-parse HEAD)" = "$BASE_SOURCE_SHA"
          test "$(git -C private-src rev-parse HEAD)" = "$CANDIDATE_SOURCE_SHA"
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Compare baseline and candidate Edge type error multiset
        shell: bash
        run: |
          set -euo pipefail
          for function_name in firebase-discussions firebase-admin-workspace; do
            deno check "baseline-src/supabase/functions/$function_name/index.ts" > "$RUNNER_TEMP/baseline-$function_name.log" 2>&1 || true
            deno check "private-src/supabase/functions/$function_name/index.ts" > "$RUNNER_TEMP/candidate-$function_name.log" 2>&1 || true
            # Filter only compiler errors, not actual source snippets or secrets.
            for scope in baseline candidate; do
              sed -E 's/\x1B\[[0-9;]*[[:alpha:]]//g' "$RUNNER_TEMP/$scope-$function_name.log" |
                grep -E 'TS[0-9]+ \[ERROR\]:' |
                sed -E 's/^.*(TS[0-9]+ \[ERROR\]:)/\1/' |
                sort > "$RUNNER_TEMP/$scope-$function_name.errors" || true
            done
            base_count=$(wc -l < "$RUNNER_TEMP/baseline-$function_name.errors")
            candidate_count=$(wc -l < "$RUNNER_TEMP/candidate-$function_name.errors")
            echo "$function_name baseline TypeScript errors: $base_count"
            echo "$function_name candidate TypeScript errors: $candidate_count"
            comm -13 "$RUNNER_TEMP/baseline-$function_name.errors" "$RUNNER_TEMP/candidate-$function_name.errors" > "$RUNNER_TEMP/new-$function_name.errors"
            if test -s "$RUNNER_TEMP/new-$function_name.errors"; then
              echo "::error::New Edge TypeScript errors introduced by the Staff comments update in $function_name"
              head -20 "$RUNNER_TEMP/new-$function_name.errors"
              exit 1
            fi
            # Fail closed when the checker itself broke instead of returning
            # parseable compiler results on either revision.
            for scope in baseline candidate; do
              if grep -qi 'type checking failed\|error:' "$RUNNER_TEMP/$scope-$function_name.log" &&
                 test ! -s "$RUNNER_TEMP/$scope-$function_name.errors"; then
                echo "::error::The $function_name $scope typechecker had a non-TypeScript failure."
                exit 1
              fi
            done
            echo "PASS: $function_name introduces no new Edge TypeScript errors"
          done
# Do not merge this temporary Builder PR or publish private sources.
# No migrations, deployment, APK, AAB, IPA, artifacts or live user data.
