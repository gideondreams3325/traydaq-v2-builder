name: TRAYDAQ v2 Builder — Android autoplay + manual first frame (no APK)
on:
  push:
    branches: [main]
    paths: ['.github/workflows/for-you-instant-video-pr214-validation.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: traydaq-pr214-android-video
  cancel-in-progress: true
jobs:
  native-video:
    name: Validate merged private Android autoplay + manual playback
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      CI: '1'
      EXPO_NO_TELEMETRY: '1'
    defaults:
      run:
        working-directory: private-src/mobile
    steps:
      - name: Confirm authenticated private-source read access
        working-directory: .
        env:
          HAS_TOKEN: ${{ secrets.TRAYDAQ_V2_SOURCE_READ_TOKEN != '' }}
        run: test "$HAS_TOKEN" = true
      - name: Checkout exact merged Android first-frame candidate
        uses: actions/checkout@v4
        with:
          repository: gideondreams3325/traydaq-v2
          ref: 3cb18c6369ac3f7ac041fb477efc66f1fba8d6dd
          path: private-src
          token: ${{ secrets.TRAYDAQ_V2_SOURCE_READ_TOKEN }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install locked mobile packages
        run: npm ci --no-audit --no-fund
      - name: Run complete Android regression tests
        run: node --test tests/*.test.mjs
      - name: Validate Android TypeScript
        run: npm run typecheck
      - name: Verify Expo dependencies
        run: npx expo install --check
      - name: Export Android JavaScript bundle (no APK or AAB)
        run: npm run export:android
# No signing, Gradle build, Google Play, Cloudflare deployment or source artifact upload.
