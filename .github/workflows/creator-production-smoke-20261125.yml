name: TRAYDAQ creator production smoke checks
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/creator-production-smoke-20261125.yml'
permissions:
  contents: read
jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify production web version and protected routes
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import urllib.request, urllib.error, json, re
          expected = '695f4b9c0a7c9807337c3491de11854d4e9d7117'
          def request(url, method='GET'):
              req=urllib.request.Request(url, method=method, headers={'User-Agent':'TRAYDAQ-production-smoke/1.0','Cache-Control':'no-cache','Accept':'application/json'})
              try:
                  with urllib.request.urlopen(req, timeout=20) as response:
                      return response.status,response.read(4096)
              except urllib.error.HTTPError as e:
                  return e.code,e.read(4096)
          failed=False
          try:
              status,body=request('https://traydaq.com/app-version.json?verify='+expected)
              version=json.loads(body).get('version','')
              print('Cloudflare manifest status:',status,'version:',version if isinstance(version,str) and re.fullmatch(r'[0-9a-f]{40}',version) else 'unrecognized')
              if status!=200 or version!=expected:
                  failed=True
          except Exception as e:
              print('Cloudflare manifest unavailable:',type(e).__name__); failed=True
          root='https://qpcsruhwqhniprakpoox.supabase.co/functions/v1/firebase-native-content'
          for action,code in [('saved-collections',401),('collaborations',401),('video-subtitles&id=invalid',400),('video-subtitles&id=00000000-0000-0000-0000-000000000000',404)]:
              try:
                  status,body=request(root+'?action='+action)
                  print('Production route',action.split('&')[0],status,'expected',code)
                  if status!=code: failed=True
              except Exception as e:
                  print('Route unavailable:',type(e).__name__); failed=True
          if failed: raise SystemExit(1)
          PY
