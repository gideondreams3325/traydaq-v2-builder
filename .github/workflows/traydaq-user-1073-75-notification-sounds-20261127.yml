name: TRAYDAQ V2 User Android 1.0.73 (75) signed release candidate AAB + APK

# User-authorized signed candidate only, pinned to the exact release-version candidate; do not distribute until backend privacy, scheduling and live messaging compatibility gates are verified.
# The Google Play Console upload remains a separate action; this workflow never auto-rolls out.
on:
  push:
    branches: [main]
    paths: [".github/workflows/traydaq-user-1073-75-notification-sounds-20261127.yml"]
  workflow_dispatch:

concurrency:
  group: traydaq-v2-user-google-play-aab
  cancel-in-progress: true

permissions:
  contents: read
  statuses: write

jobs:
  signed-aab:
    name: Existing-key signed AAB (Android API 36)
    runs-on: ubuntu-latest
    timeout-minutes: 150
    env:
      CI: "1"
      EXPO_NO_TELEMETRY: "1"
      NODE_OPTIONS: "--max-old-space-size=6144"
      TRAYDAQ_RELEASE_VERSION: "1.0.73"
      TRAYDAQ_RELEASE_CODE: "75"
      TRAYDAQ_SOURCE_SHA: "79e6654b6fe4b300c74f7e0f8d2426e7e5e9bb1e"
      # Public certificate from signed User APK run 40043905049 (v1.0.1/code 3).
      TRAYDAQ_EXPECTED_SIGNING_SHA256: "716a68f5734545bc9d9700f045d2bfb1b1087ffe732021f216b32a575f03f83d"
    defaults:
      run:
        working-directory: private-src/mobile
    steps:
      - name: Checkout latest private TRAYDAQ V2 user code
        uses: actions/checkout@v4
        with:
          repository: gideondreams3325/traydaq-v2
          ref: "79e6654b6fe4b300c74f7e0f8d2426e7e5e9bb1e"
          path: private-src
          token: ${{ secrets.TRAYDAQ_V2_SOURCE_READ_TOKEN }}
          persist-credentials: false
          fetch-depth: 1

      - name: Confirm user package and release version
        run: |
          set -euo pipefail
          node - <<'NODE'
          const a=require('./app.json').expo;
          if(a.android?.package!=='com.traydaq.app')throw Error('Only com.traydaq.app may be published.');
          if(!Number.isInteger(a.android.versionCode)||a.android.versionCode!==74||a.version!=='1.0.72'||
             Number(process.env.TRAYDAQ_RELEASE_CODE)!==75||process.env.TRAYDAQ_RELEASE_VERSION!=='1.0.73')
            throw Error('Expected source 1.0.72 (74) and candidate release 1.0.73 (75).');
          console.log('Package:',a.android.package,'version:',a.version,'code:',a.android.versionCode);
          NODE
          test "$(git -C .. rev-parse HEAD)" = "$TRAYDAQ_SOURCE_SHA"
          echo "Source commit: $TRAYDAQ_SOURCE_SHA"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Validate existing TRAYDAQ V2 release signing key
        env:
          KEY_B64: ${{ secrets.TRAYDAQ_V2_UPLOAD_KEYSTORE_B64 }}
          STORE_PASS: ${{ secrets.TRAYDAQ_V2_UPLOAD_KEYSTORE_PASSWORD }}
          KEY_PASS: ${{ secrets.TRAYDAQ_V2_UPLOAD_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.TRAYDAQ_V2_UPLOAD_KEY_ALIAS }}
        run: |
          set -euo pipefail
          for field in KEY_B64 STORE_PASS KEY_PASS; do
            if [[ -z "${!field:-}" ]]; then echo "::error::Existing signing secret $field is missing"; exit 1; fi
          done
          if [[ -n "$KEY_ALIAS" && "$KEY_ALIAS" != "traydaq-v2-upload" ]]; then
            echo "::warning::Alias secret differs from the verified JKS alias; using the original alias."
          fi
          KEY_ALIAS=traydaq-v2-upload
          umask 077
          export TRAYDAQ_UPLOAD_KEYSTORE="$RUNNER_TEMP/traydaq-existing-upload.jks"
          printf '%s' "$KEY_B64" | base64 --decode > "$TRAYDAQ_UPLOAD_KEYSTORE"
          keytool -list -keystore "$TRAYDAQ_UPLOAD_KEYSTORE" -storepass:env STORE_PASS -alias "$KEY_ALIAS" >/dev/null
          keytool -list -v -keystore "$TRAYDAQ_UPLOAD_KEYSTORE" -storepass:env STORE_PASS -alias "$KEY_ALIAS" > "$RUNNER_TEMP/original-cert.txt"
          ACTUAL_SHA256=$(sed -n 's/^[[:space:]]*SHA256: //p' "$RUNNER_TEMP/original-cert.txt" | head -1 | tr -d ':' | tr '[:upper:]' '[:lower:]')
          [[ "$ACTUAL_SHA256" == "$TRAYDAQ_EXPECTED_SIGNING_SHA256" ]] || {
            echo "::error::Keystore differs from installed User APK certificate; refusing incompatible release."
            exit 1
          }
          keytool -certreq -keystore "$TRAYDAQ_UPLOAD_KEYSTORE" -storepass:env STORE_PASS \
            -keypass:env KEY_PASS -alias "$KEY_ALIAS" -file "$RUNNER_TEMP/key-check.csr" >/dev/null 2>&1
          rm -f "$RUNNER_TEMP/key-check.csr"
          echo "TRAYDAQ_UPLOAD_KEYSTORE=$TRAYDAQ_UPLOAD_KEYSTORE" >> "$GITHUB_ENV"
          echo "TRAYDAQ_UPLOAD_ALIAS=$KEY_ALIAS" >> "$GITHUB_ENV"
          echo "Permanent release key verified; no replacement key generated."

      - name: Verify Google OAuth client recognizes the existing certificate
        env:
          STORE_PASS: ${{ secrets.TRAYDAQ_V2_UPLOAD_KEYSTORE_PASSWORD }}
        run: |
          set -euo pipefail
          test -f google-services.json || { echo "::error::Missing existing mobile/google-services.json"; exit 1; }
          node - <<'NODE'
          const c=require('node:child_process');
          const j=require('./google-services.json');
          const pkg='com.traydaq.app';
          if(j.project_info?.project_id!=='traydaq')throw Error('Wrong Firebase project');
          const app=(j.client||[]).find(x=>x.client_info?.android_client_info?.package_name===pkg);
          if(!app)throw Error('Android Firebase registration missing');
          const output=c.execFileSync('keytool',['-list','-v','-keystore',process.env.TRAYDAQ_UPLOAD_KEYSTORE,
            '-storepass:env','STORE_PASS','-alias',process.env.TRAYDAQ_UPLOAD_ALIAS],{encoding:'utf8'});
          const cert=output.match(/^\s*SHA1:\s*([0-9A-F:]+)/im)?.[1]?.replace(/:/g,'').toLowerCase();
          const registered=(app.oauth_client||[]).filter(x=>x.client_type===1&&x.android_info?.package_name===pkg)
            .some(x=>String(x.android_info.certificate_hash||'').replace(/:/g,'').toLowerCase()===cert);
          if(!cert||!registered)throw Error('Signing certificate does not match registered Google sign-in client');
          console.log('Verified existing upload certificate against Firebase Android OAuth client.');
          NODE

      - name: Install locked Expo SDK 58 dependencies and validate Android
        run: |
          set -euo pipefail
          npm ci --no-audit --no-fund
          npx expo install --check
          node -e 'for(const p of ["expo","react-native","react"]) console.log(p,require(p+"/package.json").version)'
          node --test tests/*.test.mjs > "$RUNNER_TEMP/native-tests.log" 2>&1 || { grep -E '^(not ok|# (tests|pass|fail))' "$RUNNER_TEMP/native-tests.log" | cut -c1-180 | head -60 || true; exit 1; }
          grep -E '^# (tests|pass|fail)' "$RUNNER_TEMP/native-tests.log"
          npm run typecheck

      - name: Configure newer user release and remove development overlay permission
        run: |
          node - <<'NODE'
          const fs=require('node:fs');
          const p='app.json';const c=JSON.parse(fs.readFileSync(p,'utf8'));
          c.expo.version=process.env.TRAYDAQ_RELEASE_VERSION;
          c.expo.android.versionCode=Number(process.env.TRAYDAQ_RELEASE_CODE);
          c.expo.android.blockedPermissions=[...new Set([...(c.expo.android.blockedPermissions||[]),'android.permission.SYSTEM_ALERT_WINDOW'])];
          if(c.expo.android.package!=='com.traydaq.app'||c.expo.android.versionCode<=4)throw Error('Invalid user release identity');
          fs.writeFileSync(p,JSON.stringify(c,null,2)+'\n');
          console.log('Play candidate version set to',c.expo.version,'code',c.expo.android.versionCode);
          NODE

      - name: Generate native Android release project
        run: |
          set -euo pipefail
          npx expo export --platform android
          npx expo prebuild --platform android --non-interactive

      - name: Use preinstalled current Android command-line tools
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          test -x "$SDKMANAGER"
          "$SDKMANAGER" --version
          echo "$(dirname "$SDKMANAGER")" >> "$GITHUB_PATH"
      - name: Inspect generated toolchain requirements
        run: |
          for f in android/gradle/wrapper/gradle-wrapper.properties node_modules/react-native/gradle/libs.versions.toml node_modules/@react-native/gradle-plugin/gradle/libs.versions.toml; do
            if test -f "$f"; then
              grep -E '^(distributionUrl|agp|androidGradlePlugin|compileSdk|targetSdk|buildTools|kotlin|ndk|ndkVersion)[[:space:]]*=' "$f" | head -15 || true
            fi
          done
          # SDK 58's generated version catalog requires compileSdk 37 and build tools 37.
          sdkmanager --list --channel=3 > "$RUNNER_TEMP/sdk-list.log" 2>&1
          grep -E '^[[:space:]]*(platforms;android-|build-tools;37)' "$RUNNER_TEMP/sdk-list.log" | cut -c1-180 | tail -45 || true
          if ! test -s "$ANDROID_HOME/platforms/android-37.0/android.jar"; then
            if ! grep -Eq '^[[:space:]]*platforms;android-37\.0[[:space:]]*\|' "$RUNNER_TEMP/sdk-list.log"; then
              echo "::error::Required Android API 37.0 platform is not installed or listed by the current SDK manager."
              exit 1
            fi
            sdkmanager --channel=3 "platforms;android-37.0" > "$RUNNER_TEMP/sdk-platform.log" 2>&1 || {
              tr '\r' '\n' < "$RUNNER_TEMP/sdk-platform.log" | grep -Ei 'failed|error|not found|warning:|license' | cut -c1-180 | tail -20 || true
              exit 1
            }
          fi
          test -s "$ANDROID_HOME/platforms/android-37.0/android.jar"
          sdkmanager --channel=3 "platforms;android-36" "build-tools;36.0.0" "build-tools;37.0.0" > "$RUNNER_TEMP/sdk.log" 2>&1 || {
            tr '\r' '\n' < "$RUNNER_TEMP/sdk.log" | grep -Ei 'failed|error|not found|warning:|license' | cut -c1-180 | tail -20 || true
            exit 1
          }
      - name: Install exact React Native native source toolchain
        run: |
          # React Native 0.88.1 requires this CMake and NDK for its source build.
          cmake_version=3.30.5
          ndk_version="$(sed -nE 's/^ndkVersion[[:space:]]*=[[:space:]]*"([^"]+)".*/\1/p' node_modules/react-native/gradle/libs.versions.toml)"
          test "$ndk_version" = "27.1.12297006"
          sdkmanager --channel=3 "cmake;$cmake_version" "ndk;$ndk_version" > "$RUNNER_TEMP/native-sdk.log" 2>&1 || {
            tr '\r' '\n' < "$RUNNER_TEMP/native-sdk.log" | grep -Ei 'failed|error|not found|warning:|license' | cut -c1-180 | tail -30 || true
            exit 1
          }
          test -x "$ANDROID_HOME/cmake/$cmake_version/bin/cmake"
          test -x "$ANDROID_HOME/cmake/$cmake_version/bin/ninja"
          test -s "$ANDROID_HOME/ndk/$ndk_version/source.properties"
          "$ANDROID_HOME/cmake/$cmake_version/bin/cmake" --version | head -1
          grep '^Pkg.Revision' "$ANDROID_HOME/ndk/$ndk_version/source.properties"
          echo "CMAKE_VERSION=$cmake_version" >> "$GITHUB_ENV"
      - name: Verify resolved Android Gradle Plugin version
        working-directory: private-src/mobile/android
        run: |
          chmod +x gradlew
          ./gradlew --version | grep -E "^(Gradle |Kotlin:|Launcher JVM:|Daemon JVM:)" || true
          cat > "$RUNNER_TEMP/verify-agp.gradle" <<'GRADLE'
          gradle.projectsEvaluated {
            // Init scripts also run in React Native/Expo included builds, which have no :app.
            if (gradle.parent != null) return
            def app = gradle.rootProject.findProject(':app')
            if (app == null) throw new GradleException('Main Android app project missing')
            def plugin = app.plugins.findPlugin('com.android.application')
            if (plugin == null) throw new GradleException('Android application plugin missing')
            def version = plugin.class.classLoader.loadClass('com.android.Version').getField('ANDROID_GRADLE_PLUGIN_VERSION').get(null)
            println("TRAYDAQ_AGP_VERSION=" + version)
          }
          GRADLE
          if ! ./gradlew --no-daemon --console=plain -I "$RUNNER_TEMP/verify-agp.gradle" :app:help > "$RUNNER_TEMP/agp.log" 2>&1; then
            grep -Ei '^> Task .*FAILED|^Execution failed for task|^BUILD FAILED|^FAILURE:|^\* What went wrong:|^Could not |^A problem occurred|^Plugin .* was not found|^Minimum supported|^Android Gradle plugin|^Gradle requires|^Error:' "$RUNNER_TEMP/agp.log" | cut -c1-200 | head -40 || true
            awk '/^[*] What went wrong:/{p=1;next} /^[*] (Try|Exception is):/{p=0} p && NF{print}' "$RUNNER_TEMP/agp.log" | sed -E 's@/home/runner/work/[^ ]+@<workspace-path>@g; s@https?://[^ ]+@<url>@g' | cut -c1-240 | head -30 || true
            echo "AGP configuration command failed"
            exit 1
          fi
          grep -E '^TRAYDAQ_AGP_VERSION=' "$RUNNER_TEMP/agp.log" || true
          if ! grep -Eq '^TRAYDAQ_AGP_VERSION=9\.' "$RUNNER_TEMP/agp.log"; then
            echo "Resolved Android Gradle Plugin is not version 9.x or was not identified."
            exit 1
          fi
      - name: Use original signing keystore for Gradle release bundle
        run: |
          node - <<'NODE'
          const fs=require('node:fs');
          const p='android/app/build.gradle';
          let s=fs.readFileSync(p,'utf8');
          if(!/signingConfigs\s*\{/.test(s))throw Error('Missing Gradle signingConfigs');
          const signing=[
            '    traydaqExistingUpload {',
            '        storeFile file(System.getenv("TRAYDAQ_UPLOAD_KEYSTORE"))',
            '        storePassword System.getenv("TRAYDAQ_UPLOAD_STOREPASS")',
            '        keyAlias System.getenv("TRAYDAQ_UPLOAD_ALIAS")',
            '        keyPassword System.getenv("TRAYDAQ_UPLOAD_KEYPASS")',
            '    }'
          ].join('\n');
          s=s.replace(/signingConfigs\s*\{/,match=>match+'\n'+signing+'\n');
          const match='signingConfig signingConfigs.debug';
          const idx=s.lastIndexOf(match);
          if(idx<0||idx<s.indexOf('buildTypes {')||idx<s.lastIndexOf('release {'))
            throw Error('Could not locate safe release signingConfig substitution.');
          s=s.slice(0,idx)+s.slice(idx).replace(match,'signingConfig signingConfigs.traydaqExistingUpload');
          fs.writeFileSync(p,s);
          console.log('Release AAB configured to use original permanent keystore.');
          NODE

      - name: Build signed Google Play AAB (resilient Maven Central downloads)
        env:
          TRAYDAQ_UPLOAD_STOREPASS: ${{ secrets.TRAYDAQ_V2_UPLOAD_KEYSTORE_PASSWORD }}
          TRAYDAQ_UPLOAD_KEYPASS: ${{ secrets.TRAYDAQ_V2_UPLOAD_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          cd android
          chmod +x gradlew
          for key in android.enableMinifyInReleaseBuilds android.enableShrinkResourcesInReleaseBuilds android.r8.optimizedResourceShrinking; do grep -Fx "$key=true" gradle.properties; done
          grep -q "proguard-android-optimize.txt" app/build.gradle
          # React Native 0.86.3 AAR downloads timed out on the first run.
          # Allow longer official Maven Central HTTP reads and reduce concurrent requests.
          # The same generated Android project and permanent signing key are reused.
          for attempt in 1 2; do
            LOG="$RUNNER_TEMP/traydaq-aab-gradle-attempt-${attempt}.log"
            echo "Building signed AAB/APK (attempt ${attempt}/2, Maven timeouts increased)."
            if ./gradlew --no-daemon --max-workers=2 \
              -Dorg.gradle.internal.http.connectionTimeout=120000 \
              -Dorg.gradle.internal.http.socketTimeout=300000 \
              -Dorg.gradle.internal.repository.max.tentatives=5 \
              -Dorg.gradle.internal.repository.initial.backoff=1000 \
              :app:bundleRelease :app:assembleRelease > "$LOG" 2>&1; then
              echo "PASS: signed AAB/APK compilation completed on attempt $attempt."
              exit 0
            fi
            if ! grep -Eqi 'Read timed out|Connection reset|Connect timed out|Connection timed out|Could not download|Could not GET|Network is unreachable' "$LOG"; then
              echo "::error::Gradle failed for a non-network reason. Inspect the private runner log."
              sed -n '/^FAILURE:/,$p' "$LOG" | head -n 100 | sed -E 's/((PASSWORD|TOKEN|SECRET|KEY)=[^[:space:]]+)/[REDACTED]/Ig' || true
              exit 1
            fi
            echo "::warning::Official dependency download failed on attempt $attempt."
            if [ "$attempt" -eq 2 ]; then
              echo "::error::Maven download failed again; release was not produced."
              exit 1
            fi
            echo "Retrying the same release build with retained Gradle cache."
            sleep 20
          done

      - name: Audit compiled DEX for deprecated system bar APIs
        working-directory: private-src/mobile/android
        run: |
          python3 - <<'PY'
          import os, zipfile, pathlib, subprocess, re
          target=pathlib.Path(os.environ['RUNNER_TEMP'])/'quality-dex'
          target.mkdir(exist_ok=True)
          names=['getStatusBarColor','setStatusBarColor','setNavigationBarColor']
          hits={n:0 for n in names}
          from collections import Counter,defaultdict
          callers=Counter()
          classes={}
          methods=defaultdict(set)
          owner=None
          for line in pathlib.Path('app/build/outputs/mapping/release/mapping.txt').open(errors='replace'):
            m=re.fullmatch(r'(\S+) -> (\S+):\s*',line)
            if m:
              original,owner=m.groups()
              classes[owner]=original
            elif owner and line.startswith(' ') and ' -> ' in line and '(' in line:
              left,right=line.strip().rsplit(' -> ',1)
              name=left.split('(',1)[0].split()[-1]
              methods[(owner,right)].add(name)
          allowed=('androidx.','android.support.','com.facebook.','com.swmansion.','expo.','com.google.android.','com.reactnativecommunity.','com.horcrux.','com.th3rdwave.','com.zoontek.','com.oblador.','com.airbnb.','com.android.')
          def safe_class(name):
            return name if name.startswith(allowed) else '[unattributed or application class]'
          def safe_method(name):
            return name if name.startswith(allowed) else '[unattributed method]'
          with zipfile.ZipFile('app/build/outputs/bundle/release/app-release.aab') as z:
            for item in z.namelist():
              if not re.fullmatch(r'base/dex/classes[0-9]*\.dex',item): continue
              path=target/pathlib.Path(item).name
              path.write_bytes(z.read(item))
              with subprocess.Popen([os.environ['ANDROID_HOME']+'/build-tools/36.0.0/dexdump','-d',str(path)],stdout=subprocess.PIPE,text=True,errors='replace') as p:
                cls=method=''
                for line in p.stdout:
                  cm=re.search(r"Class descriptor\s*:\s*'L([^']+);'",line)
                  if cm: cls=cm.group(1).replace('/','.'); method=''
                  mm=re.search(r"^\s*name\s*:\s*'([^']+)'",line)
                  if mm: method=mm.group(1)
                  if 'invoke-' in line and ('android/view/Window' in line or 'android.view.Window' in line):
                    for n in names:
                      if n in line:
                        hits[n]+=1
                        original=safe_class(classes.get(cls,cls))
                        inline=tuple(sorted({safe_method(x) for x in methods.get((cls,method),set()) if '.' in x}))
                        callers[(n,original,inline)]+=1
                if p.wait(): raise SystemExit('DEX inspection failed')
          if not list(target.glob('*.dex')): raise SystemExit('No compiled DEX found')
          for n,count in hits.items(): print(f'{n}: {count} compiled invocation(s)')
          for (api,owner,inline),count in sorted(callers.items()):
            print(f'{api}: {count} in {owner}; mapped inline origins: {", ".join(inline) or "none identified"}')
          if any(hits.values()): raise SystemExit('Deprecated system bar invocations remain')
          PY

      - name: Verify signed app bundle and target API exactly 36
        env:
          STORE_PASS: ${{ secrets.TRAYDAQ_V2_UPLOAD_KEYSTORE_PASSWORD }}
        run: |
          set -euo pipefail
          AAB=android/app/build/outputs/bundle/release/app-release.aab
          test -s "$AAB"
          unzip -t "$AAB" >/dev/null
          jarsigner -verify "$AAB" >/dev/null
          curl --fail --show-error --silent -L \
            https://github.com/google/bundletool/releases/download/1.18.3/bundletool-all-1.18.3.jar \
            -o "$RUNNER_TEMP/bundletool.jar"
          echo "a099cfa1543f55593bc2ed16a70a7c67fe54b1747bb7301f37fdfd6d91028e29  $RUNNER_TEMP/bundletool.jar" | sha256sum --check --status
          TOOL="$RUNNER_TEMP/bundletool.jar"
          java -jar "$TOOL" validate --bundle="$AAB"
          TARGET=$(java -jar "$TOOL" dump manifest --bundle="$AAB" --xpath=/manifest/uses-sdk/@android:targetSdkVersion | tr -d '\r\n"')
          PACKAGE=$(java -jar "$TOOL" dump manifest --bundle="$AAB" --xpath=/manifest/@package | tr -d '\r\n"')
          CODE=$(java -jar "$TOOL" dump manifest --bundle="$AAB" --xpath=/manifest/@android:versionCode | tr -d '\r\n"')
          EXPECTED_CODE=$(node -p "require('./app.json').expo.android.versionCode")
          [[ "$TARGET" == 36 && "$PACKAGE" == com.traydaq.app && "$CODE" == "$EXPECTED_CODE" ]] || {
            echo "::error::Bundle manifest mismatch: target=$TARGET package=$PACKAGE code=$CODE"; exit 1;
          }
          keytool -list -v -keystore "$TRAYDAQ_UPLOAD_KEYSTORE" -storepass:env STORE_PASS \
            -alias "$TRAYDAQ_UPLOAD_ALIAS" > "$RUNNER_TEMP/expected-cert.txt"
          keytool -printcert -jarfile "$AAB" > "$RUNNER_TEMP/aab-cert.txt"
          EXPECTED=$(sed -n 's/^[[:space:]]*SHA256: //p' "$RUNNER_TEMP/expected-cert.txt" | head -1 | tr -d ':' | tr '[:upper:]' '[:lower:]')
          ACTUAL=$(sed -n 's/^[[:space:]]*SHA256: //p' "$RUNNER_TEMP/aab-cert.txt" | head -1 | tr -d ':' | tr '[:upper:]' '[:lower:]')
          [[ -n "$EXPECTED" && "$EXPECTED" == "$ACTUAL" ]] || {
            echo "::error::AAB does not use the original release certificate"; exit 1;
          }
          [[ "$ACTUAL" == "$TRAYDAQ_EXPECTED_SIGNING_SHA256" ]]
          APK=android/app/build/outputs/apk/release/app-release.apk
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify "$APK"
          APK_CERT=$("$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --print-certs "$APK" | sed -n 's/^Signer #1 certificate SHA-256 digest: //p' | head -1)
          [[ "${APK_CERT,,}" == "$TRAYDAQ_EXPECTED_SIGNING_SHA256" ]]
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$APK" | grep -F "package: name='com.traydaq.app' versionCode='75' versionName='1.0.73'"
          # R8 must produce a real version-specific mapping file. Android Gradle
          # Plugin embeds it in App Bundles for automatic Google Play ingestion.
          MAP=android/app/build/outputs/mapping/release/mapping.txt
          test -s "$MAP" || { echo "::error::R8 was not enabled or mapping.txt was not generated"; exit 1; }
          MAP_ENTRY=BUNDLE-METADATA/com.android.tools.build.obfuscation/proguard.map
          unzip -Z1 "$AAB" | grep -Fx "$MAP_ENTRY" >/dev/null || {
            echo "::error::AAB lacks embedded Google Play deobfuscation mapping"; exit 1;
          }
          cmp "$MAP" <(unzip -p "$AAB" "$MAP_ENTRY") || {
            echo "::error::Embedded AAB mapping differs from generated R8 mapping"; exit 1;
          }
          echo "PASS: release R8 mapping generated and embedded for automatic Google Play ingestion."
          mkdir -p play-release
          java -jar "$TOOL" dump manifest --bundle="$AAB" > play-release/AndroidManifest.xml
          keytool -exportcert -rfc -keystore "$TRAYDAQ_UPLOAD_KEYSTORE" -storepass:env STORE_PASS -alias "$TRAYDAQ_UPLOAD_ALIAS" > play-release/TRAYDAQ-public-signing-certificate.pem
          cp package.json play-release/resolved-expo-package.json
          cp package-lock.json play-release/resolved-expo-package-lock.json
          cp "$AAB" play-release/TRAYDAQ-1.0.73-75.aab
          cp "$APK" play-release/TRAYDAQ-1.0.73-75.apk
          cp "$MAP" play-release/mapping.txt
          python3 - <<'PY'
          import zipfile,struct,hashlib,json,os,xml.etree.ElementTree as ET
          root=ET.parse('play-release/AndroidManifest.xml').getroot();ns='{http://schemas.android.com/apk/res/android}'
          assert root.attrib.get('package')=='com.traydaq.app'
          assert root.attrib.get(ns+'versionCode')=='75'
          assert root.find('uses-sdk').attrib.get(ns+'targetSdkVersion')=='36'
          assert root.find('uses-sdk').attrib.get(ns+'minSdkVersion')=='24'
          permissions=[x.attrib.get(ns+'name') for x in root.findall('uses-permission')]
          assert 'android.permission.SYSTEM_ALERT_WINDOW' not in permissions
          assert 'android.permission.RECORD_AUDIO' in permissions, 'Voice-note recording permission missing'
          for required in ('android.permission.CAMERA','android.permission.ACCESS_FINE_LOCATION',
                           'android.permission.ACCESS_COARSE_LOCATION','android.permission.POST_NOTIFICATIONS',
                           'android.permission.USE_BIOMETRIC'):
              assert required in permissions, 'Missing feature permission: '+required
          assert 'android.permission.READ_CONTACTS' not in permissions
          assert 'android.permission.READ_SMS' not in permissions
          assert 'android.permission.MANAGE_EXTERNAL_STORAGE' not in permissions
          assert 'android.permission.ACCESS_BACKGROUND_LOCATION' not in permissions
          assert 'com.google.android.gms.permission.AD_ID' not in permissions
          assert 'android.permission.READ_MEDIA_IMAGES' not in permissions
          assert 'android.permission.READ_MEDIA_VIDEO' not in permissions
          # Verify optional hardware requirements in the final Play-delivered manifest.
          optional_features=(
              'android.hardware.camera','android.hardware.camera.any',
              'android.hardware.camera.front','android.hardware.camera.autofocus',
              'android.hardware.camera.flash','android.hardware.microphone',
              'android.hardware.location','android.hardware.location.gps',
              'android.hardware.location.network','android.hardware.fingerprint')
          declared_features=root.findall('uses-feature')
          for feature in optional_features:
              entries=[x for x in declared_features if x.attrib.get(ns+'name')==feature]
              assert len(entries)==1, 'Optional hardware declaration missing or duplicated: '+feature
              assert entries[0].attrib.get(ns+'required')=='false', 'Google Play hardware filter still required: '+feature
          checked=[]
          with zipfile.ZipFile('play-release/TRAYDAQ-1.0.73-75.aab') as z:
              for name in z.namelist():
                  if name.endswith('.so') and ('/arm64-v8a/' in name or '/x86_64/' in name):
                      b=z.read(name);phoff=struct.unpack_from('<Q',b,32)[0];esz,count=struct.unpack_from('<HH',b,54)
                      for i in range(count):
                          p=phoff+i*esz
                          if struct.unpack_from('<I',b,p)[0]==1:
                              assert struct.unpack_from('<Q',b,p+48)[0]>=16384, '16KiB alignment failure: '+name
                      checked.append(name)
          assert checked,'No 64-bit native libraries were verified'
          for archive in ('play-release/TRAYDAQ-1.0.73-75.aab','play-release/TRAYDAQ-1.0.73-75.apk'):
              with zipfile.ZipFile(archive) as z:
                  assert not any('libtraydaq_mls_qualification.so' in name for name in z.namelist()), 'Retired MLS library included'
          print('Verified retired MLS native library absent from both user artifacts.')
          import pathlib
          source=pathlib.Path('assets/notification-sounds')
          for archive in ('play-release/TRAYDAQ-1.0.73-75.aab','play-release/TRAYDAQ-1.0.73-75.apk'):
              with zipfile.ZipFile(archive) as z:
                  for name in ('tray_signature','neo_drop','velvet_signal','quantum_tap','aura'):
                      original=(source/(name+'.ogg')).read_bytes()
                      matches=[p for p in z.namelist() if (p.startswith('res/') or p.startswith('base/res/')) and p.endswith('.ogg') and z.read(p)==original]
                      assert matches, 'Missing exact packaged audio: '+name+' in '+archive
          print('Verified all five notification sounds in both signed release artifacts.')
          mapping=open('play-release/mapping.txt','rb').read()
          assert len(mapping)>100, 'R8 mapping file missing or empty'
          with zipfile.ZipFile('play-release/TRAYDAQ-1.0.73-75.aab') as z:
              assert z.read('BUNDLE-METADATA/com.android.tools.build.obfuscation/proguard.map')==mapping, 'R8 metadata mismatch'
          info={'package':'com.traydaq.app','versionName':'1.0.73','versionCode':75,'targetSdk':36,
                'minSdk':int(root.find('uses-sdk').attrib[ns+'minSdkVersion']),
                'privateSourceCommit':os.environ['TRAYDAQ_SOURCE_SHA'],
                'signingCertificateSha256':os.environ['TRAYDAQ_EXPECTED_SIGNING_SHA256'],
                'referenceApkRun':40043905049,'referenceApkVersion':'1.0.1 (3)',
                'native64BitLibraries16KiBVerified':len(checked),'permissions':permissions,
                'optionalHardwareFeaturesVerified':list(optional_features),
                'r8Enabled':True,'googlePlayMappingEmbedded':True,
                'mappingSha256':hashlib.sha256(mapping).hexdigest(),
                'playAppSigningConfigured':False,'uploadedToGooglePlay':False,'staffBuilt':False,
                'files':{}}
          for f in ['TRAYDAQ-1.0.73-75.aab','TRAYDAQ-1.0.73-75.apk','mapping.txt']:
              b=open('play-release/'+f,'rb').read();info['files'][f]={'size':len(b),'sha256':hashlib.sha256(b).hexdigest()}
          json.dump(info,open('play-release/release-verification.json','w'),indent=2)
          print('Verified same-certificate AAB/APK, target 36, permissions and',len(checked),'16KiB ELF libraries.')
          PY
          cat > play-release/GOOGLE-PLAY-TESTING-NOTES.txt <<'NOTES'
          TRAYDAQ User Android 1.0.73 (75) — signed release candidate, not distributed
          Application ID: com.traydaq.app
          Source: 79e6654b6fe4b300c74f7e0f8d2426e7e5e9bb1e
          Includes five TRAYDAQ signature notification sounds, per-category settings and previews, booking push alerts, Modern Twi strings, and all prior merged user features. Backend notification migration and sender updates deployed; physical-device notification playback still requires verification.
          Existing ordinary conversations and staff applications remain unchanged.
          Do not distribute or upload this candidate to Play until live backend compatibility,
          messaging, staged privacy and scheduling gates and physical-device verification have passed.
          NOTES
          echo "PASS: user AAB; package=$PACKAGE versionCode=$CODE target API=$TARGET, original signing key."
          sha256sum "$AAB"

      - name: Save signed user AAB, compatible APK and public verification evidence
        uses: actions/upload-artifact@v4
        with:
          name: TRAYDAQ-V2-User-1.0.73-75-Release-Candidate
          path: private-src/mobile/play-release/
          retention-days: 14
          if-no-files-found: error

      - name: Report signed release outcome
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          JOB_RESULT: ${{ job.status }}
        run: |
          if [ "$JOB_RESULT" = success ]; then STATE=success; else STATE=failure; fi
          payload="$(jq -n --arg state "$STATE" --arg target_url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" '{state:$state,context:"traydaq-v2/user-signed-1073-75",description:"Signed user APK and AAB release checks",target_url:$target_url}')"
          curl --fail --silent --show-error -X POST -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" -d "$payload" >/dev/null

      - name: Remove temporary signing files
        if: always()
        working-directory: .
        run: rm -f "$RUNNER_TEMP/traydaq-existing-upload.jks" "$RUNNER_TEMP/original-cert.txt" "$RUNNER_TEMP/expected-cert.txt" "$RUNNER_TEMP/aab-cert.txt" "$RUNNER_TEMP/key-check.csr"

