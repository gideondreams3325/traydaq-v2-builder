name: TRAYDAQ Android Settings All Pages Source QA (NO RELEASE)
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/android-settings-all-pages-20261111-source-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: traydaq-android-settings-all-pages-20261111-source-only
  cancel-in-progress: true
jobs:
  settings-source-only:
    name: Android Settings source regressions and TypeScript (NO APK/AAB)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      CI: '1'
      EXPO_NO_TELEMETRY: '1'
    defaults:
      run:
        working-directory: private-src/mobile
    steps:
      - name: Checkout exact TRAYDAQ V2 candidate
        uses: actions/checkout@v4
        with:
          repository: gideondreams3325/traydaq-v2
          ref: c8a20457130a28f9c8c69752eb825ed8eab86f6a
          path: private-src
          token: ${{ secrets.TRAYDAQ_V2_SOURCE_READ_TOKEN }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: private-src/mobile/package-lock.json
      - name: Install exact source dependencies
        run: npm ci --no-audit --no-fund
      - name: Focused Settings destinations and button audit
        run: node --test tests/settings-v2-modern-all-pages-20261111.test.mjs
      - name: Full Android user regressions
        if: always()
        run: node --test tests/*.test.mjs
      - name: Android TypeScript
        if: always()
        run: npm run typecheck
      - name: Source-only validation confirmation
        if: always()
        run: echo 'No APK, AAB, signing, build, upload, Play Store or production deployment was initiated.'
