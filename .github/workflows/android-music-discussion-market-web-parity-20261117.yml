name: TRAYDAQ Android Music Discussions Marketplace UI QA (NO RELEASE)
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/android-music-discussion-market-web-parity-20261117.yml"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: traydaq-android-music-discussions-market-20261117
  cancel-in-progress: false
env:
  PRIVATE_SOURCE_SHA: 19f6a10c47afbfbf6b133931035842a5f84c8680
  CI: '1'
  EXPO_NO_TELEMETRY: '1'
jobs:
  android:
    name: Android user layout regressions, typecheck and JS export only
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - name: Checkout pinned private user-app candidate
        uses: actions/checkout@v4
        with:
          repository: gideondreams3325/traydaq-v2
          ref: ${{ env.PRIVATE_SOURCE_SHA }}
          token: ${{ secrets.TRAYDAQ_V2_SOURCE_READ_TOKEN }}
          path: private-src
          persist-credentials: false
      - name: Require exact pinned source SHA
        working-directory: private-src
        run: test "$(git rev-parse HEAD)" = "$PRIVATE_SOURCE_SHA"
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: private-src/mobile/package-lock.json
      - name: Install locked native dependencies
        working-directory: private-src/mobile
        run: npm ci --no-audit --no-fund
      - name: Test music discussion marketplace fixes
        working-directory: private-src/mobile
        run: node --test tests/android-music-market-web-parity-20261117.test.mjs tests/market-currency-international.test.mjs tests/marketplace-reference-redesign.test.mjs tests/music-jobs-events-audit.test.mjs tests/guest-browsing-interactions.test.mjs tests/for-you-inline-comments-and-copy.test.mjs
      - name: Run entire Android regression suite
        working-directory: private-src/mobile
        run: node --test tests/*.test.mjs
      - name: Android TypeScript validation
        working-directory: private-src/mobile
        run: npm run typecheck
      - name: Android JavaScript export only (NO APK/AAB)
        working-directory: private-src/mobile
        run: npm run export:android
# Read-only V2 Builder validation, no signing, no APK/AAB, no Play release, no deployment.
