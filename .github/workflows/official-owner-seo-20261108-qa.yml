name: TRAYDAQ Official Owner SEO Source Validation
# Read-only private-source verification. Never deploy, publish or build APK/AAB.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/official-owner-seo-20261108-qa.yml
permissions:
  contents: read
jobs:
  owner-seo:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: private-src
    steps:
      - name: Check out private TRAYDAQ V2 owner SEO branch
        uses: actions/checkout@v4
        with:
          repository: gideondreams3325/traydaq-v2
          ref: main
          path: private-src
          token: ${{ secrets.TRAYDAQ_V2_SOURCE_READ_TOKEN }}
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: private-src/package-lock.json
      - name: Verify public ownership metadata and Cloudflare sitemap contracts
        run: node --test tests/google-discovery-seo.test.mjs tests/google-sitemap-build.test.mjs tests/google-public-indexing.test.mjs tests/owner-legal-route-recovery.test.mjs tests/existing-app-public-legal-parity.test.mjs
      - name: Install dependencies for web-only validation
        run: npm ci --no-audit --no-fund
      - name: Run full web source tests
        run: npm test
      - name: Check web TypeScript
        run: npm run typecheck
      - name: Build Cloudflare site with SEO output validation (no Android builds)
        run: npm run build
      - name: Check bundled standalone Privacy and Terms documents
        run: |
          set -euo pipefail
          test -s dist/privacy-document.html
          test -s dist/terms-document.html
          grep -Fq '<h1>Privacy Notice</h1>' dist/privacy-document.html
          grep -Fq '<h1>Terms of Service</h1>' dist/terms-document.html
          grep -Fq 'support@traydaq.com' dist/privacy-document.html
          grep -Fq 'support@traydaq.com' dist/terms-document.html
          test -s dist/traydaq-owner-gideon-manu-appiah-fenyi-friempong-hd.webp
          echo "PASS: Cloudflare build contains full legal documents and owner portrait"

