name: TRAYDAQ STAFF source verification (no APK)
on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - .github/workflows/admin-source-check.yml

permissions:
  contents: read

jobs:
  source-check:
    if: "${{ github.event_name == 'workflow_dispatch' || github.event.head_commit.message == 'ci(admin): verify updated legacy module parity tests' }}"
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: private-src/admin-native
    steps:
      - name: Checkout private TRAYDAQ V2 Admin sources
        uses: actions/checkout@v4
        with:
          repository: gideondreams3325/traydaq-v2
          ref: feat/standalone-admin-native
          token: ${{ secrets.TRAYDAQ_V2_SOURCE_READ_TOKEN }}
          path: private-src
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Admin access contracts
        run: node --test tests/admin-access.test.mjs
      - name: Install TypeScript dependencies
        run: npm install --no-audit --no-fund
      - name: Typecheck React Native screens
        run: npm run typecheck
      - name: Confirm no APK or signing actions in this workflow
        run: |
          test -f src/departmentModules.ts
          echo "Verified source only. No Android build, signing, or deployment."
