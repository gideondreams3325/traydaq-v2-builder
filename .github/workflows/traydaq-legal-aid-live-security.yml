name: TRAYDAQ Legal Aid live read-only authorization smoke
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/traydaq-legal-aid-live-security.yml"
      - ".github/traydaq-legal-aid-live-request.txt"
permissions:
  contents: read
jobs:
  legal-aid-live:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Anonymous native case actions require real authenticated Staff appointments
        shell: bash
        run: |
          set -euo pipefail
          BASE='https://qpcsruhwqhniprakpoox.supabase.co/functions/v1/firebase-legal-aid'
          for action in status cases case sample-pdf; do
            code=$(curl -sS --retry 2 --max-time 22 -o "$RUNNER_TEMP/result" -w '%{http_code}' "$BASE?action=$action")
            test "$code" = 401 || { echo "::error::Unauthenticated Legal Aid $action returned $code"; exit 1; }
            code=$(curl -sS --retry 2 --max-time 22 -o "$RUNNER_TEMP/result" -w '%{http_code}' -H 'Origin: https://staff.traydaq.com' "$BASE?action=$action")
            test "$code" = 403 || { echo "::error::Browser-origin Legal Aid $action returned $code"; exit 1; }
          done
          echo 'Native Legal Aid protected routes reject unauthenticated requests and browser origins.'
      - name: Owner's private archive requires recent Firebase sign-in and cannot be a public GET
        shell: bash
        run: |
          set -euo pipefail
          BASE='https://qpcsruhwqhniprakpoox.supabase.co/functions/v1/firebase-legal-aid-live-archive'
          code=$(curl -sS --retry 2 --max-time 22 -o "$RUNNER_TEMP/result" -w '%{http_code}' "$BASE")
          test "$code" = 405 || { echo "::error::Archive public GET returned $code"; exit 1; }
          for action in archive list verify delete; do
            code=$(curl -sS --retry 2 --max-time 22 -o "$RUNNER_TEMP/result" -w '%{http_code}' \
              -X POST -H 'Content-Type: application/json' --data "{\"action\":\"$action\"}" "$BASE")
            test "$code" = 401 || { echo "::error::Unauthorized archive POST $action returned $code"; exit 1; }
          done
          echo 'No owner records, private PDF or personal identity values were retrieved or modified.'
