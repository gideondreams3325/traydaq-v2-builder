name: TRAYDAQ TrayTrade Stable Professional Cards — Source QA Only
on:
  push:
    branches: [main]
    paths: [.github/workflows/traytrade-service-card-stability-20261123-source-qa.yml]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: traydaq-traytrade-service-cards-background-refresh-20261123
  cancel-in-progress: false
env:
  SOURCE_REF: fix/traytrade-stable-service-cards-background-refresh-20261123
  CI: '1'
  EXPO_NO_TELEMETRY: '1'
jobs:
  mobile:
    name: Android TrayTrade service stability and full regression (no APK/AAB)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          repository: gideondreams3325/traydaq-v2
          ref: ${{ env.SOURCE_REF }}
          token: ${{ secrets.TRAYDAQ_V2_SOURCE_READ_TOKEN }}
          path: private-src
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: private-src/mobile/package-lock.json
      - name: Install Android source dependencies
        working-directory: private-src/mobile
        run: npm ci --no-audit --no-fund
      - name: TrayTrade stable cards, backend catalog and existing marketplace contracts
        working-directory: private-src/mobile
        run: node --test tests/traytrade-stable-service-background-refresh-20261123.test.mjs tests/professional-marketplace-parity.test.mjs tests/public-services-search-completeness.test.mjs tests/marketplace-reference-redesign.test.mjs
      - name: Typecheck Android (source only)
        working-directory: private-src/mobile
        run: npm run typecheck
      - name: Full native regression suite
        working-directory: private-src/mobile
        shell: bash
        run: |
          set -euo pipefail
          if node --test tests/*.test.mjs > "$RUNNER_TEMP/traytrade-service-card-regressions.log" 2>&1; then
            echo "PASS: native regression suite"
          else
            grep '^not ok ' "$RUNNER_TEMP/traytrade-service-card-regressions.log" | head -n 25 || true
            exit 1
          fi
  shared:
    name: TrayTrade public web and storefront compatibility (no deploy)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          repository: gideondreams3325/traydaq-v2
          ref: ${{ env.SOURCE_REF }}
          token: ${{ secrets.TRAYDAQ_V2_SOURCE_READ_TOKEN }}
          path: private-src
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: private-src/package-lock.json
      - name: Install web dependencies
        working-directory: private-src
        run: npm ci --no-audit --no-fund
      - name: Product/service/storefront parity and fixed-height rail contracts
        working-directory: private-src
        run: node --test tests/marketplace-category-store-grouping-parity.test.mjs tests/professional-service-discovery-parity.test.mjs tests/marketplace-no-clipped-rails.test.mjs
      - name: Web TypeScript validation
        working-directory: private-src
        run: npm run typecheck
# No Gradle, APK, AAB, Play Console, Supabase deploy or Cloudflare deployment.
