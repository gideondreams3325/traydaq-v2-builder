name: TRAYDAQ Direct Video Autoplay No Covers (Web + Android Source QA)
on:
  push:
    branches: [main]
    paths: ['.github/workflows/instant-coverless-feed-video-20261115.yml']
  workflow_dispatch:
permissions:
  contents: read
env:
  PRIVATE_SOURCE_SHA: 078fab49739167793580f153cc4ebf36c010b585
  CI: '1'
  EXPO_NO_TELEMETRY: '1'
jobs:
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          repository: gideondreams3325/traydaq-v2
          ref: ${{ env.PRIVATE_SOURCE_SHA }}
          token: ${{ secrets.TRAYDAQ_V2_SOURCE_READ_TOKEN }}
          path: private-src
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: private-src/package-lock.json
      - name: Verify exact private source commit
        working-directory: private-src
        run: test "$(git rev-parse HEAD)" = "$PRIVATE_SOURCE_SHA"
      - name: Install Web dependencies
        working-directory: private-src
        run: npm ci --no-audit --no-fund
      - name: Full Web regression suite
        working-directory: private-src
        run: npm test
      - name: Web TypeScript
        if: always()
        working-directory: private-src
        run: npm run typecheck
      - name: Cloudflare-ready Web build
        if: always()
        working-directory: private-src
        run: npm run build
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          repository: gideondreams3325/traydaq-v2
          ref: ${{ env.PRIVATE_SOURCE_SHA }}
          token: ${{ secrets.TRAYDAQ_V2_SOURCE_READ_TOKEN }}
          path: private-src
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: private-src/mobile/package-lock.json
      - name: Verify exact private source commit
        working-directory: private-src
        run: test "$(git rev-parse HEAD)" = "$PRIVATE_SOURCE_SHA"
      - name: Install Android dependencies
        working-directory: private-src/mobile
        run: npm ci --no-audit --no-fund
      - name: Full Android regression suite
        working-directory: private-src/mobile
        run: node --test tests/*.test.mjs
      - name: Android TypeScript
        if: always()
        working-directory: private-src/mobile
        run: npm run typecheck
      - name: Android JavaScript export only
        if: always()
        working-directory: private-src/mobile
        run: npx expo export --platform android
# Source QA only: no APK, AAB or production deployment.
