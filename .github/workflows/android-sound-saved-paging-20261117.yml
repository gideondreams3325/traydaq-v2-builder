name: TRAYDAQ Android Saved Sounds and Unlimited Sound Grid QA (NO RELEASE)
on:
  push:
    branches: [main]
    paths: [".github/workflows/android-sound-saved-paging-20261117.yml"]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: traydaq-android-sound-saved-paging-20261117
  cancel-in-progress: false
env:
  PRIVATE_SOURCE_SHA: 571c37307bc6a8656dbe1e583e1dbc68b2974dca
  CI: '1'
  EXPO_NO_TELEMETRY: '1'
jobs:
  android:
    name: Saved reusable sounds and all-posts grid - exact source QA
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - name: Checkout exact private candidate (read-only)
        uses: actions/checkout@v4
        with:
          repository: gideondreams3325/traydaq-v2
          ref: ${{ env.PRIVATE_SOURCE_SHA }}
          token: ${{ secrets.TRAYDAQ_V2_SOURCE_READ_TOKEN }}
          path: private-src
          persist-credentials: false
      - name: Verify pinned private source commit
        working-directory: private-src
        run: test "$(git rev-parse HEAD)" = "$PRIVATE_SOURCE_SHA"
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: private-src/mobile/package-lock.json
      - name: Install locked Android dependencies
        working-directory: private-src/mobile
        run: npm ci --no-audit --no-fund
      - name: Run focused sound paging and saved selection tests
        working-directory: private-src/mobile
        run: node --test tests/android-saved-sound-pagination-20261117.test.mjs tests/android-reusable-sounds-20261117.test.mjs
      - name: Run full Android regression suite
        working-directory: private-src/mobile
        run: node --test tests/*.test.mjs
      - name: Validate native TypeScript
        working-directory: private-src/mobile
        run: npm run typecheck
      - name: Confirm native Expo app config
        working-directory: private-src/mobile
        run: npx expo config --type introspect --json > /tmp/traydaq-sound-paging-config.json
      - name: Validate Android JavaScript bundle only
        working-directory: private-src/mobile
        run: npm run export:android
# No APK, AAB, signing, production deployment, Cloudflare write, or Play release.
