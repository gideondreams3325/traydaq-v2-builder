name: TRAYDAQ fresh WhatsApp post thumbnail - customer Cloudflare Worker only
# Owner-authorized release of main 550f0d0; never deploy staff/legal, APK/AAB, DNS or Pages.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/traydaq-whatsapp-fresh-thumbnail-worker-20261119.yml'
permissions:
  contents: read
concurrency:
  group: traydaq-v2-customer-worker-only-fresh-whatsapp
  cancel-in-progress: false
jobs:
  deploy-verified-customer-worker:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: private-src
    steps:
      - name: Checkout exact merged TRAYDAQ V2 website source
        uses: actions/checkout@v4
        with:
          repository: gideondreams3325/traydaq-v2
          ref: 550f0d0c504ca2d9cb802660d3b6d45e0a72165c
          path: private-src
          token: ${{ secrets.TRAYDAQ_V2_SOURCE_READ_TOKEN }}
          persist-credentials: false
      - name: Confirm exact authorized main SHA and existing customer Worker target
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "550f0d0c504ca2d9cb802660d3b6d45e0a72165c"
          node --input-type=module -e "
            import {readFileSync} from 'node:fs';
            const c=JSON.parse(readFileSync('wrangler.jsonc','utf8'));
            if(c.name!=='traydaq-v2'||c.main!=='./worker/seo.js'||
              c.assets?.directory!=='./dist'||!c.assets?.run_worker_first?.includes('/'))
              throw Error('Not the original TRAYDAQ V2 customer Worker');
            if(!readFileSync('worker/seo.js','utf8').includes('renderMusicSharePlayer'))
              throw Error('Reviewed original TRAYDAQ share player missing');
          "
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: private-src/package-lock.json
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Verify public sharing regression tests
        run: node --test tests/all-content-shared-previews.test.mjs tests/shared-post-link-preview.test.mjs tests/google-public-indexing.test.mjs
      - name: Verify entire web app
        run: npm test && npm run typecheck && npm run build
      - name: Verify official music branding in deployable assets
        run: |
          test -s dist/traydaq-music-logo.webp
          node scripts/verify-public-search-output.mjs dist
      - name: Authenticate only to existing customer Cloudflare Worker (read-only)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          node scripts/verify-existing-customer-worker.mjs
      - name: Deploy only TRAYDAQ existing customer Worker
        uses: cloudflare/wrangler-action@v3
        with:
          workingDirectory: private-src
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || vars.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: 4.156.2
          command: deploy --config wrangler.jsonc
      - name: Verify fresh post card on production with a real WhatsApp crawler
        run: |
          python3 - <<'PY'
          import re,html,urllib.request
          url='https://traydaq.com/?post=b7207876-c2c2-4784-bf5e-e02d5acc4a94&pv=20261119b'
          req=urllib.request.Request(url,headers={'User-Agent':'WhatsApp/2.24.10.78 A'})
          with urllib.request.urlopen(req,timeout=30) as response:
            if response.status!=200 or 'text/html' not in response.headers.get('Content-Type',''):
              raise ValueError('Public post preview did not return HTML')
            page=response.read(160000).decode('utf-8','replace')
          def tag(field):
            match=re.search(r'<meta property="'+re.escape(field)+r'" content="([^"]*)"',page)
            return html.unescape(match.group(1)) if match else ''
          expected_image='https://qpcsruhwqhniprakpoox.supabase.co/storage/v1/object/public/traydaq-native-creator-public/b7207876-c2c2-4784-bf5e-e02d5acc4a94/share-poster.jpg'
          if tag('og:url')!=url or tag('og:image')!=expected_image:
            raise ValueError('WhatsApp may still reuse the unversioned card or logo')
          if 'name="twitter:card" content="summary_large_image"' not in page:
            raise ValueError('Large image preview missing')
          print('PASS: production versioned WhatsApp link displays exact content image')
          PY
      - name: Report only verified production deploy
        if: success()
        run: echo "Existing traydaq-v2 customer Worker was deployed at source 550f0d0c504ca2d9cb802660d3b6d45e0a72165c. No APK/AAB or staff/legal Worker changes."
