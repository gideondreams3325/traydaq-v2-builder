name: Trayhub Android navigation validation (no app build)
on:
  push:
    branches: [main]
    paths: ['.github/workflows/validate-trayhub-branding-20261126.yml']
  pull_request:
    paths: ['.github/workflows/validate-trayhub-branding-20261126.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          repository: gideondreams3325/traydaq-v2
          ref: a9c819edcf1d53f86dc6fb252d9379e4fefb5d90
          token: ${{ secrets.TRAYDAQ_V2_SOURCE_READ_TOKEN }}
          path: private-src
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install locked dependencies
        working-directory: private-src/mobile
        run: npm ci --no-audit --no-fund
      - name: Run native source regressions
        working-directory: private-src/mobile
        run: node --test tests/*.test.mjs
      - name: Native typecheck
        working-directory: private-src/mobile
        run: npm run typecheck
