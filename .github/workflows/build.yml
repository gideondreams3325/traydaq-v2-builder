name: TRAYDAQ V2 Native Android APK Builder

# Public runner builds private React Native source, not the old web/Capacitor main.
# Verified native source ref (secure order history and payment references): 18a8a3730d1d21aba13e67d855fa1a983eeae17e
# Never print or upload private source; only publish the signed testing APK.
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/build.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: traydaq-v2-native-apk
  cancel-in-progress: false

jobs:
  android:
    name: TRAYDAQ V2 React Native standalone APK
    runs-on: ubuntu-latest
    timeout-minutes: 75
    env:
      CI: "1"
      EXPO_NO_TELEMETRY: "1"
      NODE_OPTIONS: "--max-old-space-size=6144"
    defaults:
      run:
        working-directory: private-src/mobile
    steps:
      - name: Verify private V2 repository read access
        working-directory: .
        shell: bash
        env:
          SOURCE_TOKEN_CONFIGURED: ${{ secrets.TRAYDAQ_V2_SOURCE_READ_TOKEN != '' }}
        run: |
          if [ "$SOURCE_TOKEN_CONFIGURED" != "true" ]; then
            echo "::error::TRAYDAQ_V2_SOURCE_READ_TOKEN must have read-only Contents access to private traydaq-v2."
            exit 1
          fi

      - name: Check out only the private React Native migration branch
        uses: actions/checkout@v4
        with:
          repository: gideondreams3325/traydaq-v2
          ref: feat/react-native-expo-v2
          path: private-src
          token: ${{ secrets.TRAYDAQ_V2_SOURCE_READ_TOKEN }}
          persist-credentials: false
          fetch-depth: 1

      - name: Identify exact native source commit
        shell: bash
        working-directory: private-src
        run: |
          echo "TRAYDAQ_SOURCE_REF=feat/react-native-expo-v2"
          echo "TRAYDAQ_SOURCE_SHA=$(git rev-parse HEAD)"
          test -f mobile/src/App.tsx
          test -f mobile/app.json
          test -f mobile/src/lib/firebase.ts
          test ! -d mobile/android

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Set up Android SDK with an available package
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android API 36
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Install native packages
        run: npm install --no-audit --no-fund

      - name: Verify RTDB security source constraints
        run: node --test tests/security.test.mjs

      - name: Validate Expo dependencies
        run: npx expo-doctor

      - name: Check React Native TypeScript
        run: npm run typecheck

      - name: Bundle native Android JavaScript
        run: npx expo export --platform android

      - name: Generate native Android project
        run: npx expo prebuild --platform android --non-interactive

      - name: Build standalone signed APK
        working-directory: private-src/mobile/android
        shell: bash
        run: |
          set -euo pipefail
          chmod +x ./gradlew
          # Release variant embeds JS/Hermes assets; no Metro dev server is needed.
          # Expo-generated default debug keystore is used for this TEST build only.
          ./gradlew --no-daemon :app:assembleRelease

      - name: Verify native APK is installable and has an offline bundle
        shell: bash
        run: |
          set -euo pipefail
          APK=android/app/build/outputs/apk/release/app-release.apk
          test -s "$APK"
          unzip -t "$APK" >/dev/null
          unzip -Z1 "$APK" | grep -E '^assets/(index.android.bundle|.*\.hbc)$'
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify "$APK"
          sha256sum "$APK"
          mkdir -p build-output
          cp "$APK" build-output/TRAYDAQ-V2-native-test.apk

      - name: Upload APK only (never private source)
        uses: actions/upload-artifact@v4
        with:
          name: TRAYDAQ-V2-native-test-APK
          path: private-src/mobile/build-output/TRAYDAQ-V2-native-test.apk
          if-no-files-found: error
          retention-days: 14
