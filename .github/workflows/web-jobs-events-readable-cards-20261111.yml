name: TRAYDAQ Web Jobs and Events Readable Cards QA (No Release)
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/web-jobs-events-readable-cards-20261111.yml"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: traydaq-web-readable-jobs-events-20261111
  cancel-in-progress: true
env:
  PRIVATE_SOURCE_SHA: a5ec908d13f09dfea0f56e67bf25a4242f0233e1
jobs:
  web:
    name: Web regression tests + TypeScript + Cloudflare bundle (no deploy)
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      CI: "1"
    steps:
      - name: Checkout exact private source (read-only)
        uses: actions/checkout@v4
        with:
          repository: gideondreams3325/traydaq-v2
          ref: ${{ env.PRIVATE_SOURCE_SHA }}
          path: private-src
          token: ${{ secrets.TRAYDAQ_V2_SOURCE_READ_TOKEN }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: private-src/package-lock.json
      - name: Install web dependencies
        working-directory: private-src
        shell: bash
        run: npm ci --no-audit --no-fund > "$RUNNER_TEMP/web-install.log" 2>&1 || { echo "::error::Web install failed"; exit 1; }
      - name: Compare complete test suite against separately verified main baseline
        working-directory: private-src
        shell: bash
        run: |
          npm test > "$RUNNER_TEMP/web-tests.log" 2>&1 || true
          grep -E '^# (tests|pass|fail) [0-9]+$' "$RUNNER_TEMP/web-tests.log" | tail -3 || true
          grep -E '^not ok [0-9]+ - ' "$RUNNER_TEMP/web-tests.log" | sed -E 's/^not ok [0-9]+ - //' | sort > "$RUNNER_TEMP/actual-failures.txt" || true
          printf '%s\n' \
            'Analyst and Overall Head reporting is aggregate, scoped, and read-only' \
            'Analyst and inherited Overall Head cannot read case worklists or source IDs' \
            'compact Android Staff navigation derives both quick tabs and More from the same permission filter' \
            'glass Staff menu is search-only and cannot grant new role or department permissions' > "$RUNNER_TEMP/baseline-failures.txt"
          if ! diff -u "$RUNNER_TEMP/baseline-failures.txt" "$RUNNER_TEMP/actual-failures.txt"; then
            echo "::error::PR introduces new or changed failing tests relative to main baseline"
            exit 1
          fi
          if ! grep -Fxq '# tests 1069' "$RUNNER_TEMP/web-tests.log"; then
            echo "::error::Unexpected test count; baseline comparison requires revalidation"
            exit 1
          fi
          echo "::warning::4 pre-existing staff permission/navigation tests fail identically on main; no additional failures introduced by this web-only PR"
      - name: Run web layout regression tests (all must pass)
        working-directory: private-src
        shell: bash
        run: |
          node --test tests/web-music-room-compact-jobs-events-20261111.test.mjs tests/browse-scroll-parity.test.mjs tests/web-no-bottom-nav-viewport-20261111.test.mjs tests/web-only-bottom-navigation-removal-20261111.test.mjs > "$RUNNER_TEMP/web-layout-tests.log" 2>&1 || {
            echo "::error::Web layout regression tests failed"
            grep -E '^not ok [0-9]+ - ' "$RUNNER_TEMP/web-layout-tests.log" | head -20 || true
            exit 1
          }
          grep -E '^# (tests|pass|fail) [0-9]+$' "$RUNNER_TEMP/web-layout-tests.log" | tail -3 || true
      - name: Check TypeScript
        working-directory: private-src
        shell: bash
        run: |
          if npm run typecheck > "$RUNNER_TEMP/typecheck.log" 2>&1; then
            echo "PASS web TypeScript"
          else
            echo "::error::Web TypeScript failed"
            grep -E 'error TS[0-9]+' "$RUNNER_TEMP/typecheck.log" | head -20 || true
            exit 1
          fi
      - name: Build Cloudflare-ready web assets only
        working-directory: private-src
        shell: bash
        run: npm run build > "$RUNNER_TEMP/web-build.log" 2>&1 || { echo "::error::Web build failed"; exit 1; }
      - name: Confirm source-only checks
        run: echo "PASS web validation. No Cloudflare deployment or Android APK/AAB built."
