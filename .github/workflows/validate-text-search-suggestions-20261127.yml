name: TRAYDAQ text search suggestions validation
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [".github/workflows/validate-text-search-suggestions-20261127.yml"]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        component: [web, android]
    steps:
      - uses: actions/checkout@v4
        with:
          repository: gideondreams3325/traydaq-v2
          ref: b7c61e11e8ede205a9f102e3e00fc6de7f2434f9
          path: private-src
          token: ${{ secrets.TRAYDAQ_V2_SOURCE_READ_TOKEN }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Typecheck and source regressions (no release)
        working-directory: private-src
        env:
          COMPONENT: ${{ matrix.component }}
          CI: "1"
          NODE_OPTIONS: "--max-old-space-size=6144"
        run: |
          if [ "$COMPONENT" = android ]; then cd mobile; fi
          npm ci --no-audit --no-fund > "$RUNNER_TEMP/install.log" 2>&1 || { echo 'Dependency install failed'; exit 1; }
          set +e
          npm run typecheck > "$RUNNER_TEMP/ts.log" 2>&1
          ts_rc=$?
          grep -E 'error TS[0-9]+' "$RUNNER_TEMP/ts.log" | cut -c1-180 | head -60 || true
          node --test tests/*.test.mjs > "$RUNNER_TEMP/tests.log" 2>&1
          test_rc=$?
          grep -E '^(not ok|# (tests|pass|fail) [0-9]+)' "$RUNNER_TEMP/tests.log" | cut -c1-180 | head -80
          test "$ts_rc" -eq 0 && test "$test_rc" -eq 0
