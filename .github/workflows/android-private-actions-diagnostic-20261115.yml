name: Diagnose private Actions scheduling
on:
  push:
    branches: [main]
    paths: ['.github/workflows/android-private-actions-diagnostic-20261115.yml']
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Classify read-only job annotations
        env:
          READ_TOKEN: ${{ secrets.TRAYDAQ_V2_SOURCE_READ_TOKEN }}
        run: |
          python3 - <<'PY'
          import json, os, re, urllib.error, urllib.request
          token = os.environ.get('READ_TOKEN', '')
          if not token:
              print('annotation_access=token_missing')
              raise SystemExit(0)
          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, req, fp, code, msg, headers, newurl):
                  return None
          opener = urllib.request.build_opener(NoRedirect)
          checks = [132771171727, 132771172055, 132771172020]
          patterns = [
              ('billing_or_spending', r'billing|payment|unpaid|spending|credit card'),
              ('usage_quota', r'quota|minutes|usage limit|storage limit|exceeded.*limit'),
              ('account_restricted', r'account.*(?:locked|suspended|restricted|blocked)'),
              ('actions_disabled', r'actions.*disabled|disabled.*actions'),
              ('runner_unavailable', r'runner|hosted.*(?:unavailable|disabled)'),
              ('workflow_permission', r'permission|unauthorized|forbidden|not permitted'),
              ('deprecated_action', r'deprecated|outdated|unsupported.*action'),
              ('configuration', r'invalid workflow|workflow.*invalid|syntax error'),
          ]
          for check in checks:
              url = 'https://api.github.com/repos/gideondreams3325/traydaq-v2/check-runs/' + str(check) + '/annotations?per_page=100'
              req = urllib.request.Request(url, headers={'Authorization': 'Bearer '+token, 'Accept': 'application/vnd.github+json', 'X-GitHub-Api-Version': '2022-11-28', 'User-Agent': 'TRAYDAQ-read-only-diagnostic'})
              try:
                  with opener.open(req, timeout=20) as response:
                      annotations = json.load(response)
              except urllib.error.HTTPError as error:
                  print('check=' + str(check) + ' annotation_access=http_' + str(error.code))
                  continue
              except Exception:
                  print('check=' + str(check) + ' annotation_access=unavailable')
                  continue
              categories = set()
              for annotation in annotations if isinstance(annotations, list) else []:
                  message = ' '.join(str(annotation.get(field) or '') for field in ('title','message','raw_details')).lower()
                  matches = [name for name, pattern in patterns if re.search(pattern, message)]
                  categories.update(matches or ['unclassified'])
              print('check=' + str(check) + ' annotations=' + str(len(annotations)) + ' categories=' + ','.join(sorted(categories)))
          PY
