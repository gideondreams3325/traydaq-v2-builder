name: TRAYDAQ Feed Media Loading QA (Android + Web)
on:
  push:
    branches: [main]
    paths: ['.github/workflows/feed-media-loading-qa-20261115.yml']
  workflow_dispatch:
permissions:
  contents: read
env:
  PRIVATE_SOURCE_SHA: 87d33e6be8e74e13f4a890972d834f283c33c7eb
  CI: '1'
  EXPO_NO_TELEMETRY: '1'
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          repository: gideondreams3325/traydaq-v2
          ref: ${{ env.PRIVATE_SOURCE_SHA }}
          token: ${{ secrets.TRAYDAQ_V2_SOURCE_READ_TOKEN }}
          path: private-src
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: private-src/mobile/package-lock.json
      - name: Verify source SHA
        working-directory: private-src
        run: test "$(git rev-parse HEAD)" = "$PRIVATE_SOURCE_SHA"
      - name: Install Android dependencies
        working-directory: private-src/mobile
        run: npm ci --no-audit --no-fund
      - name: Android source regression tests
        working-directory: private-src/mobile
        run: node --test tests/*.test.mjs
      - name: Android TypeScript
        if: always()
        working-directory: private-src/mobile
        run: npm run typecheck
      - name: Android JS export, no APK/AAB
        working-directory: private-src/mobile
        run: npx expo export --platform android
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          repository: gideondreams3325/traydaq-v2
          ref: ${{ env.PRIVATE_SOURCE_SHA }}
          token: ${{ secrets.TRAYDAQ_V2_SOURCE_READ_TOKEN }}
          path: private-src
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: private-src/package-lock.json
      - name: Verify source SHA
        working-directory: private-src
        run: test "$(git rev-parse HEAD)" = "$PRIVATE_SOURCE_SHA"
      - name: Install web dependencies
        working-directory: private-src
        run: npm ci --no-audit --no-fund
      - name: All web regression tests
        working-directory: private-src
        run: npm test
      - name: Web TypeScript
        if: always()
        working-directory: private-src
        run: npm run typecheck
      - name: Cloudflare-targeted web build (no deployment)
        working-directory: private-src
        run: npm run build
# For You/Following image and video loading validation only; no deployments, signing, APK or AAB builds.
