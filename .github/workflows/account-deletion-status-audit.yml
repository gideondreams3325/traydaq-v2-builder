name: TRAYDAQ V2 Account Deletion Status Safety (No Deployment)
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/account-deletion-status-audit.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: traydaq-account-deletion-safety
  cancel-in-progress: false
jobs:
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          repository: gideondreams3325/traydaq-v2
          ref: 154d50bf367908d0506ff63573b74b80e9acdd1a
          path: private-src
          token: ${{ secrets.TRAYDAQ_V2_SOURCE_READ_TOKEN }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install
        working-directory: private-src
        run: npm ci --no-audit --no-fund
      - name: Account deletion security regression
        working-directory: private-src
        run: node --test tests/account-deletion-status-safety.test.mjs tests/account-owner-self-service-erasure.test.mjs tests/account-deletion-review-routing.test.mjs
      - name: Complete web suite
        working-directory: private-src
        run: npm test
      - name: TypeScript
        working-directory: private-src
        if: always()
        run: npm run typecheck
      - name: Web build
        working-directory: private-src
        if: always()
        run: npm run build
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          repository: gideondreams3325/traydaq-v2
          ref: 154d50bf367908d0506ff63573b74b80e9acdd1a
          path: private-src
          token: ${{ secrets.TRAYDAQ_V2_SOURCE_READ_TOKEN }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install native
        working-directory: private-src/mobile
        run: npm install --no-audit --no-fund
      - name: Native tests
        working-directory: private-src/mobile
        run: node --test tests/*.test.mjs
      - name: Native TypeScript
        working-directory: private-src/mobile
        if: always()
        run: npm run typecheck
      - name: Expo doctor
        working-directory: private-src/mobile
        if: always()
        run: npx expo-doctor
# Safe dry-run validation only; never call account erasure or deploy functions.
