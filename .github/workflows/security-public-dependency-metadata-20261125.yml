name: Public npm security metadata probe (no private source)
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/security-public-dependency-metadata-20261125.yml']
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Resolve only independently public npm packages
        shell: bash
        run: |
          set -euo pipefail
          cd "$(mktemp -d)"
          cat >package.json <<'JSON'
          {"name":"public-security-metadata-probe","version":"1.0.0","private":true,"dependencies":{"@grpc/grpc-js":"1.14.7","@capacitor/android":"8.5.1","@capacitor/core":"8.5.1","@capacitor/cli":"8.5.1"}}
          JSON
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          node -e 'const lock=require("./package-lock.json"); delete lock.packages[""]; for(const [path,value] of Object.entries(lock.packages)) console.log("PUBLIC_NPM_METADATA "+JSON.stringify([path,value]));'
