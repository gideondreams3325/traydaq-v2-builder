name: TRAYDAQ Android For You Startup Validation (No APK)
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/for-you-startup-android-validation.yml"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: traydaq-android-for-you-startup-validation
  cancel-in-progress: true
jobs:
  android:
    name: Native regressions and Android release runtime
    runs-on: ubuntu-latest
    timeout-minutes: 70
    env:
      CI: "1"
      EXPO_NO_TELEMETRY: "1"
    steps:
      - name: Verify read-only source access
        env:
          HAS_TOKEN: ${{ secrets.TRAYDAQ_V2_SOURCE_READ_TOKEN != '' }}
        run: test "$HAS_TOKEN" = true
      - name: Checkout exact private Android source
        uses: actions/checkout@v4
        with:
          repository: gideondreams3325/traydaq-v2
          ref: 90c7af2b
          path: private-src
          token: ${{ secrets.TRAYDAQ_V2_SOURCE_READ_TOKEN }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Validate all Android regressions, types and JavaScript export
        shell: bash
        working-directory: private-src/mobile
        run: |
          set -euo pipefail
          npm ci --no-audit --no-fund > "$RUNNER_TEMP/native-install.log" 2>&1 || { echo "::error::Android dependencies could not be installed"; exit 1; }
          if node --test tests/*.test.mjs > "$RUNNER_TEMP/native-tests.log" 2>&1; then
            echo "PASS: Native regressions"
          else
            echo "::error::Native tests failed; sanitized test names:"
            grep -E '^not ok [0-9]+ - ' "$RUNNER_TEMP/native-tests.log" | sed -E 's/^not ok [0-9]+ - /FAIL: /' | cut -c1-160 | head -25 || true
            grep -E '^# (tests|pass|fail) [0-9]+$' "$RUNNER_TEMP/native-tests.log" | tail -3 || true
            exit 1
          fi
          npx expo install --check > "$RUNNER_TEMP/expo-compat.log" 2>&1 || { echo "::error::Expo compatibility failed"; exit 1; }
          npx expo-doctor > "$RUNNER_TEMP/expo-doctor.log" 2>&1 || { echo "::error::Expo Doctor failed"; cat "$RUNNER_TEMP/expo-doctor.log"; exit 1; }
          npm run typecheck > "$RUNNER_TEMP/native-types.log" 2>&1 || { echo "::error::Native TypeScript failed"; grep -E 'error TS[0-9]+' "$RUNNER_TEMP/native-types.log" | cut -c1-160 | head -15 || true; exit 1; }
          npx expo export --platform android > "$RUNNER_TEMP/android-export.log" 2>&1 || { echo "::error::Android JS export failed"; exit 1; }
          echo "PASS: Native tests, types and Android export"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Compile candidate Android release with embedded Hermes bundle
        working-directory: private-src/mobile
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager "platforms;android-36" "build-tools;36.0.0" > "$RUNNER_TEMP/sdk.log" 2>&1
          npx expo prebuild --platform android --non-interactive > "$RUNNER_TEMP/prebuild.log" 2>&1
          cd android
          chmod +x gradlew
          ./gradlew --no-daemon :app:assembleRelease > "$RUNNER_TEMP/gradle.log" 2>&1 || { echo "::error::Candidate release compile failed"; exit 1; }
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Exercise real release APK on Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          working-directory: private-src/mobile
          script: python3 scripts/android-release-smoke.py
# Candidate release uses generated test signing only. No APK/source/log artifact is uploaded.

