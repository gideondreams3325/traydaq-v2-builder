name: TRAYDAQ Search Covers and Muted Video Previews - V2 Source QA
# No APK/AAB, app release, or deployment; validates private source.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/search-covers-inline-video-20261107.yml']
permissions:
  contents: read
jobs:
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    defaults:
      run: {working-directory: private-src}
    steps:
      - uses: actions/checkout@v4
        with:
          repository: gideondreams3325/traydaq-v2
          ref: fix/search-result-covers-muted-autoplay-20261107
          path: private-src
          token: ${{ secrets.TRAYDAQ_V2_SOURCE_READ_TOKEN }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: private-src/package-lock.json
      - name: Install private web dependencies
        run: npm ci --no-audit --no-fund > "$RUNNER_TEMP/web-install.log" 2>&1 || { echo 'Web install failed'; exit 1; }
      - name: Test covers, one preview and link navigation
        run: node --test tests/search-covers-inline-muted-preview.test.mjs
      - name: Full web tests
        run: |
          npm test > "$RUNNER_TEMP/web-tests.log" 2>&1 || {
            echo 'Web regression failed'
            grep -E '^not ok [0-9]+|^# (pass|fail|tests) [0-9]+' "$RUNNER_TEMP/web-tests.log" | tail -22 || true
            exit 1
          }
      - name: Web TypeScript and Cloudflare build
        run: |
          npm run typecheck > "$RUNNER_TEMP/web-tsc.log" 2>&1 || {
            echo 'Web TypeScript errors'
            grep -E 'error TS[0-9]+' "$RUNNER_TEMP/web-tsc.log" | cut -c1-190 | head -25 || true
            exit 1
          }
          npm run build > "$RUNNER_TEMP/web-build.log" 2>&1 && test -s dist/index.html || { echo 'Cloudflare build failed'; exit 1; }
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    defaults:
      run: {working-directory: private-src/mobile}
    steps:
      - uses: actions/checkout@v4
        with:
          repository: gideondreams3325/traydaq-v2
          ref: fix/search-result-covers-muted-autoplay-20261107
          path: private-src
          token: ${{ secrets.TRAYDAQ_V2_SOURCE_READ_TOKEN }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: private-src/mobile/package-lock.json
      - name: Install source dependencies
        run: npm ci --no-audit --no-fund > "$RUNNER_TEMP/android-install.log" 2>&1 || { echo 'Android source install failed'; exit 1; }
      - name: Test poster, silent preview and exact links
        run: node --test tests/search-covers-inline-muted-preview.test.mjs
      - name: Full Android source tests
        run: |
          node --test tests/*.test.mjs > "$RUNNER_TEMP/android-tests.log" 2>&1 || {
            echo 'Android source regression failed'
            grep -E '^not ok [0-9]+|^# (pass|fail|tests) [0-9]+' "$RUNNER_TEMP/android-tests.log" | tail -22 || true
            exit 1
          }
      - name: Android TypeScript without APK or AAB
        run: |
          npm run typecheck > "$RUNNER_TEMP/android-tsc.log" 2>&1 || {
            echo 'Android source TypeScript errors'
            grep -E 'error TS[0-9]+' "$RUNNER_TEMP/android-tsc.log" | cut -c1-190 | head -25 || true
            exit 1
          }
