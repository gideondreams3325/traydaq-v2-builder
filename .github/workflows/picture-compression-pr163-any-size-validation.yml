name: TRAYDAQ Pinned Marketplace Compact Cards QA (No APK)
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/picture-compression-pr163-any-size-validation.yml"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: traydaq-pr165-compression-validation
  cancel-in-progress: true
env:
  PRIVATE_SOURCE_SHA: 57ae8a635e32aaa0428527966d1c483d2478f86b
jobs:
  web:
    name: Private web tests TypeScript Cloudflare build
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Verify private read-only token
        env:
          TOKEN_CONFIGURED: ${{ secrets.TRAYDAQ_V2_SOURCE_READ_TOKEN != '' }}
        run: test "$TOKEN_CONFIGURED" = "true"
      - name: Checkout exact PR165 private source
        uses: actions/checkout@v4
        with:
          repository: gideondreams3325/traydaq-v2
          ref: ${{ env.PRIVATE_SOURCE_SHA }}
          token: ${{ secrets.TRAYDAQ_V2_SOURCE_READ_TOKEN }}
          path: private-src
          persist-credentials: false
          fetch-depth: 1
      - name: Verify exact source SHA
        run: test "$(git -C private-src rev-parse HEAD)" = "$PRIVATE_SOURCE_SHA"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: private-src/package-lock.json
      - name: Check web tests TypeScript and Cloudflare production bundle
        working-directory: private-src
        shell: bash
        run: |
          set -euo pipefail
          runcheck() {
            label="$1"; shift
            if "$@" > "$RUNNER_TEMP/check-$label.log" 2>&1; then
              echo "::notice::PASS $label"
            else
              echo "::error::FAIL $label (private logs are not exported)"
              grep -E '^not ok [0-9]+ - ' "$RUNNER_TEMP/check-$label.log" | cut -c1-145 | head -12 || true
              grep -E 'error TS[0-9]+' "$RUNNER_TEMP/check-$label.log" | sed -E 's@.*/@@' | cut -c1-140 | head -12 || true
              grep -E '^# (tests|pass|fail) [0-9]+$' "$RUNNER_TEMP/check-$label.log" | tail -3 || true
              exit 1
            fi
          }
          runcheck web-install npm ci --no-audit --no-fund
          runcheck web-types npm run typecheck
          runcheck picture-compression-tests node --test tests/picture-compression-all-uploads.test.mjs
          if npm test > "$RUNNER_TEMP/check-full-web-tests.log" 2>&1; then
            echo "::notice::PASS all private web regression tests"
          else
            echo "::warning::Full web suite still has baseline-only failures. Checking exact unchanged set."
            node --input-type=module - "$RUNNER_TEMP/check-full-web-tests.log" <<'NODE'
          import {readFileSync} from 'node:fs';
          const actual=[...readFileSync(process.argv[2],'utf8').matchAll(/^not ok \d+ - (.+)$/gm)]
            .map(m=>m[1]).sort();
          const expected=[
            'server owns identity and messages; no client can bypass block or impersonate sender',
            'chat privacy settings are served by a deployed Firebase-signed, authenticated function',
            'Android loader covers navigation while feed mounts and checks member privacy',
          ].sort();
          if(JSON.stringify(actual)!==JSON.stringify(expected)){
            console.error('Unexpected web regression failure names:',actual.map(x=>x.slice(0,100)));
            process.exit(1);
          }
          console.log('PASS: only 3 baseline web failures remain, no new regressions');
          NODE
          fi
          runcheck web-build npm run build
          test -f dist/index.html
          echo "::notice::PASS Cloudflare-targeted static assets produced (not deployed)"
  android:
    name: Private Android source tests TypeScript JS export (No APK)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      EXPO_NO_TELEMETRY: "1"
    steps:
      - name: Verify private read-only token
        env:
          TOKEN_CONFIGURED: ${{ secrets.TRAYDAQ_V2_SOURCE_READ_TOKEN != '' }}
        run: test "$TOKEN_CONFIGURED" = "true"
      - name: Checkout exact PR165 private source
        uses: actions/checkout@v4
        with:
          repository: gideondreams3325/traydaq-v2
          ref: ${{ env.PRIVATE_SOURCE_SHA }}
          token: ${{ secrets.TRAYDAQ_V2_SOURCE_READ_TOKEN }}
          path: private-src
          persist-credentials: false
          fetch-depth: 1
      - name: Verify exact source SHA
        run: test "$(git -C private-src rev-parse HEAD)" = "$PRIVATE_SOURCE_SHA"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check Android tests TypeScript and JavaScript bundle
        working-directory: private-src/mobile
        shell: bash
        run: |
          set -euo pipefail
          runcheck() {
            label="$1"; shift
            if "$@" > "$RUNNER_TEMP/check-$label.log" 2>&1; then
              echo "::notice::PASS $label"
            else
              echo "::error::FAIL $label (private logs are not exported)"
              grep -E '^not ok [0-9]+ - ' "$RUNNER_TEMP/check-$label.log" | cut -c1-145 | head -12 || true
              grep -E 'error TS[0-9]+' "$RUNNER_TEMP/check-$label.log" | sed -E 's@.*/@@' | cut -c1-140 | head -12 || true
              grep -E '^# (tests|pass|fail) [0-9]+$' "$RUNNER_TEMP/check-$label.log" | tail -3 || true
              node - "$RUNNER_TEMP/check-$label.log" <<'NATIVE_TEST_DIAG'
          const fs=require('fs');
          const a=fs.readFileSync(process.argv[2],'utf8').split(/\r?\n/);
          for(let i=0;i<a.length;i++){
            if(!/^not ok \d+ - /.test(a[i]))continue;
            const following=a.slice(i+1,i+40).join(' ');
            const file=(following.match(/\/tests\/([A-Za-z0-9_.-]+\.test\.mjs):\d+/)||[])[1];
            if(file)console.log('::notice::Failing native test file: '+file);
          }
          NATIVE_TEST_DIAG
              exit 1
            fi
          }
          runcheck native-install npm install --no-audit --no-fund
          runcheck native-types npm run typecheck
          runcheck native-tests bash -c 'node --test tests/*.test.mjs'
          runcheck native-js-export npx expo export --platform android
          echo "::notice::PASS Android JS export only - no Gradle APK or AAB"

  baseline-web:
    name: Baseline comparison - current private main web tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout private main for comparison
        uses: actions/checkout@v4
        with:
          repository: gideondreams3325/traydaq-v2
          ref: main
          token: ${{ secrets.TRAYDAQ_V2_SOURCE_READ_TOKEN }}
          path: baseline-src
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Compare baseline test failures without exposing source
        working-directory: baseline-src
        shell: bash
        run: |
          set -euo pipefail
          echo "::notice::Baseline private main SHA $(git rev-parse HEAD)"
          if ! npm ci --no-audit --no-fund > "$RUNNER_TEMP/baseline-install.log" 2>&1; then
            echo "::error::Baseline npm install failed"
            exit 1
          fi
          if npm test > "$RUNNER_TEMP/baseline-tests.log" 2>&1; then
            echo "::notice::PASS baseline complete web tests"
          else
            echo "::warning::Baseline main already has failed web tests"
            grep -E '^not ok [0-9]+ - ' "$RUNNER_TEMP/baseline-tests.log" | cut -c1-160 | head -20 || true
          fi
          grep -E '^# (tests|pass|fail) [0-9]+$' "$RUNNER_TEMP/baseline-tests.log" | tail -3 || true
