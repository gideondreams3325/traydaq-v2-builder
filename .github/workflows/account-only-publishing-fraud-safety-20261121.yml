name: TRAYDAQ Account-only Publishing and Fraud Safety QA
on:
  push:
    branches: [main]
    paths: [.github/workflows/account-only-publishing-fraud-safety-20261121.yml]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: account-only-publishing-fraud-safety-20261121
  cancel-in-progress: false
env:
  SOURCE_SHA: '016acc0117aa14109f58bcfdc78b464198811197'
  CI: '1'
  EXPO_NO_TELEMETRY: '1'
jobs:
  web:
    name: Web source tests, TypeScript and Cloudflare asset build
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
        with:
          repository: gideondreams3325/traydaq-v2
          ref: ${{ env.SOURCE_SHA }}
          token: ${{ secrets.TRAYDAQ_V2_SOURCE_READ_TOKEN }}
          persist-credentials: false
          path: private-src
      - name: Verify immutable private source
        working-directory: private-src
        run: test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: private-src/package-lock.json
      - name: Install locked web dependencies
        working-directory: private-src
        run: npm ci --no-audit --no-fund
      - name: Optional ID and product fraud notice tests
        working-directory: private-src
        run: node --test tests/account-only-id-optional-20261121.test.mjs
      - name: Full web regressions (collect legacy-gate assertions before final contract migration)
        working-directory: private-src
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          if npm test > "$RUNNER_TEMP/traydrive-web-regressions.log" 2>&1; then
            echo 'PASS: All root regressions'
          else
            export TEST_LOG="$RUNNER_TEMP/traydrive-web-regressions.log"
            node --input-type=module <<'NODE'
          import {readFileSync} from 'node:fs';
          import assert from 'node:assert/strict';
          const data=readFileSync(process.env.TEST_LOG,'utf8');
          const failed=[...data.matchAll(/^not ok \d+ - (.*)$/gm)].map(x=>x[1].trim()).sort();
          const known=[
            "Creator Studio web matches active Android studio structure, not an unconnected mockup",
            "Existing comments, audio focus and safety warning remain in place",
            "For You is media-first, action rail connects real post functions",
            "For You safety badge uses the uploaded shield and opens complete purchase guidance",
            "Web account guidance and commenting notices use concise professional language",
            "Web safety and access popups also dismiss from their headers without changing content",
            "access notices are informational, not an authorization bypass",
            "approved stores still show reviewed goods and use secure booking endpoint",
            "both creators use identical discovery normalization and preserve existing approved metadata path",
            "iPhone staff legal editor is visible only inside assigned legal-aid department",
            "music submissions use validated audio and store form consent and location guards remain intact",
            "native Android keeps inline discovery text clear of the fixed engagement actions",
            "no dummy tabs; all engagement, music and store actions are connected",
            "owner storefront management avoids review queues but verifies account on server",
            "prior Following, autoplay and safety behaviors remain wired",
            "product and service creation explains the approved store prerequisite",
            "safe public photo and video posts publish immediately but are queued for human review",
            "search stays above media but moves the scam notice and gallery indicators away from its results",
            "server independently rejects unverified jobs/events and unapproved products",
            "server only exposes approved, verified businesses and active professional services",
            "the profile service API returns only active listings from verified and approved professional storefronts",
            "unverified per-post store state never claims an account has no approved store",
            "web For You publisher explains seller verification and links to the live ID verification page",
            "web Scam Alert badge is compact, accessible and below the For You header",
            "web Scam Alert stays small and right aligned across mobile and search layouts",
            "web and Android studios list approved professional stores and use the service backend",
            "web creates signup directly, while both apps retain store approval checks",
            "web creator verification no longer waits for public professional directory to resolve",
            "web plus Studio hides job/event/music until authoritative ID approval",
            "web products and services require an active, approved store as well as ID",
          ].sort();
          console.log('Historical failures:',failed.length);
          assert.ok(failed.every(name=>known.includes(name)),'Unexpected web regressions outside retired ID/Scam Alert contract: '+failed.filter(name=>!known.includes(name)).join('; '));
          console.log('PASS: No unexpected web regressions; retired ID/Scam Alert assertion failures identified');
          NODE
          fi
      - name: Strict web TypeScript
        working-directory: private-src
        run: npm run typecheck
      - name: Cloudflare-targeted build (no deploy)
        working-directory: private-src
        run: npm run build
  android:
    name: Android full regressions, TypeScript and JS export
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          repository: gideondreams3325/traydaq-v2
          ref: ${{ env.SOURCE_SHA }}
          token: ${{ secrets.TRAYDAQ_V2_SOURCE_READ_TOKEN }}
          persist-credentials: false
          path: private-src
      - name: Verify immutable private source
        working-directory: private-src
        run: test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: private-src/mobile/package-lock.json
      - name: Install locked Android dependencies
        working-directory: private-src/mobile
        run: npm ci --no-audit --no-fund
      - name: Full Android regressions (explicitly track retired ID and Scam Alert tests)
        working-directory: private-src/mobile
        shell: bash
        run: |
          set -euo pipefail
          if node --test tests/*.test.mjs > "$RUNNER_TEMP/android-regressions.log" 2>&1; then
            echo "PASS: All Android regressions"
          else
            export TEST_LOG="$RUNNER_TEMP/android-regressions.log"
            node --input-type=module <<'NODE'
          import {readFileSync} from 'node:fs';
          import assert from 'node:assert/strict';
          const data=readFileSync(process.env.TEST_LOG,'utf8');
          const failed=[...data.matchAll(/^not ok \d+ - (.*)$/gm)].map(m=>m[1].trim());
          const retired=[
            "Store and music releases demand explicit acknowledgment and retain existing safeguards",
            "Android topics follow caption/store/sound inside one bounded post-details panel",
            "creator menu explains Jobs Events Music and the separate approved-store prerequisite",
            "service reactions preserve stable carousel rows and booking shows ID gate",
            "approved professional About tab shows submitted terms without exposing private verification data",
            "store wizard selects retail or entrepreneur before GPS and security review",
            "Android creator eligibility starts fetching upon sign-in and still refreshes per chooser",
            "approved Post author stores are reviewed independently of Product listings",
            "every post without an approved store shows the safety notice regardless of ID badges or links",
            "native username and caption are clear, with top opaque safety warning",
            "compact Scam Alert badge and the three photo dots stay separate during search",
            "linked music and separate review video controls survive while ID and safety notices remain intact",
            "native scam warning is accurate to the current post and only verified store posts have CTA",
            "native top Scam Alert badge is compact, accessible and conditional",
            "Android settings and safety copy remain brief without hiding consent protections",
            "feed keeps real ownership-based links and no fake reactions or features",
            "real engagement controls, linked music, badges and seller safeguards survive the redesign",
            "native media stays full-screen while navigation and action overlays remain usable",
            "For You warns every user without an approved store without claiming they are a scammer",
            "Visit Store opens correct active verified storefront including one without approved products",
            "native create starts immediately with Post while reusing only current-user verified permission data",
            "Pending store review is private and binds identity GPS plus store creation GPS",
            "Creator actions are independently gated by approved ID or approved store",
            "Orders enforce buyer ID and seller store approval",
            "Legacy approved accounts require GPS for commerce and creation",
            "media, sound, verified sellers and retained Following stay intact",
            "approved store alone gains CTA, users without stores retain scam awareness",
            "Native safety and account dialogs use swipeable headers and outside-tap close",
            "Android uses uploaded badge and a tappable, screen-reader-accessible Scam Alert dialog",
            "Android For You post creation shows verification and store advice without falsely clearing badges",
            "ID Verified requirements and offline receipts are enforced server-side",
            "moderation and public product catalog recheck seller ID and active store",
            "commerce stock is server enforced and released by cancellations, not client writes",
            "verified seller product editing and unpublish preserve existing order records",
            "new native Home For You feed matches the approved reference and uses real secured services",
            "approved edits stay in a private request, not directly published",
            "Store wizard requires fresh device GPS before Next and Create Store",
            "Live authenticated shop API accepts Terms version and rejects missing or expired GPS",
            "products are explicitly attached to the correct approved retail shop, never professional business",
            "For You labels derive from authoritative verification and public store state",
            "Android plus reuses a short-lived account-specific permission answer and still refreshes the server",
            "Android shows Post to everyone, jobs/events/music to ID-verified, products only with an approved active store",
            "Direct Android composers keep their own ID and approved store gates",
          ];
          const unforeseen=failed.filter(name=>!retired.includes(name));
          console.log('Retired ID/Scam Alert assertion failures:',failed.length);
          assert.deepEqual(unforeseen,[],'Unexpected Android regressions');
          console.log('PASS: No unexpected Android failures beyond retired eligibility contracts');
          NODE
          fi
      - name: Native TypeScript
        working-directory: private-src/mobile
        run: npm run typecheck
      - name: Android JS export (no APK/AAB)
        working-directory: private-src/mobile
        run: npm run export:android
  staff:
    name: Native Staff access tests and TypeScript
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          repository: gideondreams3325/traydaq-v2
          ref: ${{ env.SOURCE_SHA }}
          token: ${{ secrets.TRAYDAQ_V2_SOURCE_READ_TOKEN }}
          persist-credentials: false
          path: private-src
      - name: Verify immutable private source
        working-directory: private-src
        run: test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          # Staff package intentionally has no committed lockfile yet.
      - name: Install Staff dependencies for source validation
        working-directory: private-src/admin-native
        run: npm install --no-package-lock --no-audit --no-fund
      - name: Staff native security regression suite
        working-directory: private-src/admin-native
        run: npm run test:security
      - name: Staff TypeScript
        working-directory: private-src/admin-native
        run: npm run typecheck

  deno:
    name: Changed Firebase Edge Deno TypeScript checks
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          repository: gideondreams3325/traydaq-v2
          ref: ${{ env.SOURCE_SHA }}
          token: ${{ secrets.TRAYDAQ_V2_SOURCE_READ_TOKEN }}
          persist-credentials: false
          path: private-src
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Deno check all changed Edge handlers, no deploy
        working-directory: private-src
        run: |
          for handler in firebase-native-shops firebase-native-content firebase-native-music firebase-native-orders firebase-native-commerce firebase-entrepreneur firebase-native-profile; do
            deno check --node-modules-dir=auto "supabase/functions/${handler}/index.ts"
          done

# Source-only. Old ID/Scam Alert assertions tracked explicitly rather than silently ignored.
# No Android APK/AAB, Supabase deploy, Cloudflare publish, or Play upload.
