name: TRAYDAQ V2 User Web + Android Source Checks (No APK)
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/traydaq-user-parity-validation-request.txt"
permissions:
  contents: read
jobs:
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: private-src
    steps:
      - uses: actions/checkout@v4
        with:
          repository: gideondreams3325/traydaq-v2
          ref: main
          path: private-src
          token: ${{ secrets.TRAYDAQ_V2_SOURCE_READ_TOKEN }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install --no-audit --no-fund
      - name: Web regression tests
        run: npm test
      - name: Web TypeScript
        if: always()
        run: npm run typecheck
  native:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: private-src/mobile
    steps:
      - uses: actions/checkout@v4
        with:
          repository: gideondreams3325/traydaq-v2
          ref: main
          path: private-src
          token: ${{ secrets.TRAYDAQ_V2_SOURCE_READ_TOKEN }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install --no-audit --no-fund
      - name: Android appeal and support workflow tests
        run: node --test tests/member-appeals-parity.test.mjs tests/support-history-parity.test.mjs tests/creator-rights-parity.test.mjs
      - name: Native TypeScript
        if: always()
        run: npm run typecheck
# Strictly source-only: no Expo export, Gradle, APK, signing or deployment.
