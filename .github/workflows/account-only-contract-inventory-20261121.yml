name: TRAYDAQ retired account-only contract inventory (no build)
on:
  push:
    branches: [qa/retired-contract-inventory-20261121]
    paths: ['.github/workflows/account-only-contract-inventory-20261121.yml']
  workflow_dispatch:
permissions:
  contents: read
env:
  SOURCE_SHA: 'bcd6c853df0ae066caacf12945cfb46da777c1d7'
  CI: '1'
jobs:
  web:
    name: Inventory web legacy assertions
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          repository: gideondreams3325/traydaq-v2
          ref: ${{ env.SOURCE_SHA }}
          token: ${{ secrets.TRAYDAQ_V2_SOURCE_READ_TOKEN }}
          persist-credentials: false
          path: private-src
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install locked dependencies
        working-directory: private-src
        run: npm ci --no-audit --no-fund
      - name: Run full web suite and print exact assertion locations
        working-directory: private-src
        run: |
          node --test tests/*.test.mjs > regressions.tap 2>&1 || true
          node --input-type=module <<'NODE'
          import {readFileSync} from 'node:fs';
          const ls=readFileSync('regressions.tap','utf8').split(/\r?\n/);
          const failures=[];
          for(let i=0;i<ls.length;i++){
           if(!/^not ok \d+ - /.test(ls[i]))continue;
           const nearby=ls.slice(i,i+28);
           const loc=nearby.find(x=>x.includes('location:'))||'';
           const err=nearby.find(x=>x.trim().startsWith('error:'))||'';
           const stack=nearby.find(x=>x.includes('.test.mjs:'))||'';
           failures.push({name:ls[i].replace(/^not ok \d+ - /,''),loc:loc.trim(),error:err.trim(),stack:stack.trim()});
          }
          console.log('FAILURE INVENTORY '+JSON.stringify({total:failures.length,failures},null,2));
          NODE
  android:
    name: Inventory Android legacy assertions
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          repository: gideondreams3325/traydaq-v2
          ref: ${{ env.SOURCE_SHA }}
          token: ${{ secrets.TRAYDAQ_V2_SOURCE_READ_TOKEN }}
          persist-credentials: false
          path: private-src
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install locked dependencies
        working-directory: private-src/mobile
        run: npm ci --no-audit --no-fund
      - name: Run full Android suite and print exact assertion locations
        working-directory: private-src/mobile
        run: |
          node --test tests/*.test.mjs > regressions.tap 2>&1 || true
          node --input-type=module <<'NODE'
          import {readFileSync} from 'node:fs';
          const ls=readFileSync('regressions.tap','utf8').split(/\r?\n/);
          const failures=[];
          for(let i=0;i<ls.length;i++){
           if(!/^not ok \d+ - /.test(ls[i]))continue;
           const nearby=ls.slice(i,i+28);
           const loc=nearby.find(x=>x.includes('location:'))||'';
           const err=nearby.find(x=>x.trim().startsWith('error:'))||'';
           const stack=nearby.find(x=>x.includes('.test.mjs:'))||'';
           failures.push({name:ls[i].replace(/^not ok \d+ - /,''),loc:loc.trim(),error:err.trim(),stack:stack.trim()});
          }
          console.log('FAILURE INVENTORY '+JSON.stringify({total:failures.length,failures},null,2));
          NODE
# Diagnostic only. No APK/AAB, Cloudflare deploy or Supabase release.
