name: TRAYDAQ Post Tag Approval Backend Deno QA (no deploy)
on:
  push:
    branches: [main]
    paths: ['.github/workflows/android-post-tag-backend-deno-20261119.yml']
  workflow_dispatch:
permissions:
  contents: read
env:
  PRIVATE_SOURCE_SHA: a6aca93f9aa1e66113127961e7239767c2d7e548
  DENO_NODE_MODULES_DIR: auto
jobs:
  deno:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          repository: gideondreams3325/traydaq-v2
          ref: ${{ env.PRIVATE_SOURCE_SHA }}
          path: candidate
          token: ${{ secrets.TRAYDAQ_V2_SOURCE_READ_TOKEN }}
          persist-credentials: false
      - name: Verify exact backend candidate
        run: test "$(git -C candidate rev-parse HEAD)" = "$PRIVATE_SOURCE_SHA"
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Check new shared tagged-post notifier in isolation
        working-directory: candidate
        run: |
          deno check --node-modules-dir=auto supabase/functions/_shared/publishedPostTags.ts > "$RUNNER_TEMP/deno-tags.log" 2>&1 || { tail -70 "$RUNNER_TEMP/deno-tags.log"; exit 1; }
          echo 'PASS: published post tag notifier Deno check.'
# Existing large Edge Functions have baseline Deno full-tree typing errors; no production deployment.
