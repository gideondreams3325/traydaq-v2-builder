name: TRAYDAQ Animated Stickers After-Send Repair — User Source QA
on:
  push:
    branches: [main]
    paths: [.github/workflows/animated-stickers-after-send-20261123-qa.yml]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: traydaq-animated-stickers-after-send-20261123
  cancel-in-progress: false
env:
  SOURCE_REF: release/user-1063-65-sticker-motion-20261123
  CI: '1'
  EXPO_NO_TELEMETRY: '1'
jobs:
  web:
    name: Sticker playback regressions, web source and Cloudflare build
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
        with:
          repository: gideondreams3325/traydaq-v2
          ref: ${{ env.SOURCE_REF }}
          token: ${{ secrets.TRAYDAQ_V2_SOURCE_READ_TOKEN }}
          path: private-src
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: private-src/package-lock.json
      - name: Install locked dependencies
        working-directory: private-src
        run: npm ci --no-audit --no-fund
      - name: Regression checks for moving stickers after sending
        working-directory: private-src
        run: node --test tests/animated-stickers-after-send-20261123.test.mjs tests/native-android-animated-stickers-20261122.test.mjs tests/android-animated-stickers-web-view-20261122.test.mjs
      - name: Full app regressions
        working-directory: private-src
        shell: bash
        run: |
          if npm test > "$RUNNER_TEMP/stickers-full-tests.log" 2>&1; then
            echo 'All full app regression tests passed'
          else
            grep '^not ok ' "$RUNNER_TEMP/stickers-full-tests.log" | head -n 25 || true
            exit 1
          fi
      - name: User and Staff web TypeScript validation
        working-directory: private-src
        run: npm run typecheck && npm run typecheck:staff
      - name: Cloudflare user web production build, no deploy
        working-directory: private-src
        run: npm run build
  android:
    name: User Android source and native typing (no APK or AAB)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          repository: gideondreams3325/traydaq-v2
          ref: ${{ env.SOURCE_REF }}
          token: ${{ secrets.TRAYDAQ_V2_SOURCE_READ_TOKEN }}
          path: private-src
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: private-src/mobile/package-lock.json
      - name: Confirm next User release version and package isolation
        working-directory: private-src
        run: |
          node - <<'NODE'
          const a=require('./mobile/app.json').expo;
          if(a.version!=='1.0.63'||a.android.versionCode!==65||a.android.package!=='com.traydaq.app')
            throw Error('Unexpected TRAYDAQ User release identity');
          console.log('Validated user Android 1.0.63 (65) candidate');
          NODE
      - name: Install Android dependencies
        working-directory: private-src/mobile
        run: npm ci --no-audit --no-fund
      - name: Typecheck Android React Native
        working-directory: private-src/mobile
        run: npm run typecheck
      - name: Android source regression tests
        working-directory: private-src/mobile
        run: node --test tests/*.test.mjs
