name: TRAYDAQ Legal Aid - Private PDF and STAFF Source Validation Only
# Final validation after bulk staff appointment compatibility test update.
# Final source check includes Legal Aid staff appointment UI limits.
# Validate Edge SDK type alignment and signed staff case access.
on:
  push:
    branches: [main]
    paths: [".github/workflows/legal-aid-source-only.yml"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  user-source:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          repository: gideondreams3325/traydaq-v2
          ref: main
          path: private-src
          token: ${{ secrets.TRAYDAQ_V2_SOURCE_READ_TOKEN }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Generate synthetic colored PDF without member records
        working-directory: private-src
        shell: bash
        run: |
          if deno test --node-modules-dir=auto tests/legal-aid-synthetic-pdf.deno.test.ts > "$RUNNER_TEMP/legal-aid-sample.log" 2>&1; then
            echo "::notice::Synthetic PDF preview passed"
          else
            echo "::error::Synthetic PDF preview failed"
            tail -12 "$RUNNER_TEMP/legal-aid-sample.log" | sed -E 's/[^a-zA-Z0-9 ._:/-]//g' || true
            exit 1
          fi
      - name: Validate signed Legal Aid metadata Edge API
        working-directory: private-src
        shell: bash
        run: |
          if deno check --node-modules-dir=auto supabase/functions/firebase-legal-aid/index.ts > "$RUNNER_TEMP/legal-aid-edge.log" 2>&1; then
            echo "::notice::Legal Aid Edge TypeScript passed"
          else
            echo "::error::Legal Aid Edge TypeScript failed"
            grep -E '^error:|^error TS[0-9]+|TS[0-9]+' "$RUNNER_TEMP/legal-aid-edge.log" | head -12 | sed -E 's/\x1B\[[0-9;]*[[:alpha:]]//g; s#(file:///|/home/runner/work/)[^ :]+#private-source#g' || true
            echo "::notice::Diagnostics limited to type error descriptions; private source not uploaded"
            exit 1
          fi
      - name: Typecheck real owner-account private archive Edge service
        working-directory: private-src
        shell: bash
        run: |
          if deno check --node-modules-dir=auto supabase/functions/firebase-legal-aid-live-archive/index.ts > "$RUNNER_TEMP/legal-aid-live.log" 2>&1; then
            echo "::notice::Real owner archive Edge TypeScript passed"
          else
            echo "::error::Real owner archive Edge TypeScript failed"
            grep -E 'TS[0-9]+|error:' "$RUNNER_TEMP/legal-aid-live.log" | head -12 | sed -E 's/[^a-zA-Z0-9 ._:/-]//g' || true
            exit 1
          fi
      - name: Typecheck daily physical owner PDF expiry worker
        working-directory: private-src
        shell: bash
        run: |
          if deno check --node-modules-dir=auto supabase/functions/firebase-legal-aid-owner-expiry/index.ts > "$RUNNER_TEMP/legal-aid-owner-expiry.log" 2>&1; then
            echo "::notice::Owner-only expiry cleanup Edge TypeScript passed"
          else
            echo "::error::Owner-only expiry cleanup Edge TypeScript failed"
            grep -E 'TS[0-9]+|error:' "$RUNNER_TEMP/legal-aid-owner-expiry.log" | head -12 | sed -E 's/[^a-zA-Z0-9 ._:/-]//g' || true
            exit 1
          fi
      - name: Typecheck guarded account-erasure source interlock
        working-directory: private-src
        shell: bash
        run: |
          if deno check --node-modules-dir=auto supabase/functions/firebase-account-erasure/index.ts > "$RUNNER_TEMP/erasure-check.log" 2>&1; then
            echo "::notice::Account-erasure interlock TypeScript passed"
          else
            echo "::error::Account-erasure interlock typecheck failed"
            grep -E 'TS[0-9]+|error:' "$RUNNER_TEMP/erasure-check.log" | head -10 | sed -E 's/[^a-zA-Z0-9 ._:/-]//g' || true
            exit 1
          fi
      - name: Validate web, private Legal Aid engine and 30-day cooldown (no deploy)
        working-directory: private-src
        shell: bash
        run: |
          set -euo pipefail
          check() {
            local name="$1"; shift
            if "$@" > "$RUNNER_TEMP/$name.log" 2>&1; then
              echo "::notice::$name passed"
            else
              echo "::error::$name failed"
              grep -E '^not ok [0-9]+ - |error TS[0-9]+' "$RUNNER_TEMP/$name.log" | head -10 | sed -E 's/[^a-zA-Z0-9 ._:/-]//g' || true
              grep -E '^# (tests|pass|fail) [0-9]+$' "$RUNNER_TEMP/$name.log" | tail -3 || true
              exit 1
            fi
          }
          check web-install npm ci --no-audit --no-fund
          check legal-aid-tests node --test tests/legal-aid-evidence-pdf.test.mjs tests/account-reuse-cooldown.test.mjs
          check web-tests npm test
          check web-types npm run typecheck
          check web-assets npm run build
  standalone-staff:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          repository: gideondreams3325/traydaq-v2
          ref: feat/standalone-admin-native
          path: private-src
          token: ${{ secrets.TRAYDAQ_V2_SOURCE_READ_TOKEN }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate STAFF Legal Aid department and strict TypeScript (no Android build)
        working-directory: private-src/admin-native
        shell: bash
        run: |
          set -euo pipefail
          if ! npm run test:security > "$RUNNER_TEMP/staff-tests.log" 2>&1; then
            echo "::error::STAFF tests failed"
            grep -E '^not ok [0-9]+ - ' "$RUNNER_TEMP/staff-tests.log" | head -10 | sed -E 's/[^a-zA-Z0-9 ._:/-]//g' || true
            exit 1
          fi
          echo "::notice::STAFF tests passed"
          if ! npm install --no-audit --no-fund > "$RUNNER_TEMP/staff-install.log" 2>&1; then
            echo "::error::STAFF dependencies failed";exit 1
          fi
          if ! npm run typecheck > "$RUNNER_TEMP/staff-types.log" 2>&1; then
            echo "::error::STAFF TypeScript failed"
            grep -E 'error TS[0-9]+' "$RUNNER_TEMP/staff-types.log" | head -10 | sed -E 's/[^a-zA-Z0-9 ._:/-]//g' || true
            exit 1
          fi
          echo "::notice::STAFF TypeScript passed; no APK, AAB, prebuild, Gradle, signing or release"
