name: TRAYDAQ Staff Portal Private Source Build (No Deployment)
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/staff-portal-build-proof.yml"
  workflow_dispatch:
permissions:
  contents: read
env:
  STAFF_PORTAL_SOURCE_SHA: 07b19be877d0516e4d03e4f9033befaf6232dda5
jobs:
  staff-portal:
    name: Build and test restricted /staff portal without publishing
    if: github.repository == 'gideondreams3325/traydaq-v2-builder' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 24
    steps:
      - name: Checkout exact private source commit
        uses: actions/checkout@v4
        with:
          repository: gideondreams3325/traydaq-v2
          ref: ${{ env.STAFF_PORTAL_SOURCE_SHA }}
          path: private-src
          token: ${{ secrets.TRAYDAQ_V2_SOURCE_READ_TOKEN }}
          persist-credentials: false
      - name: Confirm source SHA
        working-directory: private-src
        run: test "$(git rev-parse HEAD)" = "$STAFF_PORTAL_SOURCE_SHA"
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install locked dependencies without lifecycle scripts
        working-directory: private-src
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Test staff route and all existing regression contracts
        working-directory: private-src
        run: npm test
      - name: Typecheck staff portal and regular app
        working-directory: private-src
        run: npm run typecheck
      - name: Produce the web bundle, without uploading it
        working-directory: private-src
        run: npm run build
      - name: Verify staff entry and built assets
        working-directory: private-src
        run: |
          test -s dist/index.html
          test -d dist/assets
          echo "PASS: restricted staff /staff route built; no deployment, database or Firebase writes."
