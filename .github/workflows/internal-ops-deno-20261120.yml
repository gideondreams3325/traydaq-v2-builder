name: TRAYDAQ Operations Deno diagnostics (source only)
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/internal-ops-deno-20261120.yml"
permissions:
  contents: read
jobs:
  deno:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          repository: gideondreams3325/traydaq-v2
          ref: 436f2e4705810058a32b0b93695041d02179150f
          path: private-src
          token: "${{ secrets.TRAYDAQ_V2_SOURCE_READ_TOKEN }}"
          persist-credentials: false
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.9.6
      - name: Check private Edge entries with the existing CI compiler flags
        working-directory: private-src
        run: |
          failed=0
          for name in firebase-admin-workspace firebase-staff-iphone firebase-native-content firebase-native-video-upload firebase-discussions; do
            log="$RUNNER_TEMP/ops-$name.log"
            if deno check --no-config --node-modules-dir=auto --no-lock "supabase/functions/$name/index.ts" > "$log" 2>&1; then
              echo "PASS: $name"
            else
              echo "::error::FAIL: $name"
              node --input-type=module - "$log" <<'NODE'
          import {readFileSync} from 'node:fs';
          const text=readFileSync(process.argv[2],'utf8').replace(/\x1b\[[0-9;]*m/g,'');
          const lines=text.split(/\r?\n/).filter(Boolean);
          const important=lines.filter(x=>/error|TS[0-9]+|failed|not found|module|at .*:/.test(x.toLowerCase()));
          const selected=important.length?important.slice(-8):lines.slice(-8);
          for(let line of selected){
            line=line.replace(/https?:\/\/\S+/g,'[url]').replace(/(?:file:\/\/)?\/home\/runner\/\S+/g,'[private-path]');
            line=line.replace(/(?:Bearer\s+\S+|sb_secret_[A-Za-z0-9_]+)/gi,'[redacted]');
            console.log(line.slice(0,155));
          }
          NODE
              failed=1
            fi
          done
          exit "$failed"
# No APK, AAB, deployment or database writes.
