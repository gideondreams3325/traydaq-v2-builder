name: TrayTrust internal signed publication validation
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [".github/workflows/validate-traytrust-internal-publication-20261126.yml"]
permissions:
  contents: read
  statuses: write
jobs:
  android-source:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CI: "1"
      EXPO_NO_TELEMETRY: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          repository: gideondreams3325/traydaq-v2
          ref: bb149e0cbc0f26f804917d8e762d312fe1bbee50
          path: private-src
          token: ${{ secrets.TRAYDAQ_V2_SOURCE_READ_TOKEN }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install dependencies
        id: install
        working-directory: private-src/mobile
        run: npm install --no-audit --no-fund > "$RUNNER_TEMP/install.log" 2>&1
      - name: Run source tests
        working-directory: private-src/mobile
        run: |
          set +e
          node --test tests/*.test.mjs > "$RUNNER_TEMP/tests.log" 2>&1
          rc=$?
          grep -E '^# (tests|pass|fail) [0-9]+$' "$RUNNER_TEMP/tests.log" | tail -3 || true
          if [ "$rc" != 0 ]; then
            node -e 'const fs=require("fs"),crypto=require("crypto");const hash=x=>crypto.createHash("sha256").update(x).digest("hex").slice(0,16);const data=fs.readFileSync(process.argv[1],"utf8");for(const block of data.split(/\n(?=not ok \d+ - )/).slice(1)){const name=block.match(/^not ok \d+ - (.*)/)?.[1]||"";const loc=block.match(/location:.*?\/tests\/([^:\x27]+):(\d+):(\d+)/);const stack=block.match(/\/tests\/([^:\s]+\.mjs):(\d+):(\d+)/);const file=loc||stack;console.log("Failed test identifier: "+hash(name)+" file="+(file?hash(file[1])+" line="+file[2]:"unknown")+" kind="+(block.match(/error:.*?\b(TypeError|ReferenceError|AssertionError|SyntaxError)\b/)?.[1]||"test failure"));}' "$RUNNER_TEMP/tests.log"
          fi
          exit "$rc"
      - name: TypeScript validation
        if: always() && steps.install.outcome == 'success'
        working-directory: private-src/mobile
        run: |
          set +e
          npm run typecheck > "$RUNNER_TEMP/typecheck.log" 2>&1
          rc=$?
          if [ "$rc" != 0 ]; then
            grep -E '^src/(lib/trayTrustProof|lib/trayTrustGate|lib/nativeE2eePilot|native-parity/e2ee/trayTrustProof|native-parity/e2ee/trayTrustGate|native-parity/e2ee/pilotSession)\.tsx\([0-9]+,[0-9]+\): error TS[0-9]+' "$RUNNER_TEMP/typecheck.log" | sed -E 's/(: error TS[0-9]+):.*/\1/' || true
            grep -oE 'error TS[0-9]+' "$RUNNER_TEMP/typecheck.log" | sort | uniq -c || true
          fi
          exit "$rc"
      - name: Publish sanitized status
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          JOB_RESULT: ${{ job.status }}
        run: |
          if [ "$JOB_RESULT" = success ]; then STATE=success; else STATE=failure; fi
          payload="$(jq -n --arg state "$STATE" '{state:$state,context:"traydaq-v2/traytrust-internal-android",description:"Source tests and TypeScript validation"}')"
          curl --fail --silent --show-error -X POST -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" -d "$payload" >/dev/null
  web-source:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CI: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          repository: gideondreams3325/traydaq-v2
          ref: bb149e0cbc0f26f804917d8e762d312fe1bbee50
          path: private-src
          token: ${{ secrets.TRAYDAQ_V2_SOURCE_READ_TOKEN }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install dependencies
        id: install
        working-directory: private-src
        run: npm ci --no-audit --no-fund > "$RUNNER_TEMP/install.log" 2>&1
      - name: Run source tests
        working-directory: private-src
        run: |
          set +e
          node --test tests/*.test.mjs > "$RUNNER_TEMP/tests.log" 2>&1
          rc=$?
          grep -E '^# (tests|pass|fail) [0-9]+$' "$RUNNER_TEMP/tests.log" | tail -3 || true
          if [ "$rc" != 0 ]; then
            node -e 'const fs=require("fs"),crypto=require("crypto");const hash=x=>crypto.createHash("sha256").update(x).digest("hex").slice(0,16);const data=fs.readFileSync(process.argv[1],"utf8");for(const block of data.split(/\n(?=not ok \d+ - )/).slice(1)){const name=block.match(/^not ok \d+ - (.*)/)?.[1]||"";const loc=block.match(/location:.*?\/tests\/([^:\x27]+):(\d+):(\d+)/);const stack=block.match(/\/tests\/([^:\s]+\.mjs):(\d+):(\d+)/);const file=loc||stack;console.log("Failed test identifier: "+hash(name)+" file="+(file?hash(file[1])+" line="+file[2]:"unknown")+" kind="+(block.match(/error:.*?\b(TypeError|ReferenceError|AssertionError|SyntaxError)\b/)?.[1]||"test failure"));}' "$RUNNER_TEMP/tests.log"
            node --input-type=module - "$RUNNER_TEMP/tests.log" <<'JS'
          import fs from 'node:fs';
          for(const b of fs.readFileSync(process.argv[2],'utf8').split(/\n(?=not ok \d+ - )/).slice(1)){
            if(!b.includes('traytrust-platform-directory-20261126.test.mjs'))continue;
            for(const l of b.split('\n')){
              if(/^\s*(code|name): ['"]?[A-Za-z0-9_]+['"]?\s*$/.test(l))console.log(l.trim());
              const m=l.match(/(?:traytrust-platform-directory-20261126\.test\.mjs|postgresDirectory\.mjs|witnessQualification\.mjs):(\d+):(\d+)/);
              if(m)console.log('Synthetic test location '+(l.includes('postgresDirectory.mjs')?'directory':l.includes('witnessQualification.mjs')?'witness':'test')+':'+m[1]+':'+m[2]);
              for(const term of ['TrayTrust directory unavailable','TrayTrust witness rejected update','TrayTrust proof rejected','malformed array literal','invalid input syntax','permission denied','not supported','does not exist','not a function','AssertionError','TypeError'])if(l.trim().startsWith('error:')&&l.includes(term))console.log('Error category: '+term);
            }
          }
          JS
          fi
          exit "$rc"
      - name: TypeScript validation
        if: always() && steps.install.outcome == 'success'
        working-directory: private-src
        run: |
          set +e
          npm run typecheck > "$RUNNER_TEMP/typecheck.log" 2>&1
          rc=$?
          if [ "$rc" != 0 ]; then
            grep -E '^src/(lib/trayTrustProof|lib/trayTrustGate|lib/nativeE2eePilot|native-parity/e2ee/trayTrustProof|native-parity/e2ee/trayTrustGate|native-parity/e2ee/pilotSession)\.tsx\([0-9]+,[0-9]+\): error TS[0-9]+' "$RUNNER_TEMP/typecheck.log" | sed -E 's/(: error TS[0-9]+):.*/\1/' || true
            grep -oE 'error TS[0-9]+' "$RUNNER_TEMP/typecheck.log" | sort | uniq -c || true
          fi
          exit "$rc"
      - name: Web bundle
        if: always() && steps.install.outcome == 'success'
        working-directory: private-src
        run: npm run build > "$RUNNER_TEMP/build.log" 2>&1
      - name: Publish sanitized status
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          JOB_RESULT: ${{ job.status }}
        run: |
          if [ "$JOB_RESULT" = success ]; then STATE=success; else STATE=failure; fi
          payload="$(jq -n --arg state "$STATE" '{state:$state,context:"traydaq-v2/traytrust-internal-web",description:"Source tests and TypeScript validation"}')"
          curl --fail --silent --show-error -X POST -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" -d "$payload" >/dev/null
  edge-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          repository: gideondreams3325/traydaq-v2
          ref: bb149e0cbc0f26f804917d8e762d312fe1bbee50
          path: private-src
          token: ${{ secrets.TRAYDAQ_V2_SOURCE_READ_TOKEN }}
          persist-credentials: false
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Check internal signing and database runtime
        working-directory: private-src
        run: |
          set +e
          deno check --no-lock --node-modules-dir=auto supabase/functions/_shared/trayTrustInternalRuntime.ts supabase/functions/traytrust-internal-bootstrap/index.ts > "$RUNNER_TEMP/traytrust-edge.log" 2>&1
          rc=$?
          if [ "$rc" != 0 ]; then
            grep -Ei 'error\[TS[0-9]+\]|TS[0-9]+ \[ERROR\]|at file:.*trayTrust|at file:.*traytrust-internal|error:|could not find|invalid value' "$RUNNER_TEMP/traytrust-edge.log" | sed -E 's|file:.*private-src/|file:private-src/|' | cut -c1-180 | head -30 || true
          fi
          exit "$rc"
