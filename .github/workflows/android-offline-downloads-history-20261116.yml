name: TRAYDAQ Android Offline Downloads History QA (No Release)
# This checks private Android source only. NEVER produce native binaries.
on:
  push:
    branches: [main]
    paths: ['.github/workflows/android-offline-downloads-history-20261116.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: android-offline-downloads-history
  cancel-in-progress: false
env:
  PRIVATE_SOURCE_SHA: cccf9837724fb333dc6227c0fdb917a75fa26778
  CI: '1'
  EXPO_NO_TELEMETRY: '1'
jobs:
  android:
    name: Complete Android tests, TypeScript, JS export; no APK or AAB
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - name: Verify read-only private-source connection
        env:
          HAS_TOKEN: ${{ secrets.TRAYDAQ_V2_SOURCE_READ_TOKEN != '' }}
        run: |
          test "$HAS_TOKEN" = true || { echo '::error::Read-only private source token missing'; exit 1; }
      - name: Checkout exact PR commit from private source
        uses: actions/checkout@v4
        with:
          repository: gideondreams3325/traydaq-v2
          ref: ${{ env.PRIVATE_SOURCE_SHA }}
          token: ${{ secrets.TRAYDAQ_V2_SOURCE_READ_TOKEN }}
          path: private-src
          persist-credentials: false
      - name: Verify immutable private commit
        working-directory: private-src
        run: test "$(git rev-parse HEAD)" = "$PRIVATE_SOURCE_SHA"
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: private-src/mobile/package-lock.json
      - name: Install pinned Android dependencies
        working-directory: private-src/mobile
        shell: bash
        run: |
          if npm ci --no-audit --no-fund > "$RUNNER_TEMP/install.log" 2>&1; then
            echo 'PASS: pinned Android dependencies'
          else
            echo '::error::Android dependency install failed'
            exit 1
          fi
      - name: Complete Android regression and feed crash-safety tests
        working-directory: private-src/mobile
        shell: bash
        run: |
          if node --test tests/*.test.mjs > "$RUNNER_TEMP/android-tests.log" 2>&1; then
            echo 'PASS: full Android regression suite'
            awk '/^# (tests|pass|fail|cancelled|skipped) [0-9]+$/ {print}' "$RUNNER_TEMP/android-tests.log"
          else
            echo '::error::Android regression failure. Test names only follow.'
            awk '/^not ok [0-9]+ - / {print; failing=1; next} failing && /^  location: / {sub(/^.*\/tests\//,"tests/"); print "  " $0; failing=0}' "$RUNNER_TEMP/android-tests.log"
            awk '/^# (tests|pass|fail|cancelled|skipped) [0-9]+$/ {print}' "$RUNNER_TEMP/android-tests.log"
            # Only the two fabricated public-data test cases may emit a short,
            # sanitized assertion reason. No private app source or credentials.
            awk '/^not ok [0-9]+ - (offline history stores|recovered public browsing previews)/ {show=1; next} show && /^  error:/ {getline; print "OFFLINE TEST REASON: " substr($0,1,160); show=0} show && /^  code:/ {print;show=0} /^not ok [0-9]+ - / && !/offline history stores|recovered public browsing previews/ {show=0}' "$RUNNER_TEMP/android-tests.log"
            exit 1
          fi
      - name: Android TypeScript check
        if: always()
        working-directory: private-src/mobile
        shell: bash
        run: |
          if npm run typecheck > "$RUNNER_TEMP/typecheck.log" 2>&1; then
            echo 'PASS: Android TypeScript'
          else
            echo '::error::Android TypeScript failed. Compiler codes and file basenames only.'
            grep -E 'error TS[0-9]+:' "$RUNNER_TEMP/typecheck.log" | sed -E 's|^(.*/)?([^/]+\.tsx?)(\([0-9]+,[0-9]+\))?: error (TS[0-9]+):.*$|\2\3 \4|' | head -15 || true
            exit 1
          fi
      - name: Android JavaScript export only
        if: always()
        working-directory: private-src/mobile
        shell: bash
        run: |
          if npm run export:android > "$RUNNER_TEMP/export.log" 2>&1; then
            echo 'PASS: Android JS and assets export (NO APK/AAB)'
          else
            echo '::error::Android JS export failed'
            exit 1
          fi
# No Gradle, Expo prebuild, APK, AAB, signing, Play, Cloudflare or staff release.
