name: Verify ImageMagick WASM

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/wasm-integrity.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  digest:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify ImageMagick 0.0.44 x86 WASM and actual PNG re-encoding
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/traydaq-magick
          cd /tmp/traydaq-magick
          npm init -y >/dev/null
          npm install --no-audit --no-fund @imagemagick/magick-wasm@0.0.44 pngjs@7
          wasm="./node_modules/@imagemagick/magick-wasm/dist/x86/magick.wasm"
          test -s "$wasm"
          test "$(head -c4 "$wasm" | od -An -tx1 | tr -d ' \n')" = "0061736d"
          echo "VERSION=0.0.44 X86_WASM_SHA256=$(sha256sum "$wasm" | cut -d' ' -f1)"
          echo "VERSION=0.0.44 X86_WASM_BYTES=$(stat -c %s "$wasm")"
          curl --fail --silent --show-error --location --connect-timeout 10 --max-time 70 \
            'https://cdn.jsdelivr.net/npm/@imagemagick/magick-wasm@0.0.44/dist/x86/magick.wasm' \
            -o /tmp/traydaq-cdn-magick.wasm
          cmp "$wasm" /tmp/traydaq-cdn-magick.wasm
          echo 'CDN_X86_WASM_VERIFIED=true'
          cat > test-converter.mjs <<'EOF'
          import {readFileSync} from 'node:fs';
          import { ImageMagick, initializeImageMagick, MagickFormat } from '@imagemagick/magick-wasm';
          const wasm=readFileSync('./node_modules/@imagemagick/magick-wasm/dist/x86/magick.wasm');
          await initializeImageMagick(wasm);
          const { PNG } = await import('pngjs');
          const fixture=new PNG({width:1,height:1});
          fixture.data.set([255,0,0,255]);
          const minimalPng=new Uint8Array(PNG.sync.write(fixture));
          let output;
          const result=ImageMagick.read(minimalPng,img=>{
            if(img.width!==1 || img.height!==1)throw Error('Unexpected PNG dimensions');
            return Uint8Array.from(img.write(MagickFormat.WebP,data=>data));
          });
          output = await Promise.resolve(result);
          const tag = (start) => String.fromCharCode(...output.subarray(start,start+4));
          if(tag(0)!=='RIFF'||tag(8)!=='WEBP'||output.length<20)throw Error('WebP encoding failed');
          console.log('TRAYDAQ_PNG_TO_WEBP_TEST_PASSED=true');
          console.log('TRAYDAQ_ENCODED_WEBP_BYTES='+output.length);
          EOF
          node test-converter.mjs

      - name: Smoke-test actual V2 Supabase Edge runtime with synthetic PNG
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location --connect-timeout 10 --max-time 55 \
            'https://qpcsruhwqhniprakpoox.supabase.co/functions/v1/traydaq-v2-image-health?check=ZFA838qH-bZWQtvP7sY3SecObyI_Yug6zV2-2Tgc-EM' \
            -o /tmp/traydaq-edge-health.json
          node -e "const f=require('fs');const x=JSON.parse(f.readFileSync('/tmp/traydaq-edge-health.json'));if(x.ok!==true)throw Error(JSON.stringify(x));console.log('TRAYDAQ_SUPABASE_EDGE_IMAGE_CONVERSION_TEST_PASSED=true');"
