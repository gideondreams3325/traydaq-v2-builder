name: TRAYDAQ V2 For You ID Verified Badge Visibility
# Validate the precise private feature commit. Never upload source, bundles or APKs.
on:
  push:
    branches: [main]
    paths: [".github/workflows/for-you-id-verified-visibility.yml"]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: traydaq-v2-for-you-id-verified-visibility
  cancel-in-progress: true
env:
  PRIVATE_SOURCE_SHA: 5dfdef1b3ac1ce039a261127e698ee010cee4976
jobs:
  web:
    name: Private web tests, TypeScript and Cloudflare bundle
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CI: "1"
    steps:
      - name: Verify read-only token is configured
        env:
          HAS_TOKEN: ${{ secrets.TRAYDAQ_V2_SOURCE_READ_TOKEN != '' }}
        run: test "$HAS_TOKEN" = true
      - name: Checkout exact private V2 source
        uses: actions/checkout@v4
        with:
          repository: gideondreams3325/traydaq-v2
          ref: ${{ env.PRIVATE_SOURCE_SHA }}
          path: private-src
          token: ${{ secrets.TRAYDAQ_V2_SOURCE_READ_TOKEN }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: private-src/package-lock.json
      - name: Run locked private web checks
        working-directory: private-src
        shell: bash
        run: |
          set -euo pipefail
          npm ci --no-audit --no-fund > "$RUNNER_TEMP/web-install.log" 2>&1 || { echo "::error::Private web install failed"; exit 1; }
          npm run check > "$RUNNER_TEMP/web-check.log" 2>&1 || { echo "::error::Private web TypeScript/tests/Cloudflare build failed"; exit 1; }
          echo "PASS: private web TypeScript, tests, and production bundle"
  android:
    name: Private native tests, TypeScript and Android JS bundle (no APK)
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      CI: "1"
      EXPO_NO_TELEMETRY: "1"
    steps:
      - name: Verify read-only token is configured
        env:
          HAS_TOKEN: ${{ secrets.TRAYDAQ_V2_SOURCE_READ_TOKEN != '' }}
        run: test "$HAS_TOKEN" = true
      - name: Checkout exact private V2 source
        uses: actions/checkout@v4
        with:
          repository: gideondreams3325/traydaq-v2
          ref: ${{ env.PRIVATE_SOURCE_SHA }}
          path: private-src
          token: ${{ secrets.TRAYDAQ_V2_SOURCE_READ_TOKEN }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Run private native checks and Android export
        working-directory: private-src/mobile
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-audit --no-fund > "$RUNNER_TEMP/native-install.log" 2>&1 || { echo "::error::Private native install failed"; exit 1; }
          if node --test tests/*.test.mjs > "$RUNNER_TEMP/native-tests.log" 2>&1; then
            echo "PASS: native regression tests"
          else
            echo "::error::Private native regression tests failed; sanitized failing test names follow"
            grep -E '^not ok [0-9]+ - ' "$RUNNER_TEMP/native-tests.log" | sed -E 's/^not ok [0-9]+ - /FAIL: /' | cut -c1-190 | head -25 || true
            node -e 'const fs=require("node:fs");const rows=fs.readFileSync(process.argv[1],"utf8").split(/\r?\n/);let bad=false;for(const row of rows){if(/^not ok [0-9]+ - /.test(row)){bad=true;continue;}if(bad&&row.includes("location:")){const m=row.match(/([A-Za-z0-9._-]+\.test\.mjs):[0-9]+/);if(m)console.log("FAIL FILE: "+m[1]);bad=false;}}' "$RUNNER_TEMP/native-tests.log" | sort -u
            grep -E '^# (tests|pass|fail) [0-9]+$' "$RUNNER_TEMP/native-tests.log" | tail -3 || true
            exit 1
          fi
          npm run typecheck > "$RUNNER_TEMP/native-typecheck.log" 2>&1 || { echo "::error::Private native TypeScript failed"; exit 1; }
          npx expo export --platform android > "$RUNNER_TEMP/native-export.log" 2>&1 || { echo "::error::Private Android JavaScript bundling failed"; exit 1; }
          echo "PASS: private native tests, TypeScript and Android bundle"
# No deployment, APK publishing, credentials, or private source artifacts.
