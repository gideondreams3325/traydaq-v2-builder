name: TRAYDAQ Android Animated Sticker Source QA

# Read-only validation of the private feature branch; does not build an APK,
# deploy Cloudflare, publish Supabase Edge Functions or release anything.
on:
  push:
    branches: [qa/android-animated-stickers-20261122]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: traydaq-animated-stickers-source-qa
  cancel-in-progress: true

jobs:
  sticker-source-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Verify read-only source token configured
        shell: bash
        env:
          SOURCE_TOKEN_CONFIGURED: ${{ secrets.TRAYDAQ_V2_SOURCE_READ_TOKEN != '' }}
        run: |
          if [ "$SOURCE_TOKEN_CONFIGURED" != "true" ]; then
            echo "::error::Private source access is not configured in the V2 Builder."
            exit 1
          fi
      - name: Check out only the private sticker feature branch
        uses: actions/checkout@v4
        with:
          repository: gideondreams3325/traydaq-v2
          ref: 1ab983e671f914a40a6edb81bad391faec8b9a79
          token: ${{ secrets.TRAYDAQ_V2_SOURCE_READ_TOKEN }}
          path: private-src
          persist-credentials: false
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies without lifecycle scripts
        working-directory: private-src
        run: npm install --ignore-scripts --no-audit --no-fund --loglevel=error
      - name: Run typecheck without printing private source
        working-directory: private-src
        shell: bash
        run: |
          if npm run typecheck > /tmp/traydaq-qa-typecheck.log 2>&1; then
            echo "TRAYDAQ sticker feature branch TypeScript: PASS"
          else
            echo "::error::TRAYDAQ sticker feature branch TypeScript: FAIL"
            grep -Eo 'error TS[0-9]+' /tmp/traydaq-qa-typecheck.log | sort | uniq -c || true
            exit 1
          fi
      - name: Run sticker and existing security tests without printing source
        working-directory: private-src
        shell: bash
        run: |
          if node --test --test-reporter=dot             tests/android-animated-stickers-web-view-20261122.test.mjs             tests/keyboard-stickers-web-public-security.test.mjs             > /tmp/traydaq-qa-stickers.log 2>&1; then
            echo "TRAYDAQ Android stickers and web view-only security: PASS"
          else
            echo "::error::TRAYDAQ Android stickers and web view-only security: FAIL"
            echo "Review locally using node --test tests/android-animated-stickers-web-view-20261122.test.mjs tests/keyboard-stickers-web-public-security.test.mjs"
            exit 1
          fi

      - name: Run full TRAYDAQ source regression suite
        working-directory: private-src
        shell: bash
        run: |
          if npm test > /tmp/traydaq-qa-full-tests.log 2>&1; then
            echo "TRAYDAQ full source regression suite: PASS"
          else
            echo "::error::TRAYDAQ full source regression suite: FAIL"
            echo "Failing test names:"
            grep -E '^not ok [0-9]+' /tmp/traydaq-qa-full-tests.log | sed -E 's/^not ok [0-9]+ - //g' | head -n 25 || true
            exit 1
          fi
      - name: Typecheck production React Native Android app (no APK)
        working-directory: private-src/mobile
        shell: bash
        run: |
          npm ci --ignore-scripts --no-audit --no-fund --loglevel=error > /tmp/traydaq-native-install.log 2>&1
          if npm run typecheck > /tmp/traydaq-native-typecheck.log 2>&1; then
            echo "TRAYDAQ native Android sticker source: TypeScript PASS"
          else
            echo "::error::TRAYDAQ native Android sticker source: TypeScript FAIL"
            grep -E 'error TS[0-9]+' /tmp/traydaq-native-typecheck.log | head -n 35 || true
            exit 1
          fi
      - name: Check production web asset compilation (no deployment)
        working-directory: private-src
        shell: bash
        run: |
          if npm run build > /tmp/traydaq-qa-build.log 2>&1; then
            echo "TRAYDAQ source build without publishing: PASS"
          else
            echo "::error::TRAYDAQ source build: FAIL"
            grep -Eo 'error TS[0-9]+' /tmp/traydaq-qa-build.log | sort | uniq -c || true
            exit 1
          fi
