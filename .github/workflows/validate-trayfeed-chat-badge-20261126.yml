name: Trayfeed unread chat badge Android source validation
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [".github/workflows/validate-trayfeed-chat-badge-20261126.yml"]
permissions:
  contents: read
  statuses: write
jobs:
  android-source:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CI: "1"
      EXPO_NO_TELEMETRY: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          repository: gideondreams3325/traydaq-v2
          ref: 236d1b6db1e2ca97976d4cfff4d72e86a72d8eb7
          path: private-src
          token: ${{ secrets.TRAYDAQ_V2_SOURCE_READ_TOKEN }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install dependencies
        working-directory: private-src/mobile
        run: npm install --no-audit --no-fund > "$RUNNER_TEMP/install.log" 2>&1
      - name: Run Android regression suite
        working-directory: private-src/mobile
        run: |
          set +e
          node --test tests/*.test.mjs > "$RUNNER_TEMP/tests.log" 2>&1
          rc=$?
          grep -E '^# (tests|pass|fail) [0-9]+$' "$RUNNER_TEMP/tests.log" | tail -3 || true
          exit "$rc"
      - name: TypeScript validation
        working-directory: private-src/mobile
        run: npm run typecheck > "$RUNNER_TEMP/typecheck.log" 2>&1
      - name: Publish sanitized status
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          JOB_RESULT: ${{ job.status }}
        run: |
          if [ "$JOB_RESULT" = success ]; then STATE=success; else STATE=failure; fi
          payload="$(jq -n --arg state "$STATE" '{state:$state,context:"traydaq-v2/trayfeed-chat-badge",description:"Android source tests and typecheck"}')"
          curl --fail --silent --show-error -X POST -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" -d "$payload" >/dev/null
