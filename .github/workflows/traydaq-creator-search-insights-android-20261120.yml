name: TRAYDAQ Android Creator + Store and Creator Search Insights QA
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/traydaq-creator-search-insights-android-20261120.yml
  workflow_dispatch:
permissions:
  contents: read
env:
  PRIVATE_SOURCE_SHA: '2f44f71512adede8a338fb46b02576ea0085f7bd'
  CI: '1'
  EXPO_NO_TELEMETRY: '1'
jobs:
  android:
    name: Android full unit and native export validation
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          repository: gideondreams3325/traydaq-v2
          ref: ${{ env.PRIVATE_SOURCE_SHA }}
          token: ${{ secrets.TRAYDAQ_V2_SOURCE_READ_TOKEN }}
          persist-credentials: false
          path: private-src
      - name: Verify checked-out exact private commit and changes
        working-directory: private-src
        run: |
          test "$(git rev-parse HEAD)" = "$PRIVATE_SOURCE_SHA"
          test -f mobile/src/new-design/CreatorSearchInsightsPanel.tsx
          test -f supabase/functions/firebase-creator-search-insights/index.ts
          test -f supabase/migrations/20261120180000_creator_search_insights_privacy.sql
          node --test mobile/tests/creator-search-insights-android-20261120.test.mjs
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: private-src/mobile/package-lock.json
      - name: Install locked Android dependencies
        working-directory: private-src/mobile
        run: npm ci --no-audit --no-fund
      - name: Complete Android regression suite
        working-directory: private-src/mobile
        run: node --test tests/*.test.mjs
      - name: Strict TypeScript
        working-directory: private-src/mobile
        run: npm run typecheck
      - name: Validate native export without building APK
        working-directory: private-src/mobile
        run: npm run export:android
  edge:
    name: Search Insights Deno service typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          repository: gideondreams3325/traydaq-v2
          ref: ${{ env.PRIVATE_SOURCE_SHA }}
          token: ${{ secrets.TRAYDAQ_V2_SOURCE_READ_TOKEN }}
          persist-credentials: false
          path: private-src
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Validate new service and Firebase access policy imports
        working-directory: private-src
        run: deno check --node-modules-dir=auto supabase/functions/firebase-creator-search-insights/index.ts
# Source validation only. Never signs packages, releases APK or deploys a function.
