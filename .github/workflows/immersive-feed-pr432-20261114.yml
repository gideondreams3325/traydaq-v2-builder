name: TRAYDAQ Immersive Feed PR432 Web Android Validation (No APK/AAB)
on:
  push:
    branches: [main]
    paths: ['.github/workflows/immersive-feed-pr432-20261114.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: traydaq-immersive-feed-pr432
  cancel-in-progress: true
env:
  PRIVATE_SOURCE_SHA: 0ba845fef73402725a4dfa0ca9ca5d1a8dde9548
  CI: '1'
  EXPO_NO_TELEMETRY: '1'
jobs:
  web:
    name: Web regression, typecheck and Cloudflare-targeted build
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Require read-only source access
        env:
          HAS_TOKEN: ${{ secrets.TRAYDAQ_V2_SOURCE_READ_TOKEN != '' }}
        run: test "$HAS_TOKEN" = true
      - uses: actions/checkout@v4
        with:
          repository: gideondreams3325/traydaq-v2
          ref: ${{ env.PRIVATE_SOURCE_SHA }}
          token: ${{ secrets.TRAYDAQ_V2_SOURCE_READ_TOKEN }}
          path: private-src
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: private-src/package-lock.json
      - name: Pin private source SHA
        working-directory: private-src
        run: test "$(git rev-parse HEAD)" = "$PRIVATE_SOURCE_SHA"
      - name: Install pinned dependencies
        working-directory: private-src
        run: npm ci --no-audit --no-fund
      - name: Immersive feed regression
        working-directory: private-src
        run: node --test tests/immersive-feed-pro-20261114.test.mjs tests/following-stable-session-20261114.test.mjs tests/for-you-responsive-overlays-20261114.test.mjs
      - name: Complete web test suite
        working-directory: private-src
        run: npm test
      - name: Web TypeScript
        working-directory: private-src
        run: npm run typecheck
      - name: Web Cloudflare-targeted production bundle only
        working-directory: private-src
        run: npm run build
  android:
    name: Android JS regression and TypeScript (no binary)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Require read-only source access
        env:
          HAS_TOKEN: ${{ secrets.TRAYDAQ_V2_SOURCE_READ_TOKEN != '' }}
        run: test "$HAS_TOKEN" = true
      - uses: actions/checkout@v4
        with:
          repository: gideondreams3325/traydaq-v2
          ref: ${{ env.PRIVATE_SOURCE_SHA }}
          token: ${{ secrets.TRAYDAQ_V2_SOURCE_READ_TOKEN }}
          path: private-src
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: private-src/mobile/package-lock.json
      - name: Pin private source SHA
        working-directory: private-src
        run: test "$(git rev-parse HEAD)" = "$PRIVATE_SOURCE_SHA"
      - name: Install pinned dependencies
        working-directory: private-src/mobile
        run: npm ci --no-audit --no-fund
      - name: Android immersive feed and Following regression
        working-directory: private-src/mobile
        run: node --test tests/immersive-feed-pro-20261114.test.mjs tests/following-feed-android-web-20261113.test.mjs tests/for-you-bottom-discovery-dock-20261114.test.mjs
      - name: Complete Android source test suite
        working-directory: private-src/mobile
        run: node --test tests/*.test.mjs
      - name: Android TypeScript
        working-directory: private-src/mobile
        run: npm run typecheck
# Read-only validation. Does NOT create APK, AAB, sign, upload, deploy or release an app.
