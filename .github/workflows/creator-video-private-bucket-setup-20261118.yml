name: TRAYDAQ Private 6 MiB Video Chunk Bucket Gate (No App Deploy)
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/creator-video-private-bucket-setup-20261118.yml"
      - ".github/scripts/creator-video-private-bucket-setup-20261118.mjs"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: traydaq-private-original-video-bucket-setup
  cancel-in-progress: false
jobs:
  isolated-private-bucket:
    name: Verify or create exact private binary 6MiB video chunk bucket
    if: github.repository == 'gideondreams3325/traydaq-v2-builder' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          path: builder-control
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: gideondreams3325/traydaq-v2
          ref: 55ce0756c247a048e9e947cbec0b36456494b235
          path: private-src
          token: ${{ secrets.TRAYDAQ_V2_SOURCE_READ_TOKEN }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: private-src/package-lock.json
      - name: Read-only source lock verification
        shell: bash
        run: |
          test "$(git -C private-src rev-parse HEAD)" = "55ce0756c247a048e9e947cbec0b36456494b235"
          node --check builder-control/.github/scripts/creator-video-private-bucket-setup-20261118.mjs
      - name: Install pinned server-only Supabase SDK
        working-directory: private-src
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Create isolated 6 MiB chunk bucket without raising global limits
        env:
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: node builder-control/.github/scripts/creator-video-private-bucket-setup-20261118.mjs
# No changes to pending/public creator buckets, existing media, auth, project
# global file size, database rows, site deployment or mobile builds.
