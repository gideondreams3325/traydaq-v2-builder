name: TRAYDAQ V2 Release Audit Source Validation (No APK)
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/traydaq-release-audit-validation.json']
permissions:
  contents: read
env:
  TRAYDAQ_AUDIT_SOURCE_SHA: 0fd5b59cbc5cc7f885106861c2e462a40acb6c6e
jobs:
  source:
    name: ${{ matrix.target }} source checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        target: [web, android, edge, firebase]
    steps:
      - uses: actions/checkout@v4
        with:
          repository: gideondreams3325/traydaq-v2
          ref: ${{ env.TRAYDAQ_AUDIT_SOURCE_SHA }}
          token: ${{ secrets.TRAYDAQ_V2_SOURCE_READ_TOKEN }}
          path: private-src
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        if: matrix.target == 'firebase'
        with:
          distribution: temurin
          java-version: '21'
      - name: Validate user web source
        if: matrix.target == 'web'
        working-directory: private-src
        run: |
          npm install --no-audit --no-fund
          npm run typecheck
          npm test
          npm run build
      - name: Validate Android source without building a binary
        if: matrix.target == 'android'
        working-directory: private-src/mobile
        run: |
          npm install --no-audit --no-fund
          npm run typecheck
          node --test tests/*.test.mjs
      - name: Validate Firebase RTDB blocks and messaging authorization (emulator only)
        if: matrix.target == 'firebase'
        working-directory: private-src/firebase
        run: |
          npm install --no-audit --no-fund
          npm run test:rules
      - name: Validate Firebase-authenticated Edge Functions
        if: matrix.target == 'edge'
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/traydaq-release-audit-edge"
          cp -R private-src/supabase/functions/. "$RUNNER_TEMP/traydaq-release-audit-edge/"
          npx --yes deno@2.9.6 check --no-config --node-modules-dir=auto --no-lock \
            "$RUNNER_TEMP/traydaq-release-audit-edge/firebase-session/index.ts" \
            "$RUNNER_TEMP/traydaq-release-audit-edge/firebase-member-eligibility/index.ts" \
            "$RUNNER_TEMP/traydaq-release-audit-edge/firebase-auth-resend/index.ts" \
            "$RUNNER_TEMP/traydaq-release-audit-edge/firebase-copyright/index.ts" \
            "$RUNNER_TEMP/traydaq-release-audit-edge/firebase-deletion-requests/index.ts" \
            "$RUNNER_TEMP/traydaq-release-audit-edge/firebase-discussions/index.ts" \
            "$RUNNER_TEMP/traydaq-release-audit-edge/firebase-entrepreneur/index.ts" \
            "$RUNNER_TEMP/traydaq-release-audit-edge/firebase-identity-review/index.ts" \
            "$RUNNER_TEMP/traydaq-release-audit-edge/firebase-member-activity/index.ts" \
            "$RUNNER_TEMP/traydaq-release-audit-edge/firebase-member-appeals/index.ts" \
            "$RUNNER_TEMP/traydaq-release-audit-edge/firebase-member-growth/index.ts" \
            "$RUNNER_TEMP/traydaq-release-audit-edge/firebase-native-commerce/index.ts" \
            "$RUNNER_TEMP/traydaq-release-audit-edge/firebase-native-content/index.ts" \
            "$RUNNER_TEMP/traydaq-release-audit-edge/firebase-native-music/index.ts" \
            "$RUNNER_TEMP/traydaq-release-audit-edge/firebase-native-orders/index.ts" \
            "$RUNNER_TEMP/traydaq-release-audit-edge/firebase-native-profile/index.ts" \
            "$RUNNER_TEMP/traydaq-release-audit-edge/firebase-native-push-register/index.ts" \
            "$RUNNER_TEMP/traydaq-release-audit-edge/firebase-native-shops/index.ts" \
            "$RUNNER_TEMP/traydaq-release-audit-edge/firebase-security-broadcast/index.ts" \
            "$RUNNER_TEMP/traydaq-release-audit-edge/firebase-store-reviews/index.ts" \
            "$RUNNER_TEMP/traydaq-release-audit-edge/firebase-support-report/index.ts" \
            "$RUNNER_TEMP/traydaq-release-audit-edge/firebase-account-erasure/index.ts" \
            "$RUNNER_TEMP/traydaq-release-audit-edge/traydaq-cloudinary-upload/index.ts" \
            "$RUNNER_TEMP/traydaq-release-audit-edge/submit-album-picture/index.ts" \
            "$GITHUB_WORKSPACE/private-src/supabase/verification/cloudinary_fixture.ts"
# Source validation only. No deployment, Expo export, APK/AAB, STAFF checkout or signing.
