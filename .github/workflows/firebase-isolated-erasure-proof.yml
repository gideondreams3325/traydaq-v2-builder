name: TRAYDAQ Isolated Firebase Account Erasure Proof (No Deployment)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/firebase-isolated-erasure-proof.yml"

permissions:
  contents: read
  statuses: write

# Production service credentials are ONLY passed to this trusted main workflow.
# The private candidate is locked to a single reviewed commit and cannot select
# or delete an existing account; it creates one random disabled test identity.
env:
  ERASURE_FIXTURE_SHA: 8fc8997ffb5d20f3fbc72ce560249f3dd2d2d48a

jobs:
  firebase-disposable-identity:
    name: Create, delete, and read back one disabled Firebase test identity
    if: github.repository == 'gideondreams3325/traydaq-v2-builder' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout immutable private Firebase fixture implementation
        uses: actions/checkout@v4
        with:
          repository: gideondreams3325/traydaq-v2
          ref: ${{ env.ERASURE_FIXTURE_SHA }}
          path: private-src
          token: ${{ secrets.TRAYDAQ_V2_SOURCE_READ_TOKEN }}
          persist-credentials: false
      - name: Verify immutable candidate
        working-directory: private-src
        run: test "$(git rev-parse HEAD)" = "$ERASURE_FIXTURE_SHA"
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check Firebase credential availability without exposing secret
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON || secrets.FIREBASE_SERVICE_ACCOUNT || secrets.FIREBASE_ADMIN_SDK_JSON || secrets.FIREBASE_ADMIN_JSON || secrets.GOOGLE_SERVICE_ACCOUNT_JSON || secrets.GOOGLE_CLOUD_SERVICE_ACCOUNT_JSON || secrets.TRAYDAQ_FIREBASE_SERVICE_ACCOUNT_JSON }}
          FIREBASE_RTD_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_RTD_SERVICE_ACCOUNT_JSON }}
        shell: bash
        run: |
          if [ -z "${FIREBASE_SERVICE_ACCOUNT_JSON}" ] && [ -z "${FIREBASE_RTD_SERVICE_ACCOUNT_JSON}" ]; then
            echo "::error::No supported Firebase Admin JSON credential is available as a GitHub Actions secret in the V2 Builder repository. Only disabled test data would be modified if configured."
            exit 1
          fi
          echo "Firebase credential configured; content not printed."
      - name: Verify fixed fixture script syntax
        working-directory: private-src
        run: node --check tests/firebase-erasure-live-ci-fixture.mjs
      - name: Prove disabled Firebase Auth and isolated RTDB erasure with readback
        id: firebase_proof
        working-directory: private-src
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON || secrets.FIREBASE_SERVICE_ACCOUNT || secrets.FIREBASE_ADMIN_SDK_JSON || secrets.FIREBASE_ADMIN_JSON || secrets.GOOGLE_SERVICE_ACCOUNT_JSON || secrets.GOOGLE_CLOUD_SERVICE_ACCOUNT_JSON || secrets.TRAYDAQ_FIREBASE_SERVICE_ACCOUNT_JSON }}
          FIREBASE_RTD_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_RTD_SERVICE_ACCOUNT_JSON }}
        run: node tests/firebase-erasure-live-ci-fixture.mjs

      - name: Publish safe CI outcome as commit status
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          PROOF_OUTCOME: ${{ steps.firebase_proof.outcome }}
        shell: bash
        run: |
          if [ "$PROOF_OUTCOME" = "success" ]; then
            RESULT="success"
            DESCRIPTION="PASS: isolated disabled Auth and RTDB fixture erased and verified"
          else
            RESULT="failure"
            DESCRIPTION="NOT VERIFIED: Firebase isolated test unavailable or failed"
          fi
          gh api -X POST "repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" \
            -f state="$RESULT" \
            -f context="traydaq/firebase-isolated-proof" \
            -f description="$DESCRIPTION" \
            -f target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"

# No Supabase migration, no user-selected UID, no app deployment, no broad delete.
# Safe to retry: each run creates and destroys its own disabled Firebase test identity.
