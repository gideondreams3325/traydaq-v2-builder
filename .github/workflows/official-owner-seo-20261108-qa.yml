name: TRAYDAQ Official Owner SEO Source Validation
# Read-only private-source verification. Never deploy, publish or build APK/AAB.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/official-owner-seo-20261108-qa.yml
permissions:
  contents: read
jobs:
  owner-seo:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: private-src
    steps:
      - name: Check out private TRAYDAQ V2 owner SEO branch
        uses: actions/checkout@v4
        with:
          repository: gideondreams3325/traydaq-v2
          ref: feat/owner-portrait-public-20261109
          path: private-src
          token: ${{ secrets.TRAYDAQ_V2_SOURCE_READ_TOKEN }}
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: private-src/package-lock.json
      - name: Verify public ownership metadata and Cloudflare sitemap contracts
        run: node --test tests/google-discovery-seo.test.mjs tests/google-sitemap-build.test.mjs tests/google-public-indexing.test.mjs
      - name: Install dependencies for web-only validation
        run: npm ci --no-audit --no-fund
      - name: Run full web source tests
        run: npm test
      - name: Check web TypeScript
        run: npm run typecheck
      - name: Build Cloudflare site with SEO output validation (no Android builds)
        run: npm run build
