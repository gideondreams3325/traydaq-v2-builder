name: TRAYDAQ Android For You Subnavigation — Source QA
# Android tests and TypeScript only. No APK/AAB, release or deployment.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/android-for-you-navigation-source-qa.yml"
permissions:
  contents: read
jobs:
  android:
    name: Validate native For You routing and TypeScript (source-only)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: private-src/mobile
    steps:
      - uses: actions/checkout@v4
        with:
          repository: gideondreams3325/traydaq-v2
          ref: fix/android-hide-tab-bar-from-for-you-20261104
          path: private-src
          token: ${{ secrets.TRAYDAQ_V2_SOURCE_READ_TOKEN }}
          persist-credentials: false
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: node --test tests/*.test.mjs
      - if: always()
        run: npm run typecheck
