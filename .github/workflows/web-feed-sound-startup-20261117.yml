name: TRAYDAQ Web For You Following Startup Sound QA (No Release)
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/web-feed-sound-startup-20261117.yml"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: traydaq-web-feed-sound-startup-20261117
  cancel-in-progress: false
env:
  PRIVATE_SOURCE_SHA: 2a7f0d47865632a2cc05d691bbe81cb448b75d9f
  CI: "1"
jobs:
  web:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout same pinned private candidate
        uses: actions/checkout@v4
        with:
          repository: gideondreams3325/traydaq-v2
          ref: ${{ env.PRIVATE_SOURCE_SHA }}
          token: ${{ secrets.TRAYDAQ_V2_SOURCE_READ_TOKEN }}
          path: private-src
          persist-credentials: false
      - name: Verify immutable source SHA
        working-directory: private-src
        run: test "$(git rev-parse HEAD)" = "$PRIVATE_SOURCE_SHA"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: private-src/package-lock.json
      - name: Install web dependencies
        working-directory: private-src
        run: npm ci --no-audit --no-fund
      - name: Verify web regressions remain intact
        working-directory: private-src
        run: npm test
      - name: Validate web TypeScript
        working-directory: private-src
        run: npm run typecheck
      - name: Cloudflare-targeted web asset build, no deployment
        working-directory: private-src
        run: npm run build
# Read-only V2 Builder validation. Web only; no production deployment, AAB or APK.
