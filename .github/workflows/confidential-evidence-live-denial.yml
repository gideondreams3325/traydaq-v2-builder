name: TRAYDAQ Confidential Evidence Live Denial Smoke (No Writes)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/confidential-evidence-live-denial.yml"
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/confidential-evidence-live-denial.yml"

permissions:
  contents: read

# Calls the existing production Edge URL ONLY without credentials or a staff token.
# No private member IDs, real files, download grants, database writes, or secrets.
jobs:
  unauthorized-denial:
    name: Verify live Edge rejects unauthenticated evidence access
    if: github.repository == 'gideondreams3325/traydaq-v2-builder'
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify non-mutating live denial responses
        env:
          EDGE_URL: https://qpcsruhwqhniprakpoox.supabase.co/functions/v1/confidential-case-evidence
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          const url=process.env.EDGE_URL;
          assert.match(url,/^https:\/\/[^/]+\.supabase\.co\/functions\/v1\/confidential-case-evidence$/);
          const request=async(method,authorization)=>{
            const headers={'Content-Type':'application/json'};
            if(authorization)headers.Authorization=authorization;
            // Never use actual user IDs or credentials. Auth rejects before payload/RPC.
            const resp=await fetch(url,{
              method,headers,
              ...(method==='POST'?{body:JSON.stringify({
                action:'download',
                caseId:'11111111-1111-4111-8111-111111111111',
                evidenceId:'22222222-2222-4222-8222-222222222222',
                reason:'SYNTHETIC_CI_DENY'
              })}:{}),
              signal:AbortSignal.timeout(12000),
              redirect:'error'
            });
            const body=await resp.text();
            assert.ok(body.length<2048,'Unexpected oversized response');
            assert.equal(resp.headers.get('cache-control'),'no-store');
            assert.equal(resp.headers.get('x-content-type-options'),'nosniff');
            assert.equal(resp.headers.get('content-type')?.split(';')[0],'application/json');
            return {status:resp.status,body};
          };
          const wrongMethod=await request('GET');
          assert.equal(wrongMethod.status,405,'GET must not expose case evidence');
          const missing=await request('POST');
          assert.equal(missing.status,403,'Missing bearer must fail closed');
          const invalid=await request('POST','Bearer '+ 'A'.repeat(96));
          assert.equal(invalid.status,401,'Unverified bearer must fail closed');
          for(const outcome of [wrongMethod,missing,invalid]){
            assert.doesNotMatch(outcome.body,/custodyVerified|caseReference|contentSha256|sourceBucket|object_path|verified_email|review_owner_uid/i);
          }
          console.log('PASS: real hosted Edge returns 405/403/401; never accessed private files or audit writes.');
          NODE
