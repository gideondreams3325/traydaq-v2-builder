name: TRAYDAQ Legal Aid - Department Staff Source Validation
on:
  pull_request:
    branches: [main]
    paths: [".github/workflows/account-erasure-pr103-source-only.yml"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  main-web-legal-aid:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Fetch pinned Legal Aid UI PR 105
        uses: actions/checkout@v4
        with:
          repository: gideondreams3325/traydaq-v2
          ref: cd8f7d42de378e5abcf0e6f8caf2fd4134dae1cb
          path: private-src
          token: ${{ secrets.TRAYDAQ_V2_SOURCE_READ_TOKEN }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify immutable UI source and run privacy tests
        working-directory: private-src
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "cd8f7d42de378e5abcf0e6f8caf2fd4134dae1cb"
          node --test tests/legal-aid-live-owner-vault.test.mjs tests/legal-aid-case-access.test.mjs tests/legal-aid-verified-custody.test.mjs tests/identity-fraud-consent-age-policy.test.mjs
      - name: Typecheck web Security Hub (no deploy)
        working-directory: private-src
        shell: bash
        run: |
          set -euo pipefail
          npm ci --no-audit --no-fund > "$RUNNER_TEMP/legal-aid-web-install.log" 2>&1
          npm run typecheck > "$RUNNER_TEMP/legal-aid-web-typecheck.log" 2>&1 || {
            grep -E 'error TS[0-9]+' "$RUNNER_TEMP/legal-aid-web-typecheck.log" | head -12 || true
            exit 1
          }
          echo "::notice::Legal Aid web UI and TS tests passed, without deployment"
  standalone-staff-legal-aid:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Fetch pinned STAFF Legal Aid PR 106
        uses: actions/checkout@v4
        with:
          repository: gideondreams3325/traydaq-v2
          ref: 1353a0a3dc446eb48ddebb9e2526cfb2d031107d
          path: private-src
          token: ${{ secrets.TRAYDAQ_V2_SOURCE_READ_TOKEN }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify immutable STAFF source and run security tests
        working-directory: private-src/admin-native
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C .. rev-parse HEAD)" = "1353a0a3dc446eb48ddebb9e2526cfb2d031107d"
          node --test tests/legal-aid-readiness.test.mjs
          npm install --no-audit --no-fund > "$RUNNER_TEMP/legal-aid-staff-install.log" 2>&1 || {
            echo "::error::STAFF dependency installation failed"
            grep -E 'npm error|npm ERR' "$RUNNER_TEMP/legal-aid-staff-install.log" | head -10 || true
            exit 1
          }
          npm run test:security > "$RUNNER_TEMP/legal-aid-staff-tests.log" 2>&1 || {
            grep -E '^not ok [0-9]+ - |^# (tests|pass|fail) [0-9]+' "$RUNNER_TEMP/legal-aid-staff-tests.log" | head -20 || true
            exit 1
          }
          npm run typecheck > "$RUNNER_TEMP/legal-aid-staff-ts.log" 2>&1 || {
            grep -E 'error TS[0-9]+' "$RUNNER_TEMP/legal-aid-staff-ts.log" | head -12 || true
            exit 1
          }
          echo "::notice::Legal Aid STAFF scoped case metadata tests and TypeScript passed"
