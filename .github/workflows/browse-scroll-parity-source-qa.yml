name: TRAYDAQ Jobs Events Music — Browse Scroll Source QA
# Validate private feature branch only. NEVER release, build APK/AAB or deploy Cloudflare.
# Retry after updating legacy two-column assumptions in web + native regression tests (head fd3959852cc41fa625a3ef78d80013e1025fba59).
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/browse-scroll-parity-source-qa.yml"
permissions:
  contents: read
jobs:
  web:
    name: Web scrolling regression tests and TypeScript (source-only)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: private-src
    steps:
      - uses: actions/checkout@v4
        with:
          repository: gideondreams3325/traydaq-v2
          ref: feat/marketplace-scroll-parity-jobs-events-music-20261104
          path: private-src
          token: ${{ secrets.TRAYDAQ_V2_SOURCE_READ_TOKEN }}
          persist-credentials: false
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npm test
      - if: always()
        run: npm run typecheck
  android:
    name: Android native scrolling regression tests and TypeScript (no APK)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: private-src/mobile
    steps:
      - uses: actions/checkout@v4
        with:
          repository: gideondreams3325/traydaq-v2
          ref: feat/marketplace-scroll-parity-jobs-events-music-20261104
          path: private-src
          token: ${{ secrets.TRAYDAQ_V2_SOURCE_READ_TOKEN }}
          persist-credentials: false
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: node --test tests/*.test.mjs
      - if: always()
        run: npm run typecheck
