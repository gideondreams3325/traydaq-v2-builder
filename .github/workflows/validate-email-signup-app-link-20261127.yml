name: TRAYDAQ modern Twi UI and release regression validation
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [".github/workflows/validate-email-signup-app-link-20261127.yml"]
permissions:
  contents: read
jobs:
  validation:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        component: [web, android, edge]
    steps:
      - uses: actions/checkout@v4
        with:
          repository: gideondreams3325/traydaq-v2
          ref: 68f4e4d29da1086af9dd65c5cd3951941c0cb23b
          path: private-src
          token: ${{ secrets.TRAYDAQ_V2_SOURCE_READ_TOKEN }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: denoland/setup-deno@v2
        if: matrix.component == 'edge'
        with:
          deno-version: v2.x
      - name: Web and Android source validation
        if: matrix.component != 'edge'
        working-directory: private-src
        env:
          COMPONENT: ${{ matrix.component }}
          CI: "1"
          NODE_OPTIONS: "--max-old-space-size=6144"
        run: |
          if [ "$COMPONENT" = android ]; then cd mobile; fi
          npm ci --no-audit --no-fund > "$RUNNER_TEMP/install.log" 2>&1 || { echo 'Dependency install failed'; exit 1; }
          set +e
          npm run typecheck > "$RUNNER_TEMP/ts.log" 2>&1
          ts_rc=$?
          grep -E 'error TS[0-9]+' "$RUNNER_TEMP/ts.log" | cut -c1-180 | head -60 || true
          node --test tests/*.test.mjs > "$RUNNER_TEMP/tests.log" 2>&1
          test_rc=$?
          grep -E '^(not ok|# (tests|pass|fail) [0-9]+)' "$RUNNER_TEMP/tests.log" | cut -c1-180 | head -80
          # Report failing test locations and concise error types, never source dumps.
          python - <<'PY'
          import os,re,pathlib
          lines=(pathlib.Path(os.environ['RUNNER_TEMP'])/'tests.log').read_text(errors='replace').splitlines()
          active=False
          for line in lines:
              if line.startswith('not ok '):
                  print(line[:180]);active=True
              elif line.startswith('ok '):active=False
              elif active and re.match(r'^  (location|failureType|code|name):',line):print(line[:220])
              elif active and re.search(r'Unmocked native dependency:|ReferenceError:|TypeError:|The input did not match the regular expression|Expected value|^    expected:',line):print(line[:280])
              elif active and re.search(r'\bat .*?tests/[^ ]+\.mjs:[0-9]+:[0-9]+',line):print(re.sub(r'.*?tests/','    tests/',line)[:200])
          PY
          if [ "$COMPONENT" = web ]; then
            node scripts/audit-modern-twi-ui.mjs || { echo "Twi coverage inventory failed"; exit 1; }
            npm run build > "$RUNNER_TEMP/build.log" 2>&1
            build_rc=$?
            if [ "$build_rc" -ne 0 ]; then echo 'Web build failed'; fi
          else build_rc=0; fi
          test "$ts_rc" -eq 0 && test "$test_rc" -eq 0 && test "$build_rc" -eq 0
      - name: Check edge function and runtime tests
        if: matrix.component == 'edge'
        working-directory: private-src
        run: |
          deno --version
          deno check --no-config --node-modules-dir=auto supabase/functions/firebase-auth-resend/index.ts supabase/functions/firebase-password-otp/index.ts supabase/functions/firebase-account-security/index.ts supabase/functions/firebase-native-profile/index.ts > "$RUNNER_TEMP/deno.log" 2>&1 || { grep -Ei 'TS[0-9]+|error|failed|not found|could not|requires|cannot|node_modules|config' "$RUNNER_TEMP/deno.log" | sed -E 's@/home/runner/work/[^ ]+@<workspace-path>@g' | cut -c1-180 | head -40 || true; exit 1; }
          npm ci --no-audit --no-fund > "$RUNNER_TEMP/install.log" 2>&1 || { echo 'Dependency install failed'; exit 1; }
          set +e
          node --test tests/email-signup-app-link-20261127.test.mjs tests/email-verification-app-links.test.mjs tests/account-email-code-runtime.test.mjs tests/account-security-recovery.test.mjs tests/account-security-crypto.test.mjs tests/account-security-service.test.mjs > "$RUNNER_TEMP/otp.log" 2>&1
          rc=$?
          grep -E '^(not ok|# (tests|pass|fail) [0-9]+)' "$RUNNER_TEMP/otp.log" | cut -c1-180 | head -40
          exit "$rc"
