name: TRAYDAQ Global ID Choices and Compact For You Nav — Source QA
# Source tests only: no Expo/Gradle APK/AAB, no app release, no Cloudflare/Supabase deployment.
# Retry after aligning all source regression checks, privacy policy JSON parity and legal syntax: branch head ce3ce7cc481a70603bc688ade80e9199695b8244.
# Retry for regenerated international legal templates, web TS correction and updated runtime checks: feature head 2c67f341b46b9252ef7de20a66231968c89dd286.
# Final source-only check after aligning remaining public legal policy dates, feature head c6a5d943c2044e1c37273b677bc71c6fa007cc1c.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/global-id-compact-feed-source-qa.yml"
permissions:
  contents: read
jobs:
  web:
    name: Web + backend source regression and TypeScript
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: private-src
    steps:
      - uses: actions/checkout@v4
        with:
          repository: gideondreams3325/traydaq-v2
          ref: feat/global-id-review-and-compact-feed-nav-20261105
          token: ${{ secrets.TRAYDAQ_V2_SOURCE_READ_TOKEN }}
          path: private-src
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npm test
      - if: always()
        run: npm run typecheck
  native:
    name: Android native regression and TypeScript (no APK/AAB)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: private-src/mobile
    steps:
      - uses: actions/checkout@v4
        with:
          repository: gideondreams3325/traydaq-v2
          ref: feat/global-id-review-and-compact-feed-nav-20261105
          token: ${{ secrets.TRAYDAQ_V2_SOURCE_READ_TOKEN }}
          path: private-src
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: node --test tests/*.test.mjs
      - if: always()
        run: npm run typecheck
