name: TRAYDAQ Android Balanced Morphism Source QA (No APK)
on:
  push:
    branches: [main]
    paths: [".github/workflows/android-balanced-morphism-20261113-source-qa.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: traydaq-android-balanced-morphism-20261113
  cancel-in-progress: true

env:
  PRIVATE_SOURCE_SHA: 860b4c941e06412063dee49faa915bc8b7e3ed79
  CI: '1'
  EXPO_NO_TELEMETRY: '1'

jobs:
  native-user-only:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout reviewed private Android user source
        uses: actions/checkout@v4
        with:
          repository: gideondreams3325/traydaq-v2
          ref: ${{ env.PRIVATE_SOURCE_SHA }}
          path: private-src
          token: ${{ secrets.TRAYDAQ_V2_SOURCE_READ_TOKEN }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify Android-only file scope
        working-directory: private-src
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=1 origin main
          changed="$(git diff --name-only FETCH_HEAD HEAD)"
          printf '%s\n' "$changed"
          if [ -z "$changed" ]; then echo "::error::Expected Android source changes"; exit 1; fi
          if printf '%s\n' "$changed" | grep -Ev '^mobile/' ; then
            echo "::error::Non-Android source path changed"; exit 1
          fi
      - name: Install native packages
        working-directory: private-src/mobile
        run: npm ci --no-audit --no-fund
      - name: Run all native regression tests
        working-directory: private-src/mobile
        run: node --test tests/*.test.mjs
      - name: Typecheck native app
        working-directory: private-src/mobile
        run: npm run typecheck
      - name: Export Android JavaScript only
        working-directory: private-src/mobile
        run: npx expo export --platform android

# No Gradle, Expo prebuild, APK/AAB, Play Store release, or Cloudflare deploy.
