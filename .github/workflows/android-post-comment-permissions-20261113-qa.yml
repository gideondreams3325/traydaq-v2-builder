name: TRAYDAQ Android Post Comments Permission Source QA (No APK)

on:
  push:
    branches: [main]
    paths: [".github/workflows/android-post-comment-permissions-20261113-qa.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-post-comment-permissions-20261113
  cancel-in-progress: true

env:
  PRIVATE_SOURCE_SHA: a7b036b87d5a0b2fd65f8cd0f5de0573cdc223e0
  CI: '1'
  EXPO_NO_TELEMETRY: '1'

jobs:
  android-source-only:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout private TRAYDAQ Android source, read only
        uses: actions/checkout@v4
        with:
          repository: gideondreams3325/traydaq-v2
          ref: ${{ env.PRIVATE_SOURCE_SHA }}
          path: private-src
          token: ${{ secrets.TRAYDAQ_V2_SOURCE_READ_TOKEN }}
          fetch-depth: 30
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Reject non-Android file changes
        working-directory: private-src
        shell: bash
        run: |
          set -euo pipefail
          BASE_SHA=a1671ed1935712e01362c29604e191ec47f19278
          git cat-file -e "$BASE_SHA^{commit}"
          changed="$(git diff --name-only "$BASE_SHA" HEAD)"
          printf '%s\n' "$changed"
          test -n "$changed"
          if printf '%s\n' "$changed" | grep -Ev '^mobile/'; then
            echo "::error::A non-Android file changed"; exit 1
          fi
      - name: Install native dependencies
        working-directory: private-src/mobile
        run: npm ci --no-audit --no-fund
      - name: Native regression tests (including comment permission tests)
        working-directory: private-src/mobile
        run: node --test tests/*.test.mjs
      - name: Native TypeScript
        working-directory: private-src/mobile
        run: npm run typecheck
      - name: Android JavaScript bundle only
        working-directory: private-src/mobile
        run: npx expo export --platform android

# No Gradle, prebuild, APK, AAB, or Play Store release.
