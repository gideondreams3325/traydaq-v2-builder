name: TRAYDAQ User Traydrive Video Overlay PR570 QA
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/traydaq-traydrive-video-overlay-pr570-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: traydaq-traydrive-video-overlay-pr570-source-qa
  cancel-in-progress: false
env:
  SOURCE_SHA: 'aad76c8184101499a31080849a1e9db951c8da7b'
  CI: '1'
  EXPO_NO_TELEMETRY: '1'
jobs:
  web:
    name: Web regression tests, typecheck, Cloudflare build (no release)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          repository: gideondreams3325/traydaq-v2
          ref: ${{ env.SOURCE_SHA }}
          token: ${{ secrets.TRAYDAQ_V2_SOURCE_READ_TOKEN }}
          persist-credentials: false
          path: private-src
      - name: Verify immutable private source
        working-directory: private-src
        run: test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: private-src/package-lock.json
      - name: Install locked dependencies
        working-directory: private-src
        run: npm ci --no-audit --no-fund
      - name: Traydrive and social regression gates
        working-directory: private-src
        shell: bash
        run: |
          set -euo pipefail
          node --test tests/traydrive-directory-model1.test.mjs tests/traydrive-modern-discovery-20261121.test.mjs tests/traydrive-social-notifications-profile-20261121.test.mjs
      - name: Full web regression suite
        id: web_regressions
        continue-on-error: true
        working-directory: private-src
        shell: bash
        run: |
          set -euo pipefail
          if npm test > "$RUNNER_TEMP/traydrive-web.log" 2>&1; then
            echo 'PASS: full web regression suite'
          else
            echo 'FAIL: web regressions'
            grep '^not ok ' "$RUNNER_TEMP/traydrive-web.log" | head -50 || true
            exit 1
          fi
      - name: Web TypeScript
        working-directory: private-src
        run: npm run typecheck
      - name: Web Cloudflare asset build
        working-directory: private-src
        run: npm run build
      - name: Require all web regression tests to pass
        if: steps.web_regressions.outcome != 'success'
        run: exit 1
  android:
    name: Android regressions, typecheck, JS export (no APK/AAB)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          repository: gideondreams3325/traydaq-v2
          ref: ${{ env.SOURCE_SHA }}
          token: ${{ secrets.TRAYDAQ_V2_SOURCE_READ_TOKEN }}
          persist-credentials: false
          path: private-src
      - name: Verify immutable private source
        working-directory: private-src
        run: test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: private-src/mobile/package-lock.json
      - name: Install locked dependencies
        working-directory: private-src/mobile
        run: npm ci --no-audit --no-fund
      - name: Targeted Android Traydrive tests
        working-directory: private-src/mobile
        run: node --test tests/traydrive-create-profile-feed-links-20261121.test.mjs
      - name: Full native regression suite
        id: native_regressions
        continue-on-error: true
        working-directory: private-src/mobile
        shell: bash
        run: |
          set -euo pipefail
          if node --test tests/*.test.mjs > "$RUNNER_TEMP/traydrive-native.log" 2>&1; then
            echo 'PASS: full Android regression suite'
          else
            echo 'FAIL: native regressions'
            grep '^not ok ' "$RUNNER_TEMP/traydrive-native.log" | head -50 || true
            exit 1
          fi
      - name: Native TypeScript
        working-directory: private-src/mobile
        run: npm run typecheck
      - name: Android JS export
        working-directory: private-src/mobile
        run: npm run export:android
      - name: Require all native regression tests to pass
        if: steps.native_regressions.outcome != 'success'
        run: exit 1
# Builder source validation only. No APK/AAB, production migration, Cloudflare or Edge deployment.
