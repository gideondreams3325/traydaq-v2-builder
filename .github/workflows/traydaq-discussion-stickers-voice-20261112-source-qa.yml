name: TRAYDAQ discussion stickers voice QA (NO RELEASE)
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/traydaq-discussion-stickers-voice-20261112-source-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: traydaq-comment-stickers-voice-source-qa
  cancel-in-progress: false
jobs:
  native-source:
    name: Native comment swipes stickers voice (source only)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      CI: '1'
      EXPO_NO_TELEMETRY: '1'
    steps:
      - name: Checkout exact private candidate
        uses: actions/checkout@v4
        with:
          repository: gideondreams3325/traydaq-v2
          ref: f4108b8deff0b6b401fc88ca0af79c7e6a0a46cb
          path: private-src
          token: ${{ secrets.TRAYDAQ_V2_SOURCE_READ_TOKEN }}
          persist-credentials: false
      - name: Verify candidate commit
        run: test "$(git -C private-src rev-parse HEAD)" = "f4108b8deff0b6b401fc88ca0af79c7e6a0a46cb"
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: private-src/mobile/package-lock.json
      - name: Install native dependencies
        working-directory: private-src/mobile
        run: npm ci --no-audit --no-fund
      - name: Run complete native tests
        working-directory: private-src/mobile
        run: node --test tests/*.test.mjs
      - name: Native TypeScript
        working-directory: private-src/mobile
        run: npm run typecheck
      - name: Android JavaScript export (NO APK AAB)
        working-directory: private-src/mobile
        run: npx expo export --platform android
  web-source:
    name: Web and server source validation (NO DEPLOY)
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout exact private candidate
        uses: actions/checkout@v4
        with:
          repository: gideondreams3325/traydaq-v2
          ref: f4108b8deff0b6b401fc88ca0af79c7e6a0a46cb
          path: private-src
          token: ${{ secrets.TRAYDAQ_V2_SOURCE_READ_TOKEN }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: private-src/package-lock.json
      - name: Install web dependencies
        working-directory: private-src
        run: npm ci --no-audit --no-fund
      - name: Full web regression suite
        working-directory: private-src
        run: npm test
      - name: Web TypeScript
        working-directory: private-src
        run: npm run typecheck
      - name: Cloudflare web build without deploy
        working-directory: private-src
        run: npm run build
