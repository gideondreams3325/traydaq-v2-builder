name: TRAYDAQ V2 PR81 Private Chat Media Validation
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/validate-private-pr81-media.yml"
      - ".github/traydaq-v2-pr81-validation-request.txt"
permissions:
  contents: read
concurrency:
  group: traydaq-v2-pr81-media-validation
  cancel-in-progress: true
jobs:
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Check private checkout credential
        shell: bash
        env:
          TOKEN_PRESENT: ${{ secrets.TRAYDAQ_V2_SOURCE_READ_TOKEN != '' }}
        run: test "$TOKEN_PRESENT" = true
      - name: Fetch exact private source
        uses: actions/checkout@v4
        with:
          repository: gideondreams3325/traydaq-v2
          ref: 29a17139771fcc7c0357bbb18feb978f003ec1c5
          path: src
          token: ${{ secrets.TRAYDAQ_V2_SOURCE_READ_TOKEN }}
          persist-credentials: false
      - name: Validate private source SHA
        shell: bash
        run: test "$(git -C src rev-parse HEAD)" = "29a17139771fcc7c0357bbb18feb978f003ec1c5"
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Web install, TypeScript, tests and build (private logs)
        shell: bash
        working-directory: src
        run: |
          set -euo pipefail
          failed=0
          run_check(){
            label="$1"; shift
            if "$@" > "$RUNNER_TEMP/traydaq-$label.log" 2>&1; then
              echo "::notice::$label passed"
            else
              echo "::error::$label failed. Private diagnostic content remains on the runner only."
              python3 - "$RUNNER_TEMP/traydaq-$label.log" <<'PY'
          import re,sys,os
          t=open(sys.argv[1],errors='replace').read()
          for path,line,col,code in re.findall(r'([^\s:()]+)\((\d+),(\d+)\): error (TS\d+):',t)[:25]:
              print("::notice::TypeScript",os.path.basename(path),line,col,code)
          for m in list(re.finditer(r'^not ok \d+ - (.+)$',t,re.M))[:14]:
              print("::notice::Test:",re.sub('[^a-zA-Z0-9 ._/-]','',m.group(1))[:95])
              context=t[m.end():m.end()+2200]
              loc=re.search(r'location:.*?/tests/([a-zA-Z0-9_.-]+\.test\.mjs):(\d+):',context)
              if loc: print("::notice::Test location:",loc.group(1),"line",loc.group(2))
          PY
              failed=$((failed+1))
            fi
          }
          run_check web-install npm ci --no-audit --no-fund
          run_check web-typecheck npm run typecheck
          run_check web-tests npm test
          run_check web-build npm run build
          test "$failed" -eq 0
  native:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check private checkout credential
        shell: bash
        env:
          TOKEN_PRESENT: ${{ secrets.TRAYDAQ_V2_SOURCE_READ_TOKEN != '' }}
        run: test "$TOKEN_PRESENT" = true
      - name: Fetch exact private source
        uses: actions/checkout@v4
        with:
          repository: gideondreams3325/traydaq-v2
          ref: 29a17139771fcc7c0357bbb18feb978f003ec1c5
          path: src
          token: ${{ secrets.TRAYDAQ_V2_SOURCE_READ_TOKEN }}
          persist-credentials: false
      - name: Validate private source SHA
        shell: bash
        run: test "$(git -C src rev-parse HEAD)" = "29a17139771fcc7c0357bbb18feb978f003ec1c5"
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Android React Native tests and types (no APK build)
        shell: bash
        working-directory: src/mobile
        run: |
          set -euo pipefail
          failed=0
          run_check(){
            label="$1"; shift
            if "$@" > "$RUNNER_TEMP/traydaq-$label.log" 2>&1; then
              echo "::notice::$label passed"
            else
              echo "::error::$label failed. Private diagnostic content remains on the runner only."
              python3 - "$RUNNER_TEMP/traydaq-$label.log" <<'PY'
          import re,sys,os
          t=open(sys.argv[1],errors='replace').read()
          for path,line,col,code in re.findall(r'([^\s:()]+)\((\d+),(\d+)\): error (TS\d+):',t)[:30]:
              print("::notice::TypeScript",os.path.basename(path),line,col,code)
          for m in list(re.finditer(r'^not ok \d+ - (.+)$',t,re.M))[:14]:
              print("::notice::Test:",re.sub('[^a-zA-Z0-9 ._/-]','',m.group(1))[:95])
              context=t[m.end():m.end()+2200]
              loc=re.search(r'location:.*?/tests/([a-zA-Z0-9_.-]+\.test\.mjs):(\d+):',context)
              if loc: print("::notice::Test location:",loc.group(1),"line",loc.group(2))
          PY
              failed=$((failed+1))
            fi
          }
          run_check native-install npm install --no-audit --no-fund
          run_check native-tests bash -c 'node --test tests/*.test.mjs'
          run_check native-typecheck npm run typecheck
          test "$failed" -eq 0

  server:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check private checkout credential
        shell: bash
        env:
          TOKEN_PRESENT: ${{ secrets.TRAYDAQ_V2_SOURCE_READ_TOKEN != '' }}
        run: test "$TOKEN_PRESENT" = true
      - name: Fetch exact private source
        uses: actions/checkout@v4
        with:
          repository: gideondreams3325/traydaq-v2
          ref: 29a17139771fcc7c0357bbb18feb978f003ec1c5
          path: src
          token: ${{ secrets.TRAYDAQ_V2_SOURCE_READ_TOKEN }}
          persist-credentials: false
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Typecheck private messaging edge functions (no deployment)
        shell: bash
        working-directory: src
        run: |
          if deno check --node-modules-dir=auto supabase/functions/firebase-member-chat/index.ts supabase/functions/_shared/chatBusiness.ts > "$RUNNER_TEMP/deno-chat-check.log" 2>&1; then
            echo "::notice::Chat server Deno typecheck passed"
          else
            echo "::error::Chat server Deno typecheck failed; private source logs were not uploaded"
            python3 - "$RUNNER_TEMP/deno-chat-check.log" <<'PY'
          import os,re,sys
          t=open(sys.argv[1],errors='replace').read()
          t=re.sub(r'\x1b\[[0-9;]*m','',t)
          for code in sorted(set(re.findall(r'\bTS\d{4}\b',t)))[:20]:
              print('::notice::Deno TypeScript',code)
          for path,line,col in re.findall(r'(?:file:///|(?:\s|/))([A-Za-z0-9._/-]+\.ts):(\d+):(\d+)',t)[:15]:
              print('::notice::Deno location',os.path.basename(path),'line',line,'column',col)
          errors=[x.strip() for x in t.splitlines() if x.strip().lower().startswith('error:')]
          for e in errors[:8]:
              safe=re.sub(r'(?:file|https?)://[^\s]+','<path>',e)
              safe=re.sub(r'[/\\][A-Za-z0-9_./\\-]{12,}','<path>',safe)
              safe=re.sub(r'[^a-zA-Z0-9 .:,_()<>-]','',safe)
              print('::notice::Deno error class:',safe[:135])
          for line in [line.strip() for line in t.splitlines() if line.strip()][:10]:
              line=re.sub(r'\x1b\[[0-9;]*m','',line)
              line=re.sub(r'(?:file|https?)://[^\s]+','<url>',line)
              line=re.sub(r'/home/[^\s]+','<path>',line)
              line=re.sub(r'[^a-zA-Z0-9 .:_()<>,-]','',line)
              print('::notice::Deno output:',line[:125])
          tail=[x.strip() for x in t.splitlines() if x.strip() and not x.strip().startswith('Download ')]
          for line in tail[-12:]:
              line=re.sub(r'(?:file|https?)://[^\s]+','<url>',line)
              line=re.sub(r'/home/[^\s]+','<path>',line)
              line=re.sub(r'[^a-zA-Z0-9 .:_()<>,-]','',line)
              print('::notice::Deno final:',line[:140])
          PY
            exit 1
          fi
  firebase:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Confirm private checkout credential
        shell: bash
        env:
          TOKEN_PRESENT: ${{ secrets.TRAYDAQ_V2_SOURCE_READ_TOKEN != '' }}
        run: test "$TOKEN_PRESENT" = true
      - name: Fetch exact private source
        uses: actions/checkout@v4
        with:
          repository: gideondreams3325/traydaq-v2
          ref: 29a17139771fcc7c0357bbb18feb978f003ec1c5
          path: src
          token: ${{ secrets.TRAYDAQ_V2_SOURCE_READ_TOKEN }}
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test Firebase RTDB rules with local emulator (no APK)
        working-directory: src/firebase
        shell: bash
        run: |
          set -euo pipefail
          if ! npm install --no-audit --no-fund > "$RUNNER_TEMP/firebase-install.log" 2>&1; then
            echo "::error::Firebase emulator package installation failed"
            exit 1
          fi
          echo "::notice::Firebase emulator dependencies installed"
          if npm run test:rules > "$RUNNER_TEMP/firebase-rules.log" 2>&1; then
            echo "::notice::Firebase emulator authorization tests passed"
          else
            echo "::error::Firebase emulator authorization tests failed"
            python3 - "$RUNNER_TEMP/firebase-rules.log" <<'PY'
          import re,sys
          t=open(sys.argv[1],errors='replace').read()
          for name in re.findall(r'^not ok \d+ - (.*)$',t,re.M)[:20]:
              print('::notice::Firebase failed test:',re.sub('[^A-Za-z0-9 .,()/:-]','',name)[:105])
          print('::notice::Emulator failing test count:',len(re.findall(r'^not ok \d+',t,re.M)))
          PY
            exit 1
          fi
