name: TRAYDAQ Web Comment Images No Stickers Source QA
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/web-comment-images-no-stickers-20261113-source-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: traydaq-web-comment-photos-no-stickers
  cancel-in-progress: true
env:
  PRIVATE_SOURCE_SHA: dc05efbd481dbbb7ed5ec811d872bd8571bbe268
jobs:
  web:
    name: Web tests, typecheck and Cloudflare-targeted build (no deploy or AAB)
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      CI: '1'
    steps:
      - name: Confirm private source access
        env:
          HAS_TOKEN: ${{ secrets.TRAYDAQ_V2_SOURCE_READ_TOKEN != '' }}
        run: test "$HAS_TOKEN" = true
      - name: Checkout exact private candidate
        uses: actions/checkout@v4
        with:
          repository: gideondreams3325/traydaq-v2
          ref: ${{ env.PRIVATE_SOURCE_SHA }}
          path: private-src
          token: ${{ secrets.TRAYDAQ_V2_SOURCE_READ_TOKEN }}
          persist-credentials: false
      - name: Validate source commit and image-only web composer
        working-directory: private-src
        run: |
          test "$(git rev-parse HEAD)" = "$PRIVATE_SOURCE_SHA"
          grep -q 'onImage={file=>void stageImage(file)}' src/native-parity/Discussions.tsx
          grep -q 'payload.append("image",attachment,attachment.name)' src/native-parity/Discussions.tsx
          grep -q 'const incomingImage=form.get("image")' supabase/functions/firebase-discussions/index.ts
          grep -q 'aria-label="Attach image to comment"' src/native-parity/Discussions.tsx
          if grep -q 'setStickerTrayOpen' src/native-parity/Discussions.tsx; then exit 1; fi
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: private-src/package-lock.json
      - name: Install locked web dependencies
        working-directory: private-src
        run: npm ci --no-audit --no-fund
      - name: Run full web regression suite
        working-directory: private-src
        run: npm test
      - name: Typecheck web TypeScript
        working-directory: private-src
        run: npm run typecheck
      - name: Compile Cloudflare-targeted web assets without deployment
        working-directory: private-src
        run: npm run build
      - name: Confirm validation only
        run: echo 'No deployment, APK, AAB, signing or Google Play release.'
