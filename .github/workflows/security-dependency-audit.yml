name: TRAYDAQ V2 Weekly Security Audit (No APK)
on:
  workflow_dispatch:
  pull_request:
  schedule:
    - cron: '22 6 * * 1'
  push:
    branches: [main]
    paths:
      - '.github/workflows/security-dependency-audit.yml'
permissions:
  contents: read
jobs:
  public-source-scan:
    name: Scan public builder for privileged credentials
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Scan tracked public files without printing secret values
        shell: bash
        run: |
          python3 - <<'PY'
          import base64, json, pathlib, re, subprocess, sys
          paths = subprocess.check_output(['git', 'ls-files', '-z']).split(b'\0')
          patterns = [
              re.compile(rb'-----BEGIN (?:RSA |EC |OPENSSH |DSA |ENCRYPTED )?PRIVATE KEY-----'),
              re.compile(rb'\b(?:gh[pousr]_[A-Za-z0-9]{36,}|github_pat_[A-Za-z0-9_]{60,})\b'),
              re.compile(rb'\bsb_secret_[A-Za-z0-9_-]{20,}\b'),
              re.compile(rb'\bre_[A-Za-z0-9_-]{24,}\b'),
              re.compile(rb'\b(?:AKIA|ASIA)[A-Z0-9]{16}\b'),
          ]
          jwt = re.compile(rb'\beyJ[A-Za-z0-9_-]+\.(eyJ[A-Za-z0-9_-]+)\.[A-Za-z0-9_-]+\b')
          bad = []
          for raw in filter(None, paths):
              path = pathlib.Path(raw.decode('utf-8', errors='surrogateescape'))
              name = path.name.lower()
              if (name == '.env' or name.startswith('.env.')) and name not in {'.env.example', '.env.sample', '.env.template'}:
                  bad.append(str(path)); continue
              if name.endswith(('.jks', '.keystore', '.p12', '.p8', '.pem', '.key')) or re.search(r'service[._-]?account.*\.json$', name):
                  bad.append(str(path)); continue
              if not path.is_file() or path.is_symlink():
                  continue
              data = path.read_bytes()
              if any(pattern.search(data) for pattern in patterns):
                  bad.append(str(path)); continue
              for match in jwt.finditer(data):
                  payload = match.group(1)
                  try:
                      decoded = json.loads(base64.urlsafe_b64decode(payload + b'=' * (-len(payload) % 4)))
                      if isinstance(decoded, dict) and decoded.get('role') == 'service_role':
                          bad.append(str(path)); break
                  except (ValueError, UnicodeError):
                      pass
          if bad:
              for path in sorted(set(bad)):
                  print('Potential credential in tracked file: ' + repr(path))
              sys.exit(1)
          print('Public tracked-file scan passed; no matched privileged credential patterns.')
          PY
  audit:
    if: github.event_name != 'pull_request'
    name: Audit ${{ matrix.component }} dependencies without APK build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        component: [web, user-android, staff-android, firebase-tools]
        include:
          - component: web
            directory: .
          - component: user-android
            directory: mobile
          - component: staff-android
            directory: admin-native
          - component: firebase-tools
            directory: firebase
    defaults:
      run:
        working-directory: private-src/${{ matrix.directory }}
    steps:
      - name: Check out private native source with read-only credentials
        uses: actions/checkout@v4
        with:
          repository: gideondreams3325/traydaq-v2
          ref: main
          path: private-src
          token: ${{ secrets.TRAYDAQ_V2_SOURCE_READ_TOKEN }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Reject tracked private credential files
        working-directory: private-src
        shell: bash
        run: |
          set -euo pipefail
          if git ls-files | grep -Ev '(^|/)\.env\.(example|sample|template)$' | grep -E '(^|/)(\.env(\..*)?|[^/]+\.(jks|keystore|p12|p8|pem)|[^/]*service.account[^/]*\.json|firebase.admin[^/]*\.json)$' >/dev/null; then
            echo '::error::A potential private key or environment file is tracked in the source repository.'
            exit 1
          fi
      - name: Prepare dependency metadata without running lifecycle scripts
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -f package-lock.json ]; then
            npm install --package-lock-only --ignore-scripts --no-audit --no-fund >"$RUNNER_TEMP/traydaq-install.log" 2>&1 || {
              echo "::error::Unable to resolve dependency metadata."
              exit 1
            }
            echo "No committed lockfile; scan covers currently resolved dependencies only."
          fi
      - name: Audit runtime and build dependencies without publishing private source details
        shell: bash
        run: |
          set -euo pipefail
          report="$(mktemp)"
          trap 'rm -f "$report"' EXIT
          # Build tools can compromise a release even when not shipped in the app.
          npm audit --package-lock-only --audit-level=high --json >"$report" 2>/dev/null || true
          node - "$report" <<'JS'
          const fs = require('node:fs');
          let report;
          try { report = JSON.parse(fs.readFileSync(process.argv[2], 'utf8')); }
          catch { console.error('::error::Dependency audit unavailable.'); process.exit(1); }
          const counts = report.metadata?.vulnerabilities;
          if (report.error || !counts || !Number.isInteger(counts.high) || !Number.isInteger(counts.critical)) {
            console.error('::error::Dependency audit returned no valid vulnerability summary.'); process.exit(1);
          }
          console.log('Runtime and build vulnerability counts: ' + JSON.stringify({
            info: counts.info, low: counts.low, moderate: counts.moderate,
            high: counts.high, critical: counts.critical
          }));
          // Publish only independently public advisory identifiers, never private
          // dependency graph details, manifest contents, paths or credentials.
          const advisories = new Set();
          for (const vulnerability of Object.values(report.vulnerabilities || {})) {
            for (const via of vulnerability.via || []) {
              if (!via || typeof via !== 'object') continue;
              const url = typeof via.url === 'string' ? via.url : '';
              const id = /^https:\/\/github\.com\/advisories\/(GHSA-[a-z0-9]{4}-[a-z0-9]{4}-[a-z0-9]{4})$/i.exec(url)?.[1];
              if (id) advisories.add(id);
            }
          }
          console.log('Public advisory IDs: ' + [...advisories].sort().join(', '));
          if (counts.high || counts.critical) process.exit(1);
          JS
      - name: Report security scan completed
        run: echo 'TRAYDAQ dependency audit completed without generating an APK.'
