name: Link Admin Android package and existing FCM credential

# Creates ONLY Admin credential linkage on Expo. No APK build, keystore upload,
# Firebase changes, or impact on the regular TRAYDAQ user Expo project.
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/link-admin-android-expo.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: expo-link-admin-android
  cancel-in-progress: false

jobs:
  link-admin:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      EXPO_TOKEN: ${{ secrets.TRAYDAQ_V2_EXPO_TOKEN }}
    steps:
      - name: Check saved Expo token
        run: |
          if [[ -z "${EXPO_TOKEN:-}" ]]; then
            echo "::error::Existing Expo token secret not available."
            exit 1
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Register only TRAYDAQ Admin Android identifier and reuse existing FCM V1 if available
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const appId = '017f3881-3581-41e3-a661-11c49614c0c9';
          const appName = 'traydaq-admin-native';
          const accountName = 'gideondreamss-team';
          const androidId = 'com.traydaq.admin';
          async function request(query,variables={}) {
            const response = await fetch('https://api.expo.dev/graphql', {
              method: 'POST',
              headers: {
                'Authorization': 'Bearer ' + process.env.EXPO_TOKEN,
                'Content-Type': 'application/json'
              },
              body: JSON.stringify({query,variables}),
              signal: AbortSignal.timeout(50000)
            });
            if(!response.ok)throw new Error('Expo API rejected request with status '+response.status);
            const json = await response.json();
            if(json.errors?.length)throw new Error('Expo API: '+json.errors.map(e=>e.message).join('; ').slice(0,400));
            return json.data;
          }
          const fetched = await request(
            'query($appId:String!){app{byId(appId:$appId){id slug ownerAccount{name googleServiceAccountKeysPaginated(first:50){edges{node{id projectIdentifier}}}} androidAppCredentials(filter:{applicationIdentifier:"com.traydaq.admin"}){id applicationIdentifier googleServiceAccountKeyForFcmV1{id projectIdentifier}}}}}',
            {appId}
          );
          const app = fetched?.app?.byId;
          if(app?.id!==appId || app.slug!==appName || app.ownerAccount?.name!==accountName){
            throw new Error('Expo project identity mismatch: refusing to modify the wrong app.');
          }
          const records=app.androidAppCredentials||[];
          let adminCred = records.find(c=>c.applicationIdentifier===androidId);
          if(!adminCred) {
            const created = await request(
              'mutation($appId:ID!,$identifier:String!){androidAppCredentials{createAndroidAppCredentials(appId:$appId,applicationIdentifier:$identifier,androidAppCredentialsInput:{}){id applicationIdentifier googleServiceAccountKeyForFcmV1{id projectIdentifier}}}}',
              {appId,identifier:androidId}
            );
            adminCred=created?.androidAppCredentials?.createAndroidAppCredentials;
            if(!adminCred?.id || adminCred.applicationIdentifier!==androidId)
              throw new Error('Expo did not confirm the Admin Android identifier.');
            console.log('CREATED_ADMIN_ANDROID_IDENTIFIER='+androidId);
          }else{
            console.log('ADMIN_ANDROID_IDENTIFIER_ALREADY_EXISTS='+androidId);
          }
          let fcm=adminCred.googleServiceAccountKeyForFcmV1?.projectIdentifier==='traydaq';
          if(!fcm) {
            const matching=(app.ownerAccount.googleServiceAccountKeysPaginated?.edges||[])
              .map(e=>e.node).filter(k=>k.projectIdentifier==='traydaq');
            if(matching.length===1) {
              const updated=await request(
                'mutation($id:ID!,$keyId:ID!){androidAppCredentials{setGoogleServiceAccountKeyForFcmV1(id:$id,googleServiceAccountKeyId:$keyId){id googleServiceAccountKeyForFcmV1{id projectIdentifier}}}}',
                {id:adminCred.id,keyId:matching[0].id}
              );
              fcm=updated?.androidAppCredentials?.setGoogleServiceAccountKeyForFcmV1?.googleServiceAccountKeyForFcmV1?.projectIdentifier==='traydaq';
              if(!fcm)throw new Error('Expo did not confirm the FCM V1 association.');
              console.log('ADMIN_FCM_V1_LINKED_TO_EXISTING_TRAYDAQ_KEY');
            }else{
              console.log('ADMIN_FCM_V1_REQUIRES_SERVICE_ACCOUNT_KEY (matching saved keys: '+matching.length+')');
            }
          }else{
            console.log('ADMIN_FCM_V1_ALREADY_LINKED');
          }
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY,
            '### Separate TRAYDAQ Admin Android credentials\n\n'+
            '- Admin Expo: https://expo.dev/accounts/gideondreamss-team/projects/traydaq-admin-native\n'+
            '- Android identifier: '+androidId+'\n'+
            '- FCM V1: '+(fcm?'linked to Firebase traydaq':'needs a Firebase service account key in Expo')+'\n'+
            '- Keystore: untouched (GitHub APK signing remains separate)\n'+
            '- APK build: not started\n'
          );
          NODE
