name: TRAYDAQ User Android 1.0.17 Source QA (no package)
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/user-android-1017-release-source-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
env:
  SOURCE_SHA: 02704dfa3a560e016631ffb6e77ab61ec4f236b5
jobs:
  android-source:
    name: Validate source, package identity and Hermes JavaScript
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      CI: '1'
      EXPO_NO_TELEMETRY: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          repository: gideondreams3325/traydaq-v2
          ref: ${{ env.SOURCE_SHA }}
          path: private-src
          token: ${{ secrets.TRAYDAQ_V2_SOURCE_READ_TOKEN }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check TRAYDAQ user release package and full native regression suite
        working-directory: private-src/mobile
        shell: bash
        run: |
          set -euo pipefail
          node - <<'NODE'
          const app=require('./app.json').expo;
          if(app.android.package!=='com.traydaq.app'||app.android.versionCode!==19||app.version!=='1.0.17')
            throw Error('Wrong user APK version or package');
          console.log('PASS: com.traydaq.app 1.0.17 code 19');
          NODE
          npm ci --no-audit --no-fund > "$RUNNER_TEMP/native-install.log" 2>&1 || { echo "::error::Native dependencies failed"; exit 1; }
          node --test tests/*.test.mjs > "$RUNNER_TEMP/native-test.log" 2>&1 || { echo "::error::Native regressions failed"; grep -E '^not ok [0-9]+ - ' "$RUNNER_TEMP/native-test.log" | head -15 || true; exit 1; }
          npm run typecheck
          npx expo export --platform android > "$RUNNER_TEMP/native-export.log" 2>&1 || { echo "::error::Android JS export failed"; exit 1; }
          echo "PASS: full native regression tests, TS, Android JS export."
# Source-only validation: no APK/AAB or staff app.
