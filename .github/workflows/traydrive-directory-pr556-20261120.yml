name: TRAYDAQ Traydrive Model 1 Directory PR556 Source QA
on:
  push:
    branches: [main]
    paths: [.github/workflows/traydrive-directory-pr556-20261120.yml]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: traydrive-directory-pr556-validation
  cancel-in-progress: false
env:
  SOURCE_SHA: '086384728b2911a38fb2dcad8f47457dd536c281'
  CI: '1'
  EXPO_NO_TELEMETRY: '1'
jobs:
  web:
    name: Web source tests, TypeScript and Cloudflare asset build
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
        with:
          repository: gideondreams3325/traydaq-v2
          ref: ${{ env.SOURCE_SHA }}
          token: ${{ secrets.TRAYDAQ_V2_SOURCE_READ_TOKEN }}
          persist-credentials: false
          path: private-src
      - name: Verify immutable private source
        working-directory: private-src
        run: test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: private-src/package-lock.json
      - name: Install locked web dependencies
        working-directory: private-src
        run: npm ci --no-audit --no-fund
      - name: Model 1 focused source tests
        working-directory: private-src
        run: node --test tests/traydrive-directory-model1.test.mjs
      - name: Full web regressions (enforce exactly known baseline failures)
        working-directory: private-src
        shell: bash
        run: |
          set -euo pipefail
          if npm test > "$RUNNER_TEMP/traydrive-web-regressions.log" 2>&1; then
            echo 'PASS: All root regressions'
          else
            export TEST_LOG="$RUNNER_TEMP/traydrive-web-regressions.log"
            node --input-type=module <<'NODE'
          import {readFileSync} from 'node:fs';
          import assert from 'node:assert/strict';
          const data=readFileSync(process.env.TEST_LOG,'utf8');
          const failed=[...data.matchAll(/^not ok \d+ - (.*)$/gm)].map(x=>x[1].trim()).sort();
          const known=[
            'native Android keeps inline discovery text clear of the fixed engagement actions',
            'iPhone staff legal editor is visible only inside assigned legal-aid department',
            'safe public photo and video posts publish immediately but are queued for human review',
            'both creators use identical discovery normalization and preserve existing approved metadata path'
          ].sort();
          console.log('Historical failures:',failed.length);
          assert.deepEqual(failed,known,'New or altered web test failures are not allowed');
          console.log('PASS: No additional regressions beyond four verified historical failures');
          NODE
          fi
      - name: Strict web TypeScript
        working-directory: private-src
        run: npm run typecheck
      - name: Cloudflare-targeted build (no deploy)
        working-directory: private-src
        run: npm run build
  android:
    name: Android full regressions, TypeScript and JS export
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          repository: gideondreams3325/traydaq-v2
          ref: ${{ env.SOURCE_SHA }}
          token: ${{ secrets.TRAYDAQ_V2_SOURCE_READ_TOKEN }}
          persist-credentials: false
          path: private-src
      - name: Verify immutable private source
        working-directory: private-src
        run: test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: private-src/mobile/package-lock.json
      - name: Install locked Android dependencies
        working-directory: private-src/mobile
        run: npm ci --no-audit --no-fund
      - name: Native full regression suite
        working-directory: private-src/mobile
        run: node --test tests/*.test.mjs
      - name: Native TypeScript
        working-directory: private-src/mobile
        run: npm run typecheck
      - name: Android JS export (no APK/AAB)
        working-directory: private-src/mobile
        run: npm run export:android
  staff:
    name: Native Staff access tests and TypeScript
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          repository: gideondreams3325/traydaq-v2
          ref: ${{ env.SOURCE_SHA }}
          token: ${{ secrets.TRAYDAQ_V2_SOURCE_READ_TOKEN }}
          persist-credentials: false
          path: private-src
      - name: Verify immutable private source
        working-directory: private-src
        run: test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          # Staff package intentionally has no committed lockfile yet.
      - name: Install Staff dependencies for source validation
        working-directory: private-src/admin-native
        run: npm install --no-package-lock --no-audit --no-fund
      - name: Staff native security regression suite
        working-directory: private-src/admin-native
        run: npm run test:security
      - name: Staff TypeScript
        working-directory: private-src/admin-native
        run: npm run typecheck
  deno:
    name: Directory-only Edge function typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          repository: gideondreams3325/traydaq-v2
          ref: ${{ env.SOURCE_SHA }}
          token: ${{ secrets.TRAYDAQ_V2_SOURCE_READ_TOKEN }}
          persist-credentials: false
          path: private-src
      - name: Verify immutable private source
        working-directory: private-src
        run: test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Deno import and typecheck
        working-directory: private-src
        run: deno check --node-modules-dir=auto supabase/functions/firebase-traydrive/index.ts
# Private source and user data are never uploaded as builder artifacts.
# No database migration, Edge deployment, Cloudflare push, APK or AAB release.

  schema:
    name: Private temporary PostgreSQL 16 directory migration/RLS/erasure test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: traydrive_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d traydrive_ci"
          --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@v4
        with:
          repository: gideondreams3325/traydaq-v2
          ref: ${{ env.SOURCE_SHA }}
          token: ${{ secrets.TRAYDAQ_V2_SOURCE_READ_TOKEN }}
          persist-credentials: false
          path: private-src
      - name: Verify exact source revision
        working-directory: private-src
        run: test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
      - name: Ensure PostgreSQL client is installed
        shell: bash
        run: |
          if ! command -v psql >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y postgresql-client
          fi
      - name: Apply migration ONLY to ephemeral runner DB and validate private RLS and erasure rules
        working-directory: private-src
        env:
          TRAYDRIVE_TEST_DATABASE_URL: 'postgresql://postgres:postgres@127.0.0.1:5432/traydrive_ci'
        run: bash scripts/traydrive-directory-schema-smoke.sh
# All jobs are validation only. No production DB, Edge deploy, Cloudflare push or Android build.
