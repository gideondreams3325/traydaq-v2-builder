name: TRAYDAQ Web Android Content Edit Source QA (No APK)
on:
  push:
    branches: [main]
    paths: [".github/workflows/user-content-edits-web-android-20261113-source-qa.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: traydaq-web-android-content-edits-20261113
  cancel-in-progress: true

env:
  PRIVATE_SOURCE_SHA: 991fc95a2a81de55691e20ea8a39ae65503770d5
  CI: '1'
  EXPO_NO_TELEMETRY: '1'

jobs:
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          repository: gideondreams3325/traydaq-v2
          ref: ${{ env.PRIVATE_SOURCE_SHA }}
          path: private-src
          token: ${{ secrets.TRAYDAQ_V2_SOURCE_READ_TOKEN }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install user web dependencies
        working-directory: private-src
        run: npm ci --no-audit --no-fund
      - name: User web TypeScript
        working-directory: private-src
        run: npm run typecheck
      - name: User web regressions
        working-directory: private-src
        run: npm test
      - name: Cloudflare-targeted static compile (no deployment)
        working-directory: private-src
        run: npm run build
      - name: Confirm production NativeParity editor is bundled
        working-directory: private-src
        run: |
          node --input-type=module <<'NODE'
          import {readdirSync,readFileSync} from 'node:fs';
          import {join} from 'node:path';
          const visit=['dist'];
          let hasEditor=false;
          while(visit.length){
            const dir=visit.pop();
            for(const entry of readdirSync(dir,{withFileTypes:true})){
              const path=join(dir,entry.name);
              if(entry.isDirectory())visit.push(path);
              else if(entry.name.endsWith('.js')&&readFileSync(path,'utf8').includes('firebase-content-edits'))
                hasEditor=true;
            }
          }
          if(!hasEditor)throw Error('Missing live Firebase content editing UI in Cloudflare web assets');
          console.log('PASS: Production web bundle includes authenticated owner editor');
          NODE

  android:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          repository: gideondreams3325/traydaq-v2
          ref: ${{ env.PRIVATE_SOURCE_SHA }}
          path: private-src
          token: ${{ secrets.TRAYDAQ_V2_SOURCE_READ_TOKEN }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Android source dependencies
        working-directory: private-src/mobile
        run: npm ci --no-audit --no-fund
      - name: Android TypeScript
        working-directory: private-src/mobile
        run: npm run typecheck
      - name: Android regressions
        working-directory: private-src/mobile
        run: node --test tests/*.test.mjs
      - name: Android JS export only
        working-directory: private-src/mobile
        run: npx expo export --platform android

  staff:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          repository: gideondreams3325/traydaq-v2
          ref: ${{ env.PRIVATE_SOURCE_SHA }}
          path: private-src
          token: ${{ secrets.TRAYDAQ_V2_SOURCE_READ_TOKEN }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install native STAFF dependencies
        working-directory: private-src/admin-native
        run: npm install --no-audit --no-fund
      - name: Native STAFF TypeScript
        working-directory: private-src/admin-native
        run: npm run typecheck
      - name: Native STAFF regression tests
        working-directory: private-src/admin-native
        run: node --test tests/*.test.mjs
# Source validation only. No Expo prebuild, Gradle, APK/AAB, Play Store release or Cloudflare deploy.
