name: Android SDK 58 compatibility assessment
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [".github/workflows/validate-android-sdk58-migration-20261126.yml"]
permissions:
  contents: read
jobs:
  sdk58:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CI: "1"
      EXPO_NO_TELEMETRY: "1"
      NODE_OPTIONS: "--max-old-space-size=6144"
    defaults:
      run:
        working-directory: private-src/mobile
    steps:
      - uses: actions/checkout@v4
        with:
          repository: gideondreams3325/traydaq-v2
          ref: d687033b7bb70a33cf3b80848fe3df4c78691f61
          path: private-src
          token: ${{ secrets.TRAYDAQ_V2_SOURCE_READ_TOKEN }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Install committed SDK 58 dependencies
        run: |
          npm ci --no-audit --no-fund > "$RUNNER_TEMP/install.log" 2>&1
          npx expo install --check > "$RUNNER_TEMP/check.log" 2>&1 || {
            grep -Ei 'expected version|should be updated|Error:' "$RUNNER_TEMP/check.log" | cut -c1-180 | head -40 || true
            exit 1
          }
          node -e 'for(const p of ["expo","react-native","react"]) console.log(p,require(p+"/package.json").version)'
      - name: Native tests against upgraded dependencies
        run: |
          set +e
          node --test tests/*.test.mjs > "$RUNNER_TEMP/tests.log" 2>&1
          rc=$?
          grep -E '^(not ok|# (tests|pass|fail) [0-9]+)' "$RUNNER_TEMP/tests.log" | cut -c1-180 | head -80
          exit "$rc"
      - name: TypeScript compatibility
        if: always()
        run: |
          npm run typecheck > "$RUNNER_TEMP/ts.log" 2>&1 || {
            grep -E 'error TS[0-9]+' "$RUNNER_TEMP/ts.log" | cut -c1-180 | head -100 || true
            exit 1
          }
      - name: SDK 58 Android prebuild compatibility
        run: |
          npx expo prebuild --platform android --non-interactive > "$RUNNER_TEMP/prebuild.log" 2>&1 || {
            grep -Ei 'Error:|PluginError|Cannot find module|Unable to verify|Expected Expo' "$RUNNER_TEMP/prebuild.log" | cut -c1-180 | head -30 || true
            exit 1
          }
          echo 'PASS: SDK 58 generated Android project; no source changes committed or release built'

      - name: Use preinstalled current Android command-line tools
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          test -x "$SDKMANAGER"
          "$SDKMANAGER" --version
          echo "$(dirname "$SDKMANAGER")" >> "$GITHUB_PATH"
      - name: Inspect generated toolchain requirements
        run: |
          for f in android/gradle/wrapper/gradle-wrapper.properties node_modules/react-native/gradle/libs.versions.toml node_modules/@react-native/gradle-plugin/gradle/libs.versions.toml; do
            if test -f "$f"; then
              grep -E '^(distributionUrl|agp|androidGradlePlugin|compileSdk|targetSdk|buildTools|kotlin|ndk)[[:space:]]*=' "$f" | head -15 || true
            fi
          done
          # SDK 58's generated version catalog requires compileSdk 37 and build tools 37.
          sdkmanager --list --channel=3 > "$RUNNER_TEMP/sdk-list.log" 2>&1
          grep -E '^[[:space:]]*(platforms;android-|build-tools;37)' "$RUNNER_TEMP/sdk-list.log" | cut -c1-180 | tail -45 || true
          if ! test -s "$ANDROID_HOME/platforms/android-37.0/android.jar"; then
            if ! grep -Eq '^[[:space:]]*platforms;android-37\.0[[:space:]]*\|' "$RUNNER_TEMP/sdk-list.log"; then
              echo "::error::Required Android API 37.0 platform is not installed or listed by the current SDK manager."
              exit 1
            fi
            sdkmanager --channel=3 "platforms;android-37.0" > "$RUNNER_TEMP/sdk-platform.log" 2>&1 || {
              tr '\r' '\n' < "$RUNNER_TEMP/sdk-platform.log" | grep -Ei 'failed|error|not found|warning:|license' | cut -c1-180 | tail -20 || true
              exit 1
            }
          fi
          test -s "$ANDROID_HOME/platforms/android-37.0/android.jar"
          sdkmanager --channel=3 "platforms;android-36" "build-tools;36.0.0" "build-tools;37.0.0" > "$RUNNER_TEMP/sdk.log" 2>&1 || {
            tr '\r' '\n' < "$RUNNER_TEMP/sdk.log" | grep -Ei 'failed|error|not found|warning:|license' | cut -c1-180 | tail -20 || true
            exit 1
          }
      - name: Verify resolved Android Gradle Plugin version
        working-directory: private-src/mobile/android
        run: |
          chmod +x gradlew
          ./gradlew --version | grep -E "^(Gradle |Kotlin:|Launcher JVM:|Daemon JVM:)" || true
          cat > "$RUNNER_TEMP/verify-agp.gradle" <<'GRADLE'
          gradle.projectsEvaluated {
            def app = gradle.rootProject.findProject(':app')
            def plugin = app.plugins.findPlugin('com.android.application')
            if (plugin == null) throw new GradleException('Android application plugin missing')
            def version = plugin.class.classLoader.loadClass('com.android.Version').getField('ANDROID_GRADLE_PLUGIN_VERSION').get(null)
            println("TRAYDAQ_AGP_VERSION=" + version)
          }
          GRADLE
          if ! ./gradlew --no-daemon --console=plain -I "$RUNNER_TEMP/verify-agp.gradle" :app:help > "$RUNNER_TEMP/agp.log" 2>&1; then
            grep -Ei '^> Task .*FAILED|^Execution failed for task|^BUILD FAILED|^FAILURE:|^\* What went wrong:|^Could not |^A problem occurred|^Plugin .* was not found|^Minimum supported|^Android Gradle plugin|^Gradle requires|^Error:' "$RUNNER_TEMP/agp.log" | cut -c1-200 | head -40 || true
            awk '/^[*] What went wrong:/{p=1;next} /^[*] (Try|Exception is):/{p=0} p && NF{print}' "$RUNNER_TEMP/agp.log" | sed -E 's@/home/runner/work/[^ ]+@<workspace-path>@g; s@https?://[^ ]+@<url>@g' | cut -c1-240 | head -30 || true
            echo "AGP configuration command failed"
            exit 1
          fi
          grep -E '^TRAYDAQ_AGP_VERSION=' "$RUNNER_TEMP/agp.log" || true
          if ! grep -Eq '^TRAYDAQ_AGP_VERSION=9\.' "$RUNNER_TEMP/agp.log"; then
            echo "Resolved Android Gradle Plugin is not version 9.x or was not identified."
            exit 1
          fi
      - name: Compile optimized Android bundle
        working-directory: private-src/mobile/android
        run: |
          ./gradlew --no-daemon --console=plain :app:bundleRelease > "$RUNNER_TEMP/gradle.log" 2>&1 || {
            grep -Ei '^> Task .*FAILED|^Execution failed for task|^BUILD FAILED|^FAILURE:|^\* What went wrong:|^Could not |^A problem occurred|^Missing class |^ERROR:|^e: ' "$RUNNER_TEMP/gradle.log" | cut -c1-180 | head -50 || true
            exit 1
          }
          test -s app/build/outputs/bundle/release/app-release.aab
          test -s app/build/outputs/mapping/release/mapping.txt
          echo 'PASS: optimized AGP 9 release bundle built; no distribution'

      - name: Audit compiled DEX for deprecated system bar APIs
        working-directory: private-src/mobile/android
        run: |
          python3 - <<'PY'
          import os, zipfile, pathlib, subprocess, re
          target=pathlib.Path(os.environ['RUNNER_TEMP'])/'quality-dex'
          target.mkdir(exist_ok=True)
          names=['getStatusBarColor','setStatusBarColor','setNavigationBarColor']
          hits={n:0 for n in names}
          with zipfile.ZipFile('app/build/outputs/bundle/release/app-release.aab') as z:
            for item in z.namelist():
              if not re.fullmatch(r'base/dex/classes[0-9]*\.dex',item): continue
              path=target/pathlib.Path(item).name
              path.write_bytes(z.read(item))
              with subprocess.Popen([os.environ['ANDROID_HOME']+'/build-tools/36.0.0/dexdump','-d',str(path)],stdout=subprocess.PIPE,text=True,errors='replace') as p:
                for line in p.stdout:
                  if 'invoke-' in line and ('android/view/Window' in line or 'android.view.Window' in line):
                    for n in names:
                      if n in line: hits[n]+=1
                if p.wait(): raise SystemExit('DEX inspection failed')
          if not list(target.glob('*.dex')): raise SystemExit('No compiled DEX found')
          for n,count in hits.items(): print(f'{n}: {count} compiled invocation(s)')
          if any(hits.values()): raise SystemExit('Deprecated system bar invocations remain')
          PY
