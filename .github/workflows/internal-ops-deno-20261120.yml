name: TRAYDAQ Operations Deno diagnostics (source only)
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/internal-ops-deno-20261120.yml"
permissions:
  contents: read
jobs:
  deno:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          repository: gideondreams3325/traydaq-v2
          ref: 436f2e4705810058a32b0b93695041d02179150f
          path: private-src
          token: "${{ secrets.TRAYDAQ_V2_SOURCE_READ_TOKEN }}"
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: gideondreams3325/traydaq-v2
          ref: f0f845a2299412c9ccbbe4d7d612c8863a88d19d
          path: baseline-src
          token: "${{ secrets.TRAYDAQ_V2_SOURCE_READ_TOKEN }}"
          persist-credentials: false
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.9.6
      - name: Confirm candidate Edge TypeScript has no new errors versus existing main
        run: |
          failed=0
          for name in firebase-admin-workspace firebase-staff-iphone firebase-native-content firebase-native-video-upload firebase-discussions; do
            candidate="$RUNNER_TEMP/candidate-$name.log"
            baseline="$RUNNER_TEMP/baseline-$name.log"
            deno check --no-config --node-modules-dir=auto --no-lock "private-src/supabase/functions/$name/index.ts" > "$candidate" 2>&1 || true
            deno check --no-config --node-modules-dir=auto --no-lock "baseline-src/supabase/functions/$name/index.ts" > "$baseline" 2>&1 || true
            if node --input-type=module - "$candidate" "$baseline" "$name" <<'NODE'
          import {readFileSync} from 'node:fs';
          const read=p=>readFileSync(p,'utf8').replace(/\x1b\[[0-9;]*m/g,'');
          const errors=p=>{
            const out=[];
            for(const line of read(p).split(/\r?\n/)){
              const match=line.match(/^TS(\d+) \[ERROR\]: (.{0,170})/);
              if(match)out.push(match[1]+":"+match[2].replace(/\s+/g,' ').trim());
            }
            return out;
          };
          const [candidate,baseline]=[errors(process.argv[2]),errors(process.argv[3])];
          const count=arr=>arr.reduce((m,k)=>(m.set(k,(m.get(k)||0)+1),m),new Map());
          const c=count(candidate),b=count(baseline),added=[];
          for(const [signature,n] of c)if(n>(b.get(signature)||0))added.push([signature.split(':')[0],n-(b.get(signature)||0)]);
          const name=process.argv[4];
          console.log(name+': '+candidate.length+' candidate TS errors; '+baseline.length+' baseline TS errors');
          if(added.length){
            console.log('NEW TYPE ERRORS (code,count only): '+JSON.stringify(added));
            process.exit(1);
          }
          const other=p=>read(p).includes('error:')&&!/TS\d+ \[ERROR\]/.test(read(p));
          if(other(process.argv[2])&&!other(process.argv[3])){
            console.log('NEW non-TypeScript check failure');
            process.exit(1);
          }
          console.log('PASS: no new Deno type errors in '+name);
          NODE
            then
              :
            else
              failed=1
            fi
          done
          exit "$failed"
# No APK, AAB, deployment or database writes.
