name: TRAYDAQ Internal Operations PR544 source-only validation

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/internal-operations-pr544-validation.yml"

permissions:
  contents: read

concurrency:
  group: traydaq-internal-operations-pr544-qa
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      CI: "1"
    steps:
      - name: Verify private source token exists
        env:
          SOURCE_TOKEN_CONFIGURED: "${{ secrets.TRAYDAQ_V2_SOURCE_READ_TOKEN != '' }}"
        run: |
          if [ "$SOURCE_TOKEN_CONFIGURED" != "true" ]; then
            echo "::error::Read-only TRAYDAQ source token missing"
            exit 1
          fi
      - name: Check out private PR 544 source without persisting credentials
        uses: actions/checkout@v4
        with:
          repository: gideondreams3325/traydaq-v2
          ref: f5fda85c05f65af6f1d9d7f18f3bf3fab5798625
          path: private-src
          token: "${{ secrets.TRAYDAQ_V2_SOURCE_READ_TOKEN }}"
          persist-credentials: false
          fetch-depth: 1
      - name: Prepare Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: private-src/package-lock.json
      - name: Install private dependencies
        working-directory: private-src
        run: |
          if npm ci --no-audit --no-fund > "$RUNNER_TEMP/traydaq-ops-install.log" 2>&1; then
            echo "PASS: dependencies installed"
          else
            echo "::error::FAIL: dependency installation; details remain private"
            exit 1
          fi
      - name: Verify operations security and source contracts
        working-directory: private-src
        run: |
          if node --test tests/internal-operations-foundation-20261120.test.mjs tests/internal-operations-expanded-20261120.test.mjs tests/internal-operations-support-diagnostics-20261120.test.mjs > "$RUNNER_TEMP/traydaq-ops-tests.log" 2>&1; then
            echo "PASS: operations source tests"
            grep -E '^# (tests|pass|fail) [0-9]+$' "$RUNNER_TEMP/traydaq-ops-tests.log" || true
          else
            echo "::error::FAIL: operations source tests"
            grep "^not ok " "$RUNNER_TEMP/traydaq-ops-tests.log" | cut -d " " -f3 || true
            grep -E '^# (tests|pass|fail) [0-9]+$' "$RUNNER_TEMP/traydaq-ops-tests.log" || true
            exit 1
          fi
      - name: Preflight candidate web TypeScript before long regressions
        working-directory: private-src
        run: |
          if npm run typecheck > "$RUNNER_TEMP/traydaq-ops-preflight-tsc.log" 2>&1; then
            echo "PASS: candidate web TypeScript preflight"
          else
            echo "::warning::Candidate TypeScript preflight errors (basename and TS code only)"
            grep -E 'error TS[0-9]+' "$RUNNER_TEMP/traydaq-ops-preflight-tsc.log" | sed -E 's@.*[/]([^/():]+)\(([0-9]+),[0-9]+\): error (TS[0-9]+).*@\1:\2 \3@' | head -20 || true
          fi
      - name: Run candidate web regressions with sanitized results
        working-directory: private-src
        run: |
          if npm test > "$RUNNER_TEMP/traydaq-ops-all-tests.log" 2>&1; then
            echo "PASS: candidate full web regression suite"
          else
            echo "Candidate has regression failures; comparing against its exact main parent"
          fi
          tail -5 "$RUNNER_TEMP/traydaq-ops-all-tests.log" || true
          node --input-type=module <<'NODE'
          import {readFileSync} from 'node:fs';
          const report=readFileSync(process.env.RUNNER_TEMP+'/traydaq-ops-all-tests.log','utf8');
          const failures=report.split(/\n(?=not ok \d+ - )/).filter(x=>/^not ok \d+ - /.test(x));
          const files=new Set(failures.map(f=>f.match(/tests\/([a-zA-Z0-9._-]+\.test\.mjs)/)?.[1]).filter(Boolean));
          console.log('Failing test file basenames:',[...files].sort().join(', ')||'unknown');
          NODE
      - name: Check out exact main parent for regression comparison
        uses: actions/checkout@v4
        with:
          repository: gideondreams3325/traydaq-v2
          ref: f0f845a2299412c9ccbbe4d7d612c8863a88d19d
          path: baseline-src
          token: "${{ secrets.TRAYDAQ_V2_SOURCE_READ_TOKEN }}"
          persist-credentials: false
          fetch-depth: 1
      - name: Compare candidate and baseline failures without revealing private test names
        working-directory: baseline-src
        run: |
          if npm ci --no-audit --no-fund > "$RUNNER_TEMP/traydaq-ops-baseline-install.log" 2>&1; then
            echo "PASS: baseline dependencies installed"
          else
            echo "::error::FAIL: unable to install baseline"
            exit 1
          fi
          npm test > "$RUNNER_TEMP/traydaq-ops-baseline-tests.log" 2>&1 || true
          grep -E '^# (tests|pass|fail) [0-9]+$' "$RUNNER_TEMP/traydaq-ops-baseline-tests.log" | tail -3 || true
          node --input-type=module <<'NODE'
          import {readFileSync} from 'node:fs';
          import {createHash} from 'node:crypto';
          const p=process.env.RUNNER_TEMP;
          const failed=(path)=>[...readFileSync(path,'utf8').matchAll(/^not ok \d+ - (.+)$/gm)]
            .map(x=>createHash('sha256').update(x[1].trim()).digest('hex')).sort();
          const candidate=failed(p+'/traydaq-ops-all-tests.log');
          const baseline=failed(p+'/traydaq-ops-baseline-tests.log');
          if(JSON.stringify(candidate)!==JSON.stringify(baseline)){
            console.log('REGRESSIONS: new or different failures ('+candidate.length+' candidate, '+baseline.length+' baseline).');
            const {writeFileSync}=await import('node:fs');
            writeFileSync(p+'/traydaq-new-regressions.flag','yes');
          }else{
            console.log('PASS: candidate has the same '+candidate.length+' pre-existing failing tests as its base.');
          }
          NODE
      - name: Customer web TypeScript and Cloudflare build
        working-directory: private-src
        run: |
          if npm run typecheck > "$RUNNER_TEMP/traydaq-ops-web-tsc.log" 2>&1 &&
             npm run build > "$RUNNER_TEMP/traydaq-ops-cloudflare-build.log" 2>&1; then
            echo "PASS: web typecheck and Cloudflare build"
          else
            echo "::error::FAIL: web typecheck or Cloudflare build"
            if [ -f "$RUNNER_TEMP/traydaq-ops-web-tsc.log" ]; then
              grep -E 'error TS[0-9]+' "$RUNNER_TEMP/traydaq-ops-web-tsc.log" | sed -E 's@.*[/]([^/():]+)\(([0-9]+),[0-9]+\): error (TS[0-9]+).*@\1:\2 \3@' | head -20 || true
            fi
            exit 1
          fi
      - name: iPhone Staff TypeScript and bundle
        if: always()
        working-directory: private-src
        run: |
          if npm run typecheck:staff > "$RUNNER_TEMP/traydaq-ops-iphone-tsc.log" 2>&1 &&
             npm run build:staff > "$RUNNER_TEMP/traydaq-ops-iphone-build.log" 2>&1; then
            echo "PASS: iPhone Staff typecheck and build"
          else
            echo "::error::FAIL: iPhone Staff validation"
            exit 1
          fi
      - name: Install native Staff dependencies
        if: always()
        working-directory: private-src/admin-native
        run: |
          if npm install --no-audit --no-fund > "$RUNNER_TEMP/traydaq-ops-staff-install.log" 2>&1; then
            echo "PASS: native Staff dependencies installed"
          else
            echo "::error::FAIL: native Staff install"
            exit 1
          fi
      - name: Native Staff TypeScript and security tests
        if: always()
        working-directory: private-src/admin-native
        run: |
          if npm run typecheck > "$RUNNER_TEMP/traydaq-ops-staff-tsc.log" 2>&1 &&
             npm run test:security > "$RUNNER_TEMP/traydaq-ops-staff-tests.log" 2>&1; then
            echo "PASS: native Staff typecheck and security regressions"
            grep -E '^# (tests|pass|fail) [0-9]+$' "$RUNNER_TEMP/traydaq-ops-staff-tests.log" | tail -3 || true
          else
            echo "::error::FAIL: native Staff validation"
            grep -E 'error TS[0-9]+' "$RUNNER_TEMP/traydaq-ops-staff-tsc.log" | sed -E 's@.*[/]([^/():]+)\(([0-9]+),[0-9]+\): error (TS[0-9]+).*@\1:\2 \3@' | head -15 || true
            grep -E '^# (tests|pass|fail) [0-9]+$' "$RUNNER_TEMP/traydaq-ops-staff-tests.log" | tail -3 || true
            exit 1
          fi
      - name: Install Android-user dependencies
        if: always()
        working-directory: private-src/mobile
        run: |
          if npm ci --no-audit --no-fund > "$RUNNER_TEMP/traydaq-ops-user-install.log" 2>&1; then
            echo "PASS: Android user dependencies installed"
          else
            echo "::error::FAIL: Android user dependencies"
            exit 1
          fi
      - name: Android-user TypeScript and source tests
        if: always()
        working-directory: private-src/mobile
        run: |
          if npm run typecheck > "$RUNNER_TEMP/traydaq-ops-user-tsc.log" 2>&1 &&
             node --test tests/*.test.mjs > "$RUNNER_TEMP/traydaq-ops-user-tests.log" 2>&1; then
            echo "PASS: Android user TypeScript and tests"
             tail -3 "$RUNNER_TEMP/traydaq-ops-user-tests.log" || true
          else
            echo "::error::FAIL: Android user validation"
            grep -E 'error TS[0-9]+' "$RUNNER_TEMP/traydaq-ops-user-tsc.log" | sed -E 's@.*[/]([^/():]+)\(([0-9]+),[0-9]+\): error (TS[0-9]+).*@\1:\2 \3@' | head -15 || true
             tail -3 "$RUNNER_TEMP/traydaq-ops-user-tests.log" || true
            exit 1
          fi
      - name: Prepare Deno
        if: always()
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.9.6
      - name: Confirm modified Edge Functions have no new Deno type errors
        if: always()
        working-directory: private-src
        run: |
          failed=0
          for name in firebase-admin-workspace firebase-staff-iphone firebase-native-content firebase-native-video-upload firebase-discussions; do
            candidate="$RUNNER_TEMP/candidate-$name.log"
            baseline="$RUNNER_TEMP/baseline-$name.log"
            deno check --no-config --node-modules-dir=auto --no-lock "supabase/functions/$name/index.ts" > "$candidate" 2>&1 || true
            (cd ../baseline-src && deno check --no-config --node-modules-dir=auto --no-lock "supabase/functions/$name/index.ts") > "$baseline" 2>&1 || true
            if node --input-type=module - "$candidate" "$baseline" "$name" <<'NODE'
          import {readFileSync} from 'node:fs';
          const failures=p=>[...readFileSync(p,'utf8')
            .replace(/\x1b\[[0-9;]*m/g,'')
            .matchAll(/^TS(\d+) \[ERROR\]: (.{0,170})$/gm)]
            .map(x=>x[1]+':'+x[2].replace(/\s+/g,' ').trim());
          const [candidate,baseline]=[failures(process.argv[2]),failures(process.argv[3])];
          const counts=list=>list.reduce((m,k)=>(m.set(k,(m.get(k)||0)+1),m),new Map());
          const c=counts(candidate),b=counts(baseline);
          const newErrors=[...c].filter(([sig,n])=>n>(b.get(sig)||0));
          const name=process.argv[4];
          console.log(name+': '+candidate.length+' candidate Deno errors; '+baseline.length+' existing errors');
          if(newErrors.length){
            console.log('NEW Deno TS codes: '+newErrors.map(([x])=>x.split(':')[0]).join(','));
            process.exit(1);
          }
          console.log('PASS: no new Deno type errors for '+name);
          NODE
            then :
            else failed=1
            fi
          done
          exit "$failed"
      - name: Enforce no new regression failures
        if: always()
        run: |
          if [ -f "$RUNNER_TEMP/traydaq-new-regressions.flag" ]; then
            echo "::error::Candidate has new regression failures compared with main"
            exit 1
          fi
          echo "PASS: candidate did not add regressions"
# Source validation only. No APK, AAB, signing, deployment, or database writes.
