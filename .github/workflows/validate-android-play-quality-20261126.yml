name: Android Play quality candidate validation
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [".github/workflows/validate-android-play-quality-20261126.yml"]
permissions:
  contents: read
jobs:
  android-quality:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CI: "1"
      EXPO_NO_TELEMETRY: "1"
      NODE_OPTIONS: "--max-old-space-size=6144"
    defaults:
      run:
        working-directory: private-src/mobile
    steps:
      - uses: actions/checkout@v4
        with:
          repository: gideondreams3325/traydaq-v2
          ref: 11e757f02767f255030639c7440920b7dc7b6314
          path: private-src
          token: ${{ secrets.TRAYDAQ_V2_SOURCE_READ_TOKEN }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Android SDK
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0" > "$RUNNER_TEMP/sdk.log" 2>&1
      - name: Install
        run: npm ci --no-audit --no-fund > "$RUNNER_TEMP/install.log" 2>&1
      - name: Native tests
        run: |
          set +e
          node --test tests/*.test.mjs > "$RUNNER_TEMP/tests.log" 2>&1
          rc=$?
          grep -E '^(not ok|# (tests|pass|fail) [0-9]+)' "$RUNNER_TEMP/tests.log" | cut -c1-180 | head -80
          exit "$rc"
      - name: TypeScript
        run: npm run typecheck > "$RUNNER_TEMP/typecheck.log" 2>&1
      - name: Expo compatibility
        run: |
          npx expo install --check > "$RUNNER_TEMP/expo-check.log" 2>&1 || {
            grep -Ei 'expected version|should be updated|incorrect|error:|^  [@a-z].*expected|^  [@a-z].*installed' "$RUNNER_TEMP/expo-check.log" | cut -c1-180 | head -30 || true
            exit 1
          }
      - name: Expo prebuild
        run: |
          npx expo prebuild --platform android --non-interactive > "$RUNNER_TEMP/prebuild.log" 2>&1 || {
            grep -Ei 'Error:|PluginError|Cannot find module|Unable to verify|Expected Expo|failed' "$RUNNER_TEMP/prebuild.log" | cut -c1-180 | head -30 || true
            exit 1
          }
      - name: Verify generated release optimization configuration
        run: |
          for key in android.enableMinifyInReleaseBuilds android.enableShrinkResourcesInReleaseBuilds android.r8.optimizedResourceShrinking; do
            grep -Fx "$key=true" android/gradle.properties
          done
          grep -q 'proguard-android-optimize.txt' android/app/build.gradle
          echo "PASS: generated optimized release configuration"
      - name: Build release bundle locally on runner without production credentials
        working-directory: private-src/mobile/android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon :app:bundleRelease > "$RUNNER_TEMP/gradle.log" 2>&1 || {
            grep -E '^> Task .*FAILED|^Execution failed for task|^BUILD FAILED|^\* What went wrong:' "$RUNNER_TEMP/gradle.log" | cut -c1-160 | head -30
            exit 1
          }
          test -s app/build/outputs/bundle/release/app-release.aab
          test -s app/build/outputs/mapping/release/mapping.txt
          echo "PASS: local release bundle and R8 mapping produced; no artifact or production submission"
