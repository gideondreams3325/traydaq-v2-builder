name: TRAYDAQ V2 Media 3-Minute Pictures Video QA (No APK)
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/media-quality-3min-20261118.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  web:
    name: Private web tests, TypeScript, Cloudflare build
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Fetch exact private PR 499 source
        uses: actions/checkout@v4
        with:
          repository: gideondreams3325/traydaq-v2
          ref: 79a95ff1b09c7723311eac578dc82aed5c3cfb42
          token: ${{ secrets.TRAYDAQ_V2_SOURCE_READ_TOKEN }}
          persist-credentials: false
          path: private-src
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: private-src/package-lock.json
      - name: Verify source pin and run focused and full web QA privately
        working-directory: private-src
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "79a95ff1b09c7723311eac578dc82aed5c3cfb42"
          check() {
            label="$1"; shift
            if "$@" > "$RUNNER_TEMP/$label.log" 2>&1; then
              echo "::notice::PASS $label"
              grep -E '^# (tests|pass|fail) [0-9]+$' "$RUNNER_TEMP/$label.log" | tail -3 || true
            else
              echo "::error::FAIL $label (private logs not published)"
              grep -E '^# (tests|pass|fail) [0-9]+$' "$RUNNER_TEMP/$label.log" | tail -3 || true
              exit 1
            fi
          }
          check web-install npm ci --no-audit --no-fund
          check media-focused node --test tests/media-quality-3min-pictures-20261118.test.mjs tests/picture-compression-all-uploads.test.mjs tests/unified-photo-video-picker.test.mjs
          check web-types npm run typecheck
          check web-regressions npm test
          check cloudflare-build npm run build
          test -f dist/index.html
          echo "::notice::PASS Cloudflare-targeted output verified; no deployment"

  android:
    name: Private Android tests, TypeScript, JS export (No APK)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      EXPO_NO_TELEMETRY: '1'
    steps:
      - name: Fetch exact private PR 499 source
        uses: actions/checkout@v4
        with:
          repository: gideondreams3325/traydaq-v2
          ref: 79a95ff1b09c7723311eac578dc82aed5c3cfb42
          token: ${{ secrets.TRAYDAQ_V2_SOURCE_READ_TOKEN }}
          persist-credentials: false
          path: private-src
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: private-src/mobile/package-lock.json
      - name: Verify source and run private Android QA
        working-directory: private-src/mobile
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C .. rev-parse HEAD)" = "79a95ff1b09c7723311eac578dc82aed5c3cfb42"
          check() {
            label="$1"; shift
            if "$@" > "$RUNNER_TEMP/$label.log" 2>&1; then
              echo "::notice::PASS $label"
              grep -E '^# (tests|pass|fail) [0-9]+$' "$RUNNER_TEMP/$label.log" | tail -3 || true
            else
              echo "::error::FAIL $label (private logs not published)"
              grep -E '^# (tests|pass|fail) [0-9]+$' "$RUNNER_TEMP/$label.log" | tail -3 || true
              exit 1
            fi
          }
          check android-install npm ci --no-audit --no-fund
          check media-focused node --test tests/for-you-video-duration-parser.test.mjs tests/for-you-video-review-storage.test.mjs tests/unified-photo-video-picker.test.mjs tests/image-any-original-size.test.mjs
          check android-types npm run typecheck
          check android-regressions node --test tests/*.test.mjs
          check android-js-export npm run export:android
          echo "::notice::PASS Android JS export only; no APK or AAB produced"
