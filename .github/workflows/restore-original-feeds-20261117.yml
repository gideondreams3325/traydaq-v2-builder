name: TRAYDAQ Restore Original Full-Screen Feeds QA (No Release)
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/restore-original-feeds-20261117.yml"

permissions:
  contents: read
concurrency:
  group: traydaq-restore-original-fullscreen-feeds-qa
  cancel-in-progress: true
env:
  PRIVATE_SOURCE_SHA: cd5b3cb1a59fce351652f8cba86c9c4729be4928
  CI: "1"
  EXPO_NO_TELEMETRY: "1"

jobs:
  web:
    name: Original Web Feed QA and Cloudflare Build (no deploy)
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Checkout original feed restoration source
        uses: actions/checkout@v4
        with:
          repository: gideondreams3325/traydaq-v2
          ref: ${{ env.PRIVATE_SOURCE_SHA }}
          path: private-src
          token: ${{ secrets.TRAYDAQ_V2_SOURCE_READ_TOKEN }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: private-src/package-lock.json
      - name: Verify exact source commit
        working-directory: private-src
        run: test "$(git rev-parse HEAD)" = "$PRIVATE_SOURCE_SHA"
      - name: Install web dependencies
        working-directory: private-src
        run: npm ci --no-audit --no-fund
      - name: Validate complete original feed restore and all web regression tests
        working-directory: private-src
        run: npm test
      - name: Typecheck web
        working-directory: private-src
        run: npm run typecheck
      - name: Build Cloudflare-targeted web assets without deploy
        working-directory: private-src
        run: npm run build

  android:
    name: Original Android Full-Screen Feed QA and JS Export (no AAB)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout original feed restoration source
        uses: actions/checkout@v4
        with:
          repository: gideondreams3325/traydaq-v2
          ref: ${{ env.PRIVATE_SOURCE_SHA }}
          path: private-src
          token: ${{ secrets.TRAYDAQ_V2_SOURCE_READ_TOKEN }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: private-src/mobile/package-lock.json
      - name: Verify exact source commit
        working-directory: private-src
        run: test "$(git rev-parse HEAD)" = "$PRIVATE_SOURCE_SHA"
      - name: Install Android dependencies
        working-directory: private-src/mobile
        run: npm ci --no-audit --no-fund
      - name: Validate original feed source contract
        working-directory: private-src
        run: node --test tests/restore-original-immersive-feeds-20261117.test.mjs
      - name: Typecheck Android
        working-directory: private-src/mobile
        run: npm run typecheck
      - name: Expo Android JavaScript export only (NO APK/AAB)
        working-directory: private-src/mobile
        run: npm run export:android
