name: TRAYDAQ Media Publication Edge Typecheck (No Deploy)
on:
  push:
    branches: [main]
    paths: [".github/workflows/media-publication-edge-typecheck-20261118.yml"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    name: Private media helper typecheck + baseline error comparison
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          repository: gideondreams3325/traydaq-v2
          ref: f3eff7ee1c0b9fa28f01316e3321c082a5f0b1e6
          path: candidate
          token: ${{ secrets.TRAYDAQ_V2_SOURCE_READ_TOKEN }}
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: gideondreams3325/traydaq-v2
          ref: 4649e8cc912a29804ab1cbeef05b28aca96104f9
          path: baseline
          token: ${{ secrets.TRAYDAQ_V2_SOURCE_READ_TOKEN }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check pinned versions
        run: |
          test "$(git -C candidate rev-parse HEAD)" = "f3eff7ee1c0b9fa28f01316e3321c082a5f0b1e6"
          test "$(git -C baseline rev-parse HEAD)" = "4649e8cc912a29804ab1cbeef05b28aca96104f9"
      - name: Strict Deno semantic check of new media helper
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/candidate-fn"
          cp -R candidate/supabase/functions/. "$RUNNER_TEMP/candidate-fn/"
          if npx --yes deno@2.9.6 check --no-config --node-modules-dir=auto --no-lock "$RUNNER_TEMP/candidate-fn/_shared/promoteApprovedCreatorAsset.ts" > "$RUNNER_TEMP/helper.log" 2>&1; then
            echo "::notice::PASS media helper semantic Deno check"
          else
            echo "::error::FAIL media helper semantic Deno check (private details withheld)"
            exit 1
          fi
      - name: Compare creator and security Deno diagnostics to unchanged main
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/baseline-fn"
          cp -R baseline/supabase/functions/. "$RUNNER_TEMP/baseline-fn/"
          rc_candidate=0
          npx --yes deno@2.9.6 check --no-config --node-modules-dir=auto --no-lock "$RUNNER_TEMP/candidate-fn/firebase-native-content/index.ts" "$RUNNER_TEMP/candidate-fn/firebase-security-hub/index.ts" > "$RUNNER_TEMP/candidate.log" 2>&1 || rc_candidate=$?
          rc_baseline=0
          npx --yes deno@2.9.6 check --no-config --node-modules-dir=auto --no-lock "$RUNNER_TEMP/baseline-fn/firebase-native-content/index.ts" "$RUNNER_TEMP/baseline-fn/firebase-security-hub/index.ts" > "$RUNNER_TEMP/baseline.log" 2>&1 || rc_baseline=$?
          python3 - "$RUNNER_TEMP/candidate.log" "$RUNNER_TEMP/baseline.log" "$rc_candidate" "$rc_baseline" <<'CHECK'
          import sys,re,collections
          next_log,base_log=sys.argv[1:3]
          next_rc,base_rc=map(int,sys.argv[3:5])
          def counters(path):
            with open(path,encoding='utf-8',errors='ignore') as f:
              return collections.Counter(re.findall(r'TS[0-9]{4,5}',f.read()))
          n,b=counters(next_log),counters(base_log)
          if next_rc==base_rc==0:
            print('PASS: both private Edge handler semantic checks')
          elif next_rc!=0 and base_rc!=0 and n and n==b:
            print('PASS: only unchanged main-baseline Deno diagnostics ('+str(sum(n.values()))+' codes)')
          else:
            print('FAIL: candidate changed Deno type errors or infrastructure check unavailable')
            print('Candidate error codes:',dict(n),'baseline:',dict(b))
            sys.exit(1)
          CHECK
# Read-only. Never deploy code, alter storage settings, or build an APK/AAB.
