name: TRAYDAQ Post Tag Approval Backend Deno QA (no deploy)
on:
  push:
    branches: [main]
    paths: ['.github/workflows/android-post-tag-backend-deno-20261119.yml']
  workflow_dispatch:
permissions:
  contents: read
env:
  PRIVATE_SOURCE_SHA: 91c8c4bdb76131e742fac64006ee4a8e382f5a5f
  DENO_NODE_MODULES_DIR: auto
jobs:
  deno:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          repository: gideondreams3325/traydaq-v2
          ref: ${{ env.PRIVATE_SOURCE_SHA }}
          path: candidate
          token: ${{ secrets.TRAYDAQ_V2_SOURCE_READ_TOKEN }}
          persist-credentials: false
      - name: Verify exact backend candidate
        run: test "$(git -C candidate rev-parse HEAD)" = "$PRIVATE_SOURCE_SHA"
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Check tagged post notification moderation and submission functions
        working-directory: candidate
        run: |
          deno check --node-modules-dir=auto supabase/functions/firebase-native-content/index.ts > "$RUNNER_TEMP/deno-native.log" 2>&1 || { tail -50 "$RUNNER_TEMP/deno-native.log"; exit 1; }
          deno check --node-modules-dir=auto supabase/functions/firebase-security-hub/index.ts > "$RUNNER_TEMP/deno-security.log" 2>&1 || { tail -50 "$RUNNER_TEMP/deno-security.log"; exit 1; }
          echo 'PASS: native post tags, security hub and imported shared modules Deno typecheck.'
# No Supabase deploy, no schema migration, no APK/AAB, and no production write.
