name: TRAYDAQ Private 6 MiB Chunk Storage Live Proof (No User Content)
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/creator-private-chunk-storage-fixture-20261118.yml"
      - ".github/scripts/creator-private-6mib-storage-fixture-20261118.mjs"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: traydaq-private-chunk-storage-proof
  cancel-in-progress: false
jobs:
  isolated-chunk:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          path: builder-control
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: gideondreams3325/traydaq-v2
          ref: 55ce0756c247a048e9e947cbec0b36456494b235
          path: private-src
          token: ${{ secrets.TRAYDAQ_V2_SOURCE_READ_TOKEN }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: private-src/package-lock.json
      - name: Check trusted script and pinned dependency source
        run: |
          node --check builder-control/.github/scripts/creator-private-6mib-storage-fixture-20261118.mjs
          test "$(git -C private-src rev-parse HEAD)" = "55ce0756c247a048e9e947cbec0b36456494b235"
      - name: Install pinned private SDK
        working-directory: private-src
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Confirm 6 MiB private chunk readback and cleanup
        env:
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: node builder-control/.github/scripts/creator-private-6mib-storage-fixture-20261118.mjs
# Does not create users, publish video, run erasure or modify existing buckets.
