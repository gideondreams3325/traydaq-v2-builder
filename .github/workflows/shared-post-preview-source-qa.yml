name: TRAYDAQ Share Preview Source Validation (No APK)
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/traydaq-shared-post-preview-validation-request.txt"
permissions:
  contents: read
jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: private-src
    steps:
      - uses: actions/checkout@v4
        with:
          repository: gideondreams3325/traydaq-v2
          ref: fix/shared-post-media-preview-20261109
          path: private-src
          token: ${{ secrets.TRAYDAQ_V2_SOURCE_READ_TOKEN }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install
        run: npm ci --no-audit --no-fund
      - name: Check share metadata source
        run: node --check worker/seo.js && node --check worker/publicSearch.js
      - name: Test public link previews
        run: node --test tests/shared-post-link-preview.test.mjs tests/google-public-indexing.test.mjs
      - name: All web tests
        run: npm test
      - name: Web typecheck
        run: npm run typecheck
      - name: Web build without deployment
        run: npm run build
