name: TRAYDAQ STAFF source verification (no APK)
on:
  workflow_dispatch:
  # Run Admin-only source validation for a deliberately committed request.
  # This workflow does NOT generate, sign, or publish an APK.
  push:
    branches: [main]
    paths:
      - ".github/workflows/admin-source-check.yml"
      - ".github/traydaq-admin-source-check-request.txt"

permissions:
  contents: read

jobs:
  source-check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: private-src/admin-native
    steps:
      - name: Checkout private TRAYDAQ V2 Admin sources
        uses: actions/checkout@v4
        with:
          repository: gideondreams3325/traydaq-v2
          ref: feat/standalone-admin-native
          token: ${{ secrets.TRAYDAQ_V2_SOURCE_READ_TOKEN }}
          path: private-src
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Admin access contracts
        run: npm run test:security
      - name: Install TypeScript dependencies
        run: npm install --no-audit --no-fund
      - name: Typecheck React Native screens
        run: npm run typecheck
      - name: Install user web dependencies for source checks
        working-directory: private-src
        run: npm install --no-audit --no-fund
      - name: Typecheck user web and shared components
        working-directory: private-src
        run: npm run typecheck
      - name: Install user Android TypeScript dependencies
        working-directory: private-src/mobile
        run: npm install --no-audit --no-fund
      - name: Typecheck user Android source
        working-directory: private-src/mobile
        run: npm run typecheck
      - name: Run user web regression tests
        working-directory: private-src
        run: npm test
      - name: Run user Android regression tests
        working-directory: private-src/mobile
        run: node --test tests/*.test.mjs
      - name: Confirm no APK or signing actions in this workflow
        run: |
          test -f src/departmentModules.ts
          echo "Verified source only. No Android build, signing, or deployment."
