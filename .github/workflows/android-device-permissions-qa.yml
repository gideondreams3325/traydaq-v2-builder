name: TRAYDAQ Android Device Permissions Validation (No APK)
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/android-device-permissions-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
env:
  SOURCE_SHA: 5baf9657d743db582253e9d4c3db8f683ce48c74
jobs:
  android-permissions:
    name: Verify native user permissions and Android manifest
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CI: '1'
      EXPO_NO_TELEMETRY: '1'
    defaults:
      run:
        working-directory: private-src/mobile
    steps:
      - uses: actions/checkout@v4
        with:
          repository: gideondreams3325/traydaq-v2
          ref: ${{ env.SOURCE_SHA }}
          path: private-src
          token: ${{ secrets.TRAYDAQ_V2_SOURCE_READ_TOKEN }}
          persist-credentials: false
          fetch-depth: 1
      - name: Ensure private source access
        env:
          SOURCE_ACCESS: ${{ secrets.TRAYDAQ_V2_SOURCE_READ_TOKEN != '' }}
        run: test "$SOURCE_ACCESS" = true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: private-src/mobile/package-lock.json
      - name: Confirm exact commit and package
        run: |
          test "$(git -C .. rev-parse HEAD)" = "$SOURCE_SHA"
          node - <<'NODE'
          const app=require('./app.json').expo;
          if(app.android.package!=='com.traydaq.app')throw Error('Wrong app package');
          if(app.version!=='1.0.22'||app.android.versionCode!==24)throw Error('Unexpected app version');
          NODE
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Run complete native regression tests and TypeScript
        run: |
          node --test tests/*.test.mjs
          npm run typecheck
      - name: Verify Expo config and Hermes export
        run: |
          npx expo-doctor
          npx expo export --platform android
      - name: Generate native manifest without building APK or AAB
        run: npx expo prebuild --platform android --non-interactive
      - name: Verify effective Android permissions and denied broad access
        run: |
          node - <<'NODE'
          const fs=require('node:fs');
          const app=require('./app.json').expo;
          const manifest=fs.readFileSync('android/app/src/main/AndroidManifest.xml','utf8');
          for(const name of ['CAMERA','RECORD_AUDIO','ACCESS_FINE_LOCATION','ACCESS_COARSE_LOCATION','POST_NOTIFICATIONS','USE_BIOMETRIC']){
            const full='android.permission.'+name;
            if(!manifest.includes(full))throw Error('Missing effective manifest permission '+full);
          }
          // Expo writes tools:node="remove" into this source manifest for blocked permissions.
          // Confirm the overlay privilege is explicitly removed rather than treating that
          // removal marker as an enabled manifest permission.
          if(!app.android.blockedPermissions.includes('android.permission.SYSTEM_ALERT_WINDOW')){
            throw Error('Android overlay permission must stay blocked');
          }
          const picker=app.plugins.find(x=>Array.isArray(x)&&x[0]==='expo-image-picker');
          if(picker[1].microphonePermission===false)throw Error('Image picker removes microphone access');
          for(const name of ['READ_CONTACTS','READ_SMS','ACCESS_BACKGROUND_LOCATION','MANAGE_EXTERNAL_STORAGE']){
            if(manifest.includes('android.permission.'+name))throw Error('Unexpected broad permission: '+name);
          }
          const features=[
            'android.hardware.camera','android.hardware.camera.any','android.hardware.camera.front',
            'android.hardware.camera.autofocus','android.hardware.camera.flash','android.hardware.microphone',
            'android.hardware.location','android.hardware.location.gps','android.hardware.location.network',
            'android.hardware.fingerprint'
          ];
          const actual=Array.from(manifest.matchAll(/<uses-feature[^>]*>/g), x=>x[0]);
          for(const name of features){
            const matches=actual.filter(x=>x.includes('android:name="'+name+'"'));
            if(matches.length!==1||!matches[0].includes('android:required="false"'))
              throw Error('Play hardware exclusion persists: '+name+' '+JSON.stringify(matches));
          }
          const required=actual.filter(x=>!x.includes('android:required="false"'));
          if(required.length)console.log('Other declared required features:',required);
          const props=fs.readFileSync('android/gradle.properties','utf8');
          if(!/^android\\.enableMinifyInReleaseBuilds=true$/m.test(props))
            throw Error('R8 release minification must be enabled');
          if(!/^android\\.enableShrinkResourcesInReleaseBuilds=false$/m.test(props))
            throw Error('Resource shrinking must remain disabled during initial R8 rollout');
          const gradle=fs.readFileSync('android/app/build.gradle','utf8');
          if(!/minifyEnabled enableMinifyInReleaseBuilds/.test(gradle))
            throw Error('Gradle release build does not consume R8 minification flag');
          console.log('PASS: release R8 mapping enabled without resource shrinking');
          console.log('PASS: all 10 optional hardware features present in generated Android manifest');
          console.log('PASS: camera, voice, location, notifications and secure device unlock permissions');
          NODE
# This is a source-only validator; never upload a package or trigger Google Play.
