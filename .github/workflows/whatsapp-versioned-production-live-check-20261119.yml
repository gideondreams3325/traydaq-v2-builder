name: TRAYDAQ WhatsApp versioned preview live check (No Release)
on:
  push:
    branches: [main]
    paths: ['.github/workflows/whatsapp-versioned-production-live-check-20261119.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Check exact fresh WhatsApp image and OG URL served on traydaq.com
        shell: bash
        run: |
          python3 - <<'PY'
          import html,re,urllib.request
          post='b7207876-c2c2-4784-bf5e-e02d5acc4a94'
          url='https://traydaq.com/?post='+post+'&pv=20261119b'
          image='https://qpcsruhwqhniprakpoox.supabase.co/storage/v1/object/public/traydaq-native-creator-public/'+post+'/share-poster.jpg'
          req=urllib.request.Request(url,headers={'User-Agent':'WhatsApp/2.24.10.78 A'})
          with urllib.request.urlopen(req,timeout=25) as response:
            data=response.read(180000).decode('utf-8','replace')
            if response.status!=200:raise ValueError('Not 200')
          def meta(key):
            m=re.search(r'<meta property="'+re.escape(key)+r'" content="([^"]+)"',data)
            return html.unescape(m.group(1)) if m else ''
          if meta('og:image')!=image:raise ValueError('Content poster missing from social card')
          if meta('og:url')!=url:raise ValueError('Versioned OG URL not deployed')
          if 'summary_large_image' not in data:raise ValueError('Large preview absent')
          print('PASS production versioned WhatsApp OG preview uses exact public post frame')
          PY
# Read-only, no app or Cloudflare deploy
