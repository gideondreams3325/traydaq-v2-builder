name: TRAYDAQ Video Any Duration Up to 250MiB Source QA (No Release)
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/creator-video-no-duration-250mib-qa-20261119.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: traydaq-video-no-duration-250mib-qa
  cancel-in-progress: false
env:
  PRIVATE_SOURCE_SHA: 7f7ea2a03b87cb19b4acf92be059da510517fc4d
  CI: '1'
  EXPO_NO_TELEMETRY: '1'
jobs:
  web:
    if: github.repository == 'gideondreams3325/traydaq-v2-builder' && github.ref == 'refs/heads/main'
    name: Private web full tests, media checks, TypeScript, Cloudflare build
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: private-src
        shell: bash
    steps:
      - name: Verify private read token
        working-directory: .
        env:
          SOURCE_PRESENT: ${{ secrets.TRAYDAQ_V2_SOURCE_READ_TOKEN != '' }}
        run: test "$SOURCE_PRESENT" = true
      - uses: actions/checkout@v4
        with:
          repository: gideondreams3325/traydaq-v2
          ref: ${{ env.PRIVATE_SOURCE_SHA }}
          token: ${{ secrets.TRAYDAQ_V2_SOURCE_READ_TOKEN }}
          path: private-src
          persist-credentials: false
          fetch-depth: 1
      - name: Verify exact pinned source
        run: test "$(git rev-parse HEAD)" = "$PRIVATE_SOURCE_SHA"
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: private-src/package-lock.json
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund > "$RUNNER_TEMP/install-web.log" 2>&1
      - name: Media and video-focused regressions
        run: |
          node --test tests/creator-large-video-250mb-20261118.test.mjs tests/media-quality-3min-pictures-20261118.test.mjs tests/creator-large-video-worker-recovery-20261118.test.mjs > "$RUNNER_TEMP/target-web.log" 2>&1 || {
            grep -E '^not ok [0-9]+ - |^# (tests|pass|fail)' "$RUNNER_TEMP/target-web.log" | tail -30 || true
            exit 1
          }
      - name: Complete web tests, TypeScript and build
        run: |
          node --test tests/*.test.mjs > "$RUNNER_TEMP/all-web.log" 2>&1 || {
            grep -E '^not ok [0-9]+ - |^# (tests|pass|fail)' "$RUNNER_TEMP/all-web.log" | tail -25 || true
            exit 1
          }
          npm run typecheck > "$RUNNER_TEMP/web-ts.log" 2>&1 || { grep -E 'error TS' "$RUNNER_TEMP/web-ts.log" | head -10 || true; exit 1; }
          npm run build > "$RUNNER_TEMP/web-build.log" 2>&1
          node --check .github/scripts/process-large-creator-video.mjs
          test -f dist/index.html
          echo 'PASS web tests, TypeScript, Cloudflare build and worker syntax'
  android:
    if: github.repository == 'gideondreams3325/traydaq-v2-builder' && github.ref == 'refs/heads/main'
    name: Private Android any-duration tests, full tests, TypeScript, JS export
    runs-on: ubuntu-latest
    timeout-minutes: 50
    defaults:
      run:
        working-directory: private-src/mobile
        shell: bash
    steps:
      - name: Verify private read token
        working-directory: .
        env:
          SOURCE_PRESENT: ${{ secrets.TRAYDAQ_V2_SOURCE_READ_TOKEN != '' }}
        run: test "$SOURCE_PRESENT" = true
      - uses: actions/checkout@v4
        with:
          repository: gideondreams3325/traydaq-v2
          ref: ${{ env.PRIVATE_SOURCE_SHA }}
          token: ${{ secrets.TRAYDAQ_V2_SOURCE_READ_TOKEN }}
          path: private-src
          persist-credentials: false
          fetch-depth: 1
      - name: Verify exact pinned source
        run: test "$(git -C .. rev-parse HEAD)" = "$PRIVATE_SOURCE_SHA"
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: private-src/mobile/package-lock.json
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund > "$RUNNER_TEMP/install-native.log" 2>&1
      - name: Focused duration, security and upload regressions
        run: |
          node --test tests/android-three-minute-video-upload.test.mjs tests/for-you-video-duration-parser.test.mjs tests/for-you-video-review-storage.test.mjs > "$RUNNER_TEMP/target-android.log" 2>&1 || {
            grep -E '^not ok [0-9]+ - |^# (tests|pass|fail)' "$RUNNER_TEMP/target-android.log" | tail -30 || true
            exit 1
          }
      - name: Complete Android tests and TypeScript
        run: |
          node --test tests/*.test.mjs > "$RUNNER_TEMP/all-android.log" 2>&1 || {
            grep -E '^not ok [0-9]+ - |^# (tests|pass|fail)' "$RUNNER_TEMP/all-android.log" | tail -25 || true
            exit 1
          }
          npm run typecheck > "$RUNNER_TEMP/android-ts.log" 2>&1 || { grep -E 'error TS' "$RUNNER_TEMP/android-ts.log" | head -15 || true; exit 1; }
      - name: Android JavaScript export only, no APK or AAB
        run: |
          npm run export:android > "$RUNNER_TEMP/android-export.log" 2>&1 || {
            echo 'Android JS export failed'; exit 1
          }
          echo 'PASS Android tests, TypeScript, JS export; no APK/AAB'
