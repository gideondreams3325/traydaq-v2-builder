name: TRAYDAQ V2 Account Erasure Candidate Validation (No Deployment)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/account-erasure-candidate-validation.yml"
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/account-erasure-candidate-validation.yml"

permissions:
  contents: read

# Immutable owner-approved retention policy candidate. Source validation only; release still disabled.
env:
  ERASURE_CANDIDATE_SHA: 6931ba0cd52f756b0984bbe6b9fd1f28eb65aa7d

jobs:
  erasure-regression:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    name: Self-service deletion + selective retention regression tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout Builder synthetic HTTP harness (public)
        uses: actions/checkout@v4
        with:
          path: builder-control
          persist-credentials: false
      - name: Checkout exact private erasure candidate (read-only)
        uses: actions/checkout@v4
        with:
          repository: gideondreams3325/traydaq-v2
          ref: ${{ env.ERASURE_CANDIDATE_SHA }}
          path: private-src
          token: ${{ secrets.TRAYDAQ_V2_SOURCE_READ_TOKEN }}
          persist-credentials: false
      - name: Verify exact candidate SHA
        working-directory: private-src
        run: test "$(git rev-parse HEAD)" = "$ERASURE_CANDIDATE_SHA"
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install private V2 test dependencies
        working-directory: private-src
        run: npm install --no-audit --no-fund
      - name: Typecheck web app
        working-directory: private-src
        run: npm run typecheck
      - name: Syntax-check isolated Firebase-only deletion proof (without credentials)
        working-directory: private-src
        run: node --check tests/firebase-erasure-live-ci-fixture.mjs
      - name: Syntax-check isolated Supabase Storage erasure fixture
        working-directory: private-src
        run: node --check tests/supabase-storage-erasure-live-ci-fixture.mjs
      - name: Run deletion and provider erasure regressions
        working-directory: private-src
        run: |
          node --test \
            tests/account-erasure-worker.test.mjs \
            tests/account-owner-self-service-erasure.test.mjs \
            tests/account-erasure-live-preflight.test.mjs \
            tests/account-firebase-privacy-holds.test.mjs \
            tests/isolated-firebase-erasure-fixture.test.mjs \
            tests/account-erasure-vault-dispatch.test.mjs \
            tests/account-erasure-readiness-cron.test.mjs \
            tests/account-erasure-release-lock.test.mjs \
            tests/account-erasure-session.test.mjs \
            tests/account-deletion-review-routing.test.mjs \
            tests/member-block-account-deletion-ui.test.mjs \
            tests/account-retention-state.test.mjs \
            tests/account-investigation-retention.test.mjs \
            tests/confidential-case-retention-contract.test.mjs \
            tests/confidential-case-evidence-staging.test.mjs \
            tests/confidential-case-investigator-access.test.mjs \
            tests/confidential-evidence-delivery-audit.test.mjs \
            tests/retention-policy-proposal.test.mjs \
            tests/account-closure-confidential-retention-policy.test.mjs \
            tests/account-closure-private-evidence.test.mjs \
            tests/account-recovery-media-holds.test.mjs \
            tests/account-staging-erasure-holds.test.mjs \
            tests/account-storage-ownership.test.mjs \
            tests/cloudinary-account-erasure-coverage.test.mjs \
            tests/cloudinary-credentials.test.mjs \
            tests/supabase-public-media-cutover.test.mjs \
            tests/cloudinary-admin-erasure-contract.test.mjs \
            tests/release-account-erasure.test.mjs
      - name: Exercise synthetic evidence HTTP delivery and audit failures
        env:
          TRAYDAQ_SOURCE_ROOT: private-src
        run: node --test builder-control/.github/scripts/evidence-http-delivery.test.mjs
      - name: Verify unattended worker gate and unvalidated policy remain separate
        working-directory: private-src
        run: |
          node --input-type=module -e "
            import assert from 'node:assert/strict';
            import {ACCOUNT_ERASURE_RELEASE_VALIDATED} from './supabase/functions/_shared/accountErasureReleaseGate.mjs';
            import {RETENTION_SCHEDULE_VALIDATED} from './supabase/functions/_shared/accountRetentionPolicy.mjs';
            assert.equal(ACCOUNT_ERASURE_RELEASE_VALIDATED,false);
            assert.equal(RETENTION_SCHEDULE_VALIDATED,false);
          "

  android-deletion:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    name: Android deletion workflow parity
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          repository: gideondreams3325/traydaq-v2
          ref: ${{ env.ERASURE_CANDIDATE_SHA }}
          path: private-src
          token: ${{ secrets.TRAYDAQ_V2_SOURCE_READ_TOKEN }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate Android deletion parity (no APK)
        working-directory: private-src/mobile
        run: |
          npm install --no-audit --no-fund
          node --test tests/unified-deletion-parity.test.mjs
          npm run typecheck


  erasure-sql:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    name: Compile deletion migration in isolated PostgreSQL 17
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: local-validation-only
          POSTGRES_DB: erasure_validation
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d erasure_validation"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
        with:
          repository: gideondreams3325/traydaq-v2
          ref: ${{ env.ERASURE_CANDIDATE_SHA }}
          path: private-src
          token: ${{ secrets.TRAYDAQ_V2_SOURCE_READ_TOKEN }}
          persist-credentials: false
      - name: Verify PostgreSQL parser and function permissions
        env:
          PGPASSWORD: local-validation-only
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v psql >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq postgresql-client
          fi
          psql -h 127.0.0.1 -U postgres -d erasure_validation -v ON_ERROR_STOP=1 <<'SQL'
          CREATE ROLE anon;
          CREATE ROLE authenticated;
          CREATE ROLE service_role;
          SQL
          psql -h 127.0.0.1 -U postgres -d erasure_validation -v ON_ERROR_STOP=1 \
            -f private-src/supabase/migrations/20261026084953_account_owner_self_service_erasure_claim.sql
          psql -h 127.0.0.1 -U postgres -d erasure_validation -v ON_ERROR_STOP=1 \
            -f private-src/supabase/migrations/20261026121100_confidential_case_evidence_staging.sql
          psql -h 127.0.0.1 -U postgres -d erasure_validation -v ON_ERROR_STOP=1 <<'SQL'
          DO $test$
          DECLARE item text; result jsonb;
          BEGIN
            FOREACH item IN ARRAY ARRAY[
              'v2_confidential_case_staging','v2_confidential_evidence_staging',
              'v2_confidential_case_access_audit'
            ] LOOP
              IF has_table_privilege('anon','traydaq_private.'||item,'SELECT') OR
                 has_table_privilege('authenticated','traydaq_private.'||item,'SELECT') OR
                 has_table_privilege('anon','traydaq_private.'||item,'INSERT') OR
                 has_table_privilege('authenticated','traydaq_private.'||item,'INSERT') OR
                 NOT has_table_privilege('service_role','traydaq_private.'||item,'SELECT')
              THEN RAISE EXCEPTION 'Confidential case access isolation failed: %',item; END IF;
            END LOOP;
            IF has_table_privilege('service_role','traydaq_private.v2_confidential_case_access_audit','DELETE')
             OR has_table_privilege('service_role','traydaq_private.v2_confidential_case_access_audit','UPDATE')
             OR has_function_privilege('anon','traydaq_private.v2_confidential_case_reviews_due()','EXECUTE')
             OR has_function_privilege('authenticated','traydaq_private.v2_confidential_case_reviews_due()','EXECUTE')
             OR NOT has_function_privilege('service_role','traydaq_private.v2_confidential_case_reviews_due()','EXECUTE')
            THEN RAISE EXCEPTION 'Staging audit or function grants are unsafe'; END IF;
          END $test$;
          INSERT INTO traydaq_private.v2_confidential_case_staging(
            case_reference,subject_uid_sha256,basis_reference,purpose,review_owner_uid,
            created_at,review_due_at,retain_until
          ) VALUES(
            'CASE.TEST.2026:0001',repeat('a',64),'BASIS.TEST.2026:0001',
            'fraud_investigation','isolated_reviewer',
            now()-interval '2 days',now()-interval '1 day',now()+interval '1 day'
          );
          DO $test$ BEGIN
            IF (SELECT count(*) FROM traydaq_private.v2_confidential_case_reviews_due()) <> 1
            THEN RAISE EXCEPTION 'Retention-review inventory did not list due test case'; END IF;
            IF (SELECT count(*) FROM traydaq_private.v2_confidential_evidence_staging) <> 0
            THEN RAISE EXCEPTION 'Staging must contain no media'; END IF;
          END $test$;
          SQL
          psql -h 127.0.0.1 -U postgres -d erasure_validation -v ON_ERROR_STOP=1 <<'SQL'
          CREATE SCHEMA auth;
          CREATE FUNCTION auth.jwt() RETURNS jsonb
          LANGUAGE sql STABLE AS $fn$
            SELECT jsonb_build_object('role',coalesce(current_setting('request.jwt.claim.role',true),'service_role'))
          $fn$;
          CREATE TABLE public.v2_security_staff(
            firebase_uid text PRIMARY KEY,verified_email text NOT NULL,
            role text NOT NULL,active boolean NOT NULL
          );
          INSERT INTO public.v2_security_staff VALUES
            ('isolatedOwner1','owner@example.invalid','owner',true),
            ('isolatedAnalyst1','analyst@example.invalid','analyst',true),
            ('revokedAnalyst1','revoked@example.invalid','analyst',false);
          SQL
          psql -h 127.0.0.1 -U postgres -d erasure_validation -v ON_ERROR_STOP=1 \
            -f private-src/supabase/migrations/20261026131600_confidential_case_access_custody_controls.sql
          psql -h 127.0.0.1 -U postgres -d erasure_validation -v ON_ERROR_STOP=1 \
            -f private-src/supabase/migrations/20261026133700_confidential_evidence_delivery_audit.sql
          psql -h 127.0.0.1 -U postgres -d erasure_validation -v ON_ERROR_STOP=1 <<'SQL'
          SELECT set_config('request.jwt.claim.role','service_role',false);
          INSERT INTO traydaq_private.v2_confidential_case_staging(
            case_reference,subject_uid_sha256,basis_reference,purpose,review_owner_uid,
            review_due_at,retain_until
          ) VALUES(
            'CASE.FRAUD.TEST.002',
            encode(sha256(convert_to('syntheticUser1','UTF8')),'hex'),
            'BASIS.FRAUD.TEST.002','fraud_investigation','isolatedOwner1',
            now()+interval '2 days',now()+interval '20 days'
          );
          INSERT INTO traydaq_private.v2_confidential_evidence_staging(
            case_id,kind,source_reference_sha256,content_sha256)
          SELECT case_id,'identity_verification_photo',
            encode(sha256(convert_to('v2-identity-review-selfies:syntheticUser1/fixture.png','UTF8')),'hex'),
            encode(sha256(convert_to('fixture-png-content','UTF8')),'hex')
          FROM traydaq_private.v2_confidential_case_staging
          WHERE case_reference='CASE.FRAUD.TEST.002';
          DO $test$
          DECLARE cid uuid; eid uuid; grant_id uuid; auth jsonb; prepared jsonb;
          BEGIN
           SELECT case_id INTO cid FROM traydaq_private.v2_confidential_case_staging
           WHERE case_reference='CASE.FRAUD.TEST.002';
           SELECT evidence_id INTO eid FROM traydaq_private.v2_confidential_evidence_staging
           WHERE case_id=cid;
           grant_id:=public.v2_case_grant_investigator(
             'isolatedOwner1','owner@example.invalid',cid,
             'isolatedAnalyst1','metadata',now()+interval '1 hour','CASE_FRAUD_TEST');
           IF grant_id IS NULL THEN RAISE EXCEPTION 'Cannot create test scoped grant'; END IF;
           auth:=public.v2_case_authorized_access(
             'isolatedAnalyst1','analyst@example.invalid',cid,
             'metadata',NULL,'CASE_FRAUD_TEST');
           IF auth->>'authorized'<>'true' THEN RAISE EXCEPTION 'Metadata grant did not authorize'; END IF;
           auth:=public.v2_case_authorized_access(
             'isolatedAnalyst1','analyst@example.invalid',cid,
             'download',eid,'CASE_FRAUD_TEST');
           IF auth->>'authorized'<>'false' THEN RAISE EXCEPTION 'Download was not denied'; END IF;
           prepared:=public.v2_case_preservation_authorize(
             'isolatedOwner1','owner@example.invalid',cid,eid,'syntheticUser1',
             'v2-identity-review-selfies','syntheticUser1/fixture.png');
           IF prepared->>'kind'<>'identity_verification_photo'
           THEN RAISE EXCEPTION 'Case-to-subject source preflight failed'; END IF;
           IF (SELECT count(*) FROM traydaq_private.v2_confidential_case_access_audit WHERE case_id=cid)<>3
           THEN RAISE EXCEPTION 'Access audit event count mismatch'; END IF;
           IF has_table_privilege('anon','traydaq_private.v2_confidential_case_grants','SELECT')
             OR has_table_privilege('authenticated','traydaq_private.v2_confidential_case_custody','SELECT')
             OR has_function_privilege('anon',
              'public.v2_case_authorized_access(text,text,uuid,text,uuid,text)','EXECUTE')
             OR has_function_privilege('authenticated',
              'public.v2_case_grant_investigator(text,text,uuid,text,text,timestamp with time zone,text)','EXECUTE')
           THEN RAISE EXCEPTION 'Client grants are unsafe'; END IF;
          END $test$;
          SELECT traydaq_private.v2_confidential_case_record_due_reviews();
          DO $test$ BEGIN
            IF (SELECT count(*) FROM traydaq_private.v2_confidential_case_review_notices)<>1
            THEN RAISE EXCEPTION 'Review-due notification not recorded once'; END IF;
          END $test$;
          SQL
          psql -h 127.0.0.1 -U postgres -d erasure_validation -v ON_ERROR_STOP=1 <<'SQL'
          DO $test$
          DECLARE cid uuid; eid uuid; digest text; receipt jsonb; ok boolean;
          BEGIN
           SELECT case_id INTO cid FROM traydaq_private.v2_confidential_case_staging
            WHERE case_reference='CASE.FRAUD.TEST.002';
           SELECT evidence_id,content_sha256 INTO eid,digest
            FROM traydaq_private.v2_confidential_evidence_staging WHERE case_id=cid;
           INSERT INTO traydaq_private.v2_confidential_case_custody(
            evidence_id,case_id,object_path,content_sha256,size_bytes,verified_by_uid)
           VALUES(eid,cid,cid::text||'/'||eid::text||'/'||gen_random_uuid()::text||'.png',
            digest,68,'isolatedOwner1');
           PERFORM public.v2_case_grant_investigator(
            'isolatedOwner1','owner@example.invalid',cid,
            'isolatedAnalyst1','download',now()+interval '1 hour','CASE_FRAUD_TEST');
           receipt=public.v2_case_authorized_access(
            'isolatedAnalyst1','analyst@example.invalid',cid,
            'download',eid,'CASE_FRAUD_TEST');
           IF receipt->>'authorized'<>'true'
             THEN RAISE EXCEPTION 'Synthetic access request not authorized'; END IF;
           IF (SELECT count(*) FROM traydaq_private.v2_confidential_case_access_audit
             WHERE case_id=cid AND action='evidence_access_requested' AND evidence_id=eid)<>1
             THEN RAISE EXCEPTION 'Download request audit missing'; END IF;
           IF (SELECT count(*) FROM traydaq_private.v2_confidential_case_access_audit
             WHERE case_id=cid AND action='evidence_verified_for_delivery')<>0
             THEN RAISE EXCEPTION 'Premature delivery audit'; END IF;
           ok=public.v2_case_log_verified_delivery('isolatedAnalyst1',
            'analyst@example.invalid',cid,eid,digest,'CASE_FRAUD_TEST');
           IF ok IS DISTINCT FROM TRUE
            THEN RAISE EXCEPTION 'Verified delivery audit rejected'; END IF;
           IF (SELECT count(*) FROM traydaq_private.v2_confidential_case_access_audit
             WHERE case_id=cid AND action='evidence_verified_for_delivery'
             AND evidence_id=eid)<>1
             THEN RAISE EXCEPTION 'Delivery must reference exact evidence'; END IF;
           UPDATE traydaq_private.v2_confidential_case_grants SET revoked_at=now()
            WHERE case_id=cid AND actor_uid='isolatedAnalyst1' AND scope='download';
           BEGIN
            PERFORM public.v2_case_log_verified_delivery('isolatedAnalyst1',
             'analyst@example.invalid',cid,eid,digest,'CASE_FRAUD_TEST');
            RAISE EXCEPTION 'Revoked investigator still permitted';
           EXCEPTION WHEN raise_exception THEN
            IF SQLERRM='Revoked investigator still permitted' THEN RAISE; END IF;
           END;
           IF has_function_privilege('anon',
            'public.v2_case_log_verified_delivery(text,text,uuid,uuid,text,text)','EXECUTE')
             OR has_function_privilege('authenticated',
            'public.v2_case_log_verified_delivery(text,text,uuid,uuid,text,text)','EXECUTE')
             THEN RAISE EXCEPTION 'Client privilege on delivery audit'; END IF;
           IF (SELECT count(*) FROM traydaq_private.v2_confidential_case_access_audit
             WHERE case_id=cid AND action='evidence_verified_for_delivery')<>1
             THEN RAISE EXCEPTION 'Revoked grant produced an audit receipt'; END IF;
          END $test$;
          SQL
          result="$(psql -h 127.0.0.1 -U postgres -d erasure_validation -tAc \
            "SELECT has_function_privilege('anon','public.v2_account_erasure_begin_self_service(text,text)','EXECUTE'),has_function_privilege('authenticated','public.v2_account_erasure_begin_self_service(text,text)','EXECUTE'),has_function_privilege('service_role','public.v2_account_erasure_begin_self_service(text,text)','EXECUTE')")"
          test "$result" = "f|f|t"

  erasure-edge:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    name: Deno Edge account erasure static typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          repository: gideondreams3325/traydaq-v2
          ref: ${{ env.ERASURE_CANDIDATE_SHA }}
          path: private-src
          token: ${{ secrets.TRAYDAQ_V2_SOURCE_READ_TOKEN }}
          persist-credentials: false
      - name: Typecheck Edge handler against pinned private source
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/traydaq-erasure-edge"
          cp -R private-src/supabase/functions/. "$RUNNER_TEMP/traydaq-erasure-edge/"
          npx --yes deno@2.9.6 check --no-config --node-modules-dir=auto --no-lock \
            "$RUNNER_TEMP/traydaq-erasure-edge/firebase-account-erasure/index.ts"
          npx --yes deno@2.9.6 check --no-config --node-modules-dir=auto --no-lock \
            "$RUNNER_TEMP/traydaq-erasure-edge/firebase-erasure-isolated-probe/index.ts"
          npx --yes deno@2.9.6 check --no-config --node-modules-dir=auto --no-lock \
            "$RUNNER_TEMP/traydaq-erasure-edge/confidential-case-evidence/index.ts"

# Source-only validation. Never deploy, enable deletion, build an APK,
# package secrets, mutate production accounts, or publish private source.
