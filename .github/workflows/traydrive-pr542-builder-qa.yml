name: Traydrive PR 542 — V2 Builder Source QA (no APK/AAB)
on:
  push:
    branches:
      - validate/traydrive-pr542-20261120
    paths:
      - '.github/workflows/traydrive-pr542-builder-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: traydrive-pr542-exact-source-qa
  cancel-in-progress: true
env:
  CI: '1'
  EXPO_NO_TELEMETRY: '1'
  TRAYDRIVE_SOURCE_SHA: 3a19ae7876f7e5f6a69bb913aaf2575a5a8955a1
jobs:
  transport-source:
    name: Focused transport source/security tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          repository: gideondreams3325/traydaq-v2
          ref: 3a19ae7876f7e5f6a69bb913aaf2575a5a8955a1
          path: private-src
          persist-credentials: false
          fetch-depth: 1
          token: ${{ secrets.TRAYDAQ_V2_SOURCE_READ_TOKEN }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify SHA and run transport regression tests without logging private source
        working-directory: private-src
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$TRAYDRIVE_SOURCE_SHA"
          if node --test tests/traydrive-*.test.mjs > "$RUNNER_TEMP/traydrive-source.log" 2>&1; then
            echo "PASS: Traydrive focused source contract suite"
            grep -E '^# (tests|pass|fail) [0-9]+$' "$RUNNER_TEMP/traydrive-source.log" || true
          else
            echo "::error::FAIL: Traydrive source test suite; source and failure excerpts are private"
            grep -E '^# (tests|pass|fail) [0-9]+$' "$RUNNER_TEMP/traydrive-source.log" || true
            exit 1
          fi

  web-cloudflare:
    name: Root tests, TypeScript and Cloudflare web asset build
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          repository: gideondreams3325/traydaq-v2
          ref: 3a19ae7876f7e5f6a69bb913aaf2575a5a8955a1
          path: private-src
          persist-credentials: false
          fetch-depth: 1
          token: ${{ secrets.TRAYDAQ_V2_SOURCE_READ_TOKEN }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: private-src/package-lock.json
      - name: Install pinned private dependencies without source logs
        id: root_install
        working-directory: private-src
        shell: bash
        run: |
          if npm ci --no-audit --no-fund > "$RUNNER_TEMP/traydrive-web-install.log" 2>&1; then
            echo "PASS: private root dependencies installed"
          else
            echo "::error::FAIL: root dependency installation"
            exit 1
          fi
      - name: Run entire root regression suite
        working-directory: private-src
        shell: bash
        run: |
          if npm test > "$RUNNER_TEMP/traydrive-root-tests.log" 2>&1; then
            echo "PASS: root regression suite"
            grep -E '^# (tests|pass|fail) [0-9]+$' "$RUNNER_TEMP/traydrive-root-tests.log" | tail -3 || true
          else
            echo "::error::FAIL: root regression suite (private logs not published)"
            grep -E '^# (tests|pass|fail) [0-9]+$' "$RUNNER_TEMP/traydrive-root-tests.log" | tail -3 || true
            grep -E '^not ok [0-9]+ - ' "$RUNNER_TEMP/traydrive-root-tests.log" | sed -E 's/[^A-Za-z0-9 _:,.-]/-/g' | cut -c 1-125 | head -10 || true
            exit 1
          fi
      - name: TypeScript and Cloudflare-targeted build (never deploy)
        if: always() && steps.root_install.outcome == 'success'
        working-directory: private-src
        shell: bash
        run: |
          if npm run typecheck > "$RUNNER_TEMP/traydrive-web-ts.log" 2>&1; then
            echo "PASS: web TypeScript"
          else
            echo "::error::FAIL: web TypeScript"
            grep -oE 'error TS[0-9]+' "$RUNNER_TEMP/traydrive-web-ts.log" | sort | uniq -c | head -15 || true
            exit 1
          fi
          if npm run build > "$RUNNER_TEMP/traydrive-web-build.log" 2>&1 && test -f dist/index.html; then
            echo "PASS: Cloudflare web assets build (no deployment)"
          else
            echo "::error::FAIL: Cloudflare web asset build"
            exit 1
          fi

  android-user:
    name: Android source regressions, TypeScript and JavaScript export
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          repository: gideondreams3325/traydaq-v2
          ref: 3a19ae7876f7e5f6a69bb913aaf2575a5a8955a1
          path: private-src
          persist-credentials: false
          fetch-depth: 1
          token: ${{ secrets.TRAYDAQ_V2_SOURCE_READ_TOKEN }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: private-src/mobile/package-lock.json
      - name: Android dependency installation
        working-directory: private-src/mobile
        shell: bash
        run: |
          if npm ci --no-audit --no-fund > "$RUNNER_TEMP/traydrive-android-install.log" 2>&1; then
            echo "PASS: Android dependencies"
          else
            echo "::error::FAIL: Android dependencies"
            exit 1
          fi
      - name: Android focused and full tests, TypeScript and JS export
        working-directory: private-src/mobile
        shell: bash
        run: |
          set -euo pipefail
          failed=0
          for task in 'node --test tests/traydrive-native-source.test.mjs' \
            'node --test tests/*.test.mjs' 'npm run typecheck' 'npm run export:android'; do
            label=$(printf '%s' "$task" | tr -cs 'A-Za-z0-9' '-')
            if bash -lc "$task" > "$RUNNER_TEMP/traydrive-android-$label.log" 2>&1; then
              echo "PASS: $label"
            else
              echo "::error::FAIL: $label"
              grep -oE 'error TS[0-9]+' "$RUNNER_TEMP/traydrive-android-$label.log" | sort | uniq -c | head -15 || true
              node -e 'const fs=require("fs");for(const line of fs.readFileSync(process.argv[1],"utf8").split(/\r?\n/)){const m=line.match(/^([^()]+)\((\d+),(\d+)\): error (TS\d{4}):/);if(m)console.log("SAFE_TS_FILE: "+m[1].split("/").pop()+":"+m[2]+":"+m[3]+" "+m[4]);}' "$RUNNER_TEMP/traydrive-android-$label.log" || true
              grep -E '^# (tests|pass|fail) [0-9]+$' "$RUNNER_TEMP/traydrive-android-$label.log" | tail -3 || true
              grep -E '^not ok [0-9]+ - ' "$RUNNER_TEMP/traydrive-android-$label.log" | sed -E 's/[^A-Za-z0-9 _:,.-]/-/g' | cut -c 1-125 | head -10 || true
              failed=1
            fi
          done
          echo "No APK or AAB was built"
          test "$failed" -eq 0
          echo "No APK or AAB was built"

  staff-android:
    name: Native Staff role isolation, tests and TypeScript
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          repository: gideondreams3325/traydaq-v2
          ref: 3a19ae7876f7e5f6a69bb913aaf2575a5a8955a1
          path: private-src
          persist-credentials: false
          fetch-depth: 1
          token: ${{ secrets.TRAYDAQ_V2_SOURCE_READ_TOKEN }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Native Staff dependency installation
        working-directory: private-src/admin-native
        shell: bash
        run: |
          if npm install --no-audit --no-fund > "$RUNNER_TEMP/traydrive-staff-install.log" 2>&1; then
            echo "PASS: Staff dependencies"
          else
            echo "::error::FAIL: Staff dependencies"
            exit 1
          fi
      - name: Native Staff security suite and TypeScript
        working-directory: private-src/admin-native
        shell: bash
        run: |
          set -euo pipefail
          failed=0
          for task in 'node --test tests/traydrive-department-source.test.mjs' 'npm run test:security' 'npm run typecheck'; do
            label=$(printf '%s' "$task" | tr -cs 'A-Za-z0-9' '-')
            if bash -lc "$task" > "$RUNNER_TEMP/traydrive-staff-$label.log" 2>&1; then
              echo "PASS: $label"
            else
              echo "::error::FAIL: $label"
              grep -oE 'error TS[0-9]+' "$RUNNER_TEMP/traydrive-staff-$label.log" | sort | uniq -c | head -15 || true
              grep -E '^# (tests|pass|fail) [0-9]+$' "$RUNNER_TEMP/traydrive-staff-$label.log" | tail -3 || true
              grep -E '^not ok [0-9]+ - ' "$RUNNER_TEMP/traydrive-staff-$label.log" | sed -E 's/[^A-Za-z0-9 _:,.-]/-/g' | cut -c 1-125 | head -10 || true
              failed=1
            fi
          done
          echo "No APK or AAB was built"
          test "$failed" -eq 0

  deno-edge:
    name: Firebase transport API and private notification dispatcher Deno checks
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          repository: gideondreams3325/traydaq-v2
          ref: 3a19ae7876f7e5f6a69bb913aaf2575a5a8955a1
          path: private-src
          persist-credentials: false
          fetch-depth: 1
          token: ${{ secrets.TRAYDAQ_V2_SOURCE_READ_TOKEN }}
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Source-only Deno typechecks, no Edge deployment
        working-directory: private-src
        shell: bash
        run: |
          for entry in supabase/functions/firebase-traydrive/index.ts supabase/functions/firebase-traydrive-notifications/index.ts; do
            if deno check --node-modules-dir=auto "$entry" > "$RUNNER_TEMP/traydrive-deno.log" 2>&1; then
              echo "PASS: Deno transport typecheck"
            else
              echo "::error::FAIL: Deno source check, entry: $entry"
              grep -Eo 'TS[0-9]{4}|ERR_[A-Z_]+|NetworkError|Module not found|Cannot find|Could not resolve|Failed to fetch|Import failed' "$RUNNER_TEMP/traydrive-deno.log" | sort -u | head -15 || true
              echo "SAFE_DENO_BYTES: $(wc -c < "$RUNNER_TEMP/traydrive-deno.log")"
              node -e 'const fs=require("fs");const raw=fs.readFileSync(process.argv[1],"utf8");const z=raw.replace(/\x1b\[[0-9;]*m/g,"");const codes=[...z.matchAll(/TS\d{4}/g)];let n=0;const seen=new Set();for(const x of codes){const tail=z.slice(x.index,x.index+2500);const m=tail.match(/(?:file:\/\/\/)?([A-Za-z0-9_./-]+\.ts):(\d+):(\d+)/);if(!m)continue;const k=m[1].split("/").slice(-3).join("/") +":"+m[2]+":"+m[3]+" "+x[0];if(seen.has(k))continue;seen.add(k);console.log("SAFE_DENO_TYPE_LOCATION: "+k);if(++n>=60)break;}console.log("SAFE_DENO_TOTAL_CODES: "+codes.length);' "$RUNNER_TEMP/traydrive-deno.log" || true
              node -e 'const fs=require("fs");const lines=fs.readFileSync(process.argv[1],"utf8").replace(/\x1b\[[0-9;]*m/g,"").split(/\r?\n/);let shown=0;for(let i=0;i<lines.length&&shown<30;i++){const err=lines[i].match(/error:\s*(TS\d{4})/);if(!err)continue;for(let j=i+1;j<Math.min(lines.length,i+20);j++){const at=lines[j].match(/at file:\/\/\/?([^\s]+\.ts):(\d+):(\d+)/);if(!at)continue;console.log("SAFE_DENO_LOC: "+at[1].split("/").slice(-3).join("/") +":"+at[2]+":"+at[3]+" "+err[1]);shown++;break;}}' "$RUNNER_TEMP/traydrive-deno.log" || true
              node -e 'const fs=require("fs");const lines=fs.readFileSync(process.argv[1],"utf8").split(/\r?\n/).filter(Boolean).slice(0,3);for(const line of lines)console.log("SAFE_DENO_HEAD: "+line.replace(/https?:\/\/\S+/g,"[URL]").replace(/\/home\/runner\/\S+/g,"[PRIVATE_PATH]").slice(0,160));' "$RUNNER_TEMP/traydrive-deno.log" || true
              exit 1
            fi
          done

  main-baseline-root:
    name: Control - exact pre-Traydrive main base full root tests
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          repository: gideondreams3325/traydaq-v2
          ref: 89be3c4c616f916a8aad119f29b926970c6f809a
          path: baseline-src
          persist-credentials: false
          fetch-depth: 1
          token: ${{ secrets.TRAYDAQ_V2_SOURCE_READ_TOKEN }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: baseline-src/package-lock.json
      - name: Install pre-feature locked dependencies
        working-directory: baseline-src
        shell: bash
        run: |
          if npm ci --no-audit --no-fund > "$RUNNER_TEMP/traydrive-baseline-install.log" 2>&1; then
            echo "PASS: pre-Traydrive baseline dependencies installed"
          else
            echo "::error::FAIL: baseline dependency install"
            exit 1
          fi
      - name: Compare original root tests without publishing private code
        working-directory: baseline-src
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "89be3c4c616f916a8aad119f29b926970c6f809a"
          if npm test > "$RUNNER_TEMP/traydrive-baseline-tests.log" 2>&1; then
            echo "PASS: pre-Traydrive root regression suite"
          else
            echo "::error::FAIL: pre-Traydrive root regression suite"
            grep -E '^# (tests|pass|fail) [0-9]+$' "$RUNNER_TEMP/traydrive-baseline-tests.log" | tail -3 || true
            grep -E '^not ok [0-9]+ - ' "$RUNNER_TEMP/traydrive-baseline-tests.log" | sed -E 's/[^A-Za-z0-9 _:,.-]/-/g' | cut -c 1-125 | head -15 || true
            exit 1
          fi
