name: TRAYDAQ V2 Public Browsing Access Validation (No Deployment)

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/all-ages-public-browse-validation.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: traydaq-public-browse-validation
  cancel-in-progress: false

jobs:
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out private V2 source only
        uses: actions/checkout@v4
        with:
          repository: gideondreams3325/traydaq-v2
          ref: f0ef1748b9d9331b6c9407dc013e92373d799456
          path: private-src
          token: ${{ secrets.TRAYDAQ_V2_SOURCE_READ_TOKEN }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install web dependencies
        working-directory: private-src
        run: npm ci --no-audit --no-fund
      - name: All-ages public access policy tests
        working-directory: private-src
        run: node --test tests/all-ages-public-access.test.mjs
      - name: Full source tests
        working-directory: private-src
        run: npm test
      - name: Web TypeScript
        working-directory: private-src
        if: always()
        run: npm run typecheck
      - name: Build web
        working-directory: private-src
        if: always()
        run: npm run build

  android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out private V2 source only
        uses: actions/checkout@v4
        with:
          repository: gideondreams3325/traydaq-v2
          ref: f0ef1748b9d9331b6c9407dc013e92373d799456
          path: private-src
          token: ${{ secrets.TRAYDAQ_V2_SOURCE_READ_TOKEN }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install native dependencies
        working-directory: private-src/mobile
        run: npm install --no-audit --no-fund
      - name: Native test suite
        working-directory: private-src/mobile
        run: node --test tests/*.test.mjs
      - name: Native TypeScript
        working-directory: private-src/mobile
        if: always()
        run: npm run typecheck
      - name: Expo configuration check
        working-directory: private-src/mobile
        if: always()
        run: npx expo-doctor

# Validation only. Do not publish packages, deploy the web, or copy private code.
