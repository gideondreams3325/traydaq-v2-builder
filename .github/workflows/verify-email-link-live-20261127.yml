name: Verify TRAYDAQ live email verification fallback
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/verify-email-link-live-20261127.yml']
permissions:
  contents: read
jobs:
  live-route:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Verify canonical production route and app association
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 12); do
            if curl -fsS --max-time 12 -D "$RUNNER_TEMP/headers" https://traydaq.com/auth/verify-email -o "$RUNNER_TEMP/page" &&
               grep -qi '^referrer-policy: no-referrer' "$RUNNER_TEMP/headers" &&
               grep -qi '^x-robots-tag: noindex, nofollow' "$RUNNER_TEMP/headers" &&
               grep -qi '^cache-control:.*no-store' "$RUNNER_TEMP/headers" &&
               grep -q 'id="root"' "$RUNNER_TEMP/page"; then
              echo "Dedicated production verification route is available with private headers"
              break
            fi
            if [ "$attempt" -eq 12 ]; then echo "Production route not verified"; exit 1; fi
            sleep 10
          done
          curl -fsS --max-time 15 https://traydaq.com/.well-known/assetlinks.json -o "$RUNNER_TEMP/assetlinks"
          python -c 'import json,sys; x=json.load(open(sys.argv[1])); assert any(a.get("target",{}).get("package_name")=="com.traydaq.app" and "delegate_permission/common.handle_all_urls" in a.get("relation",[]) and a.get("target",{}).get("sha256_cert_fingerprints") for a in x); print("Android App Links association present")' "$RUNNER_TEMP/assetlinks"
